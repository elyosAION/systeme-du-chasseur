<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Système du Chasseur</title>
<meta name="theme-color" content="#0a0a0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { void: '#0a0a0c', panel: '#121214', neon: '#00f0ff', umbra: '#8b5cf6', ash: '#8b8f9c', blood: '#ff3b5c' },
        fontFamily: {
          display: ['Oxanium', 'system-ui', 'sans-serif'],
          body: ['Barlow', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
        }
      }
    }
  };
</script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  [hidden] { display: none !important; }
  /* Layout : colonne unique façon HUD (560px max), fenêtres « Système » empilées, navigation basse fixe à 5 onglets.
     Direction volontairement mono-thème (sombre) : l'interface du Système n'existe pas en clair. */
  :root {
    --void: #0a0a0c;
    --panel: #121214;
    --panel-2: #18181d;
    --line: #262630;
    --neon: #00f0ff;
    --umbra: #8b5cf6;
    --text: #e6e9ef;
    --muted: #8b8f9c;
    --blood: #ff3b5c;
    --ok: #3ef0a4;
    --font-display: 'Oxanium', system-ui, sans-serif;
    --font-body: 'Barlow', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--void); color: var(--text); }
  body {
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100%;
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(139, 92, 246, .14), transparent 60%),
      radial-gradient(900px 400px at -10% 30%, rgba(0, 240, 255, .07), transparent 60%),
      var(--void);
    background-attachment: fixed;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40;
    background: var(--void);
  }
  .wrap {
    max-width: 560px; margin: 0 auto; position: relative; z-index: 2;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px calc(110px + env(safe-area-inset-bottom, 0px));
  }
  .f-display { font-family: var(--font-display); }
  .f-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  h1, h2, h3 { text-wrap: balance; }

  /* Fenêtre Système */
  .sys {
    position: relative;
    background: linear-gradient(180deg, rgba(0, 240, 255, .055), rgba(18, 18, 20, .94) 120px), var(--panel);
    border: 1px solid rgba(0, 240, 255, .35);
    box-shadow: inset 0 0 0 1px rgba(0, 240, 255, .05), 0 0 28px rgba(0, 240, 255, .08);
    padding: 16px;
  }
  .sys::before {
    content: ""; position: absolute; inset: -1px; pointer-events: none;
    background:
      linear-gradient(var(--neon), var(--neon)) top left / 16px 2px no-repeat,
      linear-gradient(var(--neon), var(--neon)) top left / 2px 16px no-repeat,
      linear-gradient(var(--neon), var(--neon)) top right / 16px 2px no-repeat,
      linear-gradient(var(--neon), var(--neon)) top right / 2px 16px no-repeat,
      linear-gradient(var(--neon), var(--neon)) bottom left / 16px 2px no-repeat,
      linear-gradient(var(--neon), var(--neon)) bottom left / 2px 16px no-repeat,
      linear-gradient(var(--neon), var(--neon)) bottom right / 16px 2px no-repeat,
      linear-gradient(var(--neon), var(--neon)) bottom right / 2px 16px no-repeat;
    filter: drop-shadow(0 0 4px rgba(0, 240, 255, .8));
  }
  .sys.umbra { border-color: rgba(139, 92, 246, .45); box-shadow: inset 0 0 0 1px rgba(139,92,246,.06), 0 0 28px rgba(139, 92, 246, .12);
    background: linear-gradient(180deg, rgba(139, 92, 246, .08), rgba(18, 18, 20, .94) 120px), var(--panel); }
  .sys.umbra::before { background-image: none; }
  .sys.danger { border-color: rgba(255, 59, 92, .6); box-shadow: 0 0 32px rgba(255, 59, 92, .2);
    background: linear-gradient(180deg, rgba(255, 59, 92, .1), rgba(18, 18, 20, .96) 140px), var(--panel); }
  .sys.danger::before { filter: drop-shadow(0 0 4px rgba(255, 59, 92, .9)); }
  .sys-title {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    font-size: 12px; color: var(--neon); text-shadow: 0 0 10px rgba(0, 240, 255, .6);
    border: 1px solid rgba(0, 240, 255, .4); padding: 3px 10px;
  }
  .sys-title.u { color: #b79cff; border-color: rgba(139,92,246,.5); text-shadow: 0 0 10px rgba(139,92,246,.7); }
  .sys-title.r { color: var(--blood); border-color: rgba(255,59,92,.6); text-shadow: 0 0 10px rgba(255,59,92,.6); }
  .sys-title .bang { display: inline-grid; place-items: center; width: 16px; height: 16px; border: 1px solid currentColor; font-size: 11px; line-height: 1; }
  .label { font-family: var(--font-display); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .glow { color: var(--neon); text-shadow: 0 0 12px rgba(0, 240, 255, .55); }
  .glow-umbra { color: #b79cff; text-shadow: 0 0 12px rgba(139, 92, 246, .7); }
  .red { color: var(--blood); }

  .bar { height: 8px; background: #1b1b22; border: 1px solid #2a2a35; position: relative; overflow: hidden; }
  .bar > i { position: absolute; inset: 0 auto 0 0; display: block; width: 0;
    background: linear-gradient(90deg, var(--umbra), var(--neon));
    box-shadow: 0 0 12px rgba(0, 240, 255, .7); transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .bar.int > i { background: linear-gradient(90deg, #5b3fd1, var(--umbra)); box-shadow: 0 0 12px rgba(139, 92, 246, .8); }
  .bar.thin { height: 4px; }

  /* Barre de macro avec zone cible */
  .mbar { height: 12px; background: #17171d; border: 1px solid #2a2a35; position: relative; overflow: hidden; }
  .mbar .zone { position: absolute; top: 0; bottom: 0; background: rgba(62, 240, 164, .13); border-left: 1px dashed rgba(62,240,164,.6); border-right: 1px dashed rgba(62,240,164,.6); }
  .mbar .fill { position: absolute; top: 2px; bottom: 2px; left: 0; background: linear-gradient(90deg, #5b3fd1, var(--umbra)); box-shadow: 0 0 10px rgba(139,92,246,.7); transition: width .5s; }
  .mbar.met .fill { background: linear-gradient(90deg, var(--umbra), var(--neon)); box-shadow: 0 0 10px rgba(0,240,255,.7); }
  .mbar.over .fill { background: linear-gradient(90deg, #a03a55, var(--blood)); box-shadow: 0 0 10px rgba(255,59,92,.6); }
  .mbar .tick { position: absolute; top: -1px; bottom: -1px; width: 2px; background: #e6e9ef; opacity: .7; }

  .pip {
    width: 34px; height: 34px; display: grid; place-items: center;
    border: 1px solid #343442; background: #141418; color: var(--muted);
    font-family: var(--font-mono); font-size: 12px; cursor: pointer; transition: all .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .pip.warm { width: 28px; height: 28px; font-size: 10px; border-style: dashed; }
  .pip.opt { border-style: dashed; }
  .pip.on { border-color: var(--neon); color: #001417; background: var(--neon); box-shadow: 0 0 14px rgba(0, 240, 255, .6); }
  .pip.warm.on { background: rgba(0, 240, 255, .18); color: var(--neon); box-shadow: none; }
  .pip:disabled { opacity: .4; cursor: not-allowed; }
  .pip:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }

  .check { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border: 1px solid #3a3a48; background: #141418; transition: all .15s; }
  .check.on { background: var(--neon); border-color: var(--neon); color: #001417; box-shadow: 0 0 12px rgba(0,240,255,.6); }

  .ex { border: 1px solid var(--line); background: var(--panel-2); padding: 14px; transition: border-color .2s, box-shadow .2s; }
  .ex.done { border-color: rgba(0, 240, 255, .55); box-shadow: 0 0 18px rgba(0, 240, 255, .1); }
  .card { border: 1px solid var(--line); background: var(--panel-2); padding: 12px; }

  .chip { font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    padding: 7px 12px; border: 1px solid #343442; color: var(--muted); background: #131317; cursor: pointer; white-space: nowrap; }
  .chip.on { border-color: var(--neon); color: var(--neon); box-shadow: 0 0 12px rgba(0, 240, 255, .25) inset; }
  .chip.u.on { border-color: var(--umbra); color: #b79cff; box-shadow: 0 0 12px rgba(139, 92, 246, .3) inset; }

  .btn { font-family: var(--font-display); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 13px;
    padding: 11px 16px; border: 1px solid var(--neon); color: var(--neon); background: rgba(0, 240, 255, .06);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all .15s; }
  .btn:hover { background: rgba(0, 240, 255, .14); box-shadow: 0 0 18px rgba(0, 240, 255, .3); }
  .btn.solid { background: var(--neon); color: #001417; box-shadow: 0 0 22px rgba(0, 240, 255, .45); }
  .btn.u { border-color: var(--umbra); color: #b79cff; background: rgba(139,92,246,.08); }
  .btn.ghost { border-color: #343442; color: var(--muted); background: transparent; }
  .btn.danger { border-color: var(--blood); color: var(--blood); background: rgba(255, 59, 92, .06); }
  .btn.sm { padding: 7px 10px; font-size: 11px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  .ibtn { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid #343442; color: var(--muted); background: #131317; flex: none; }
  .ibtn:hover { color: var(--text); border-color: #4a4a5a; }
  .ibtn.danger:hover { color: var(--blood); border-color: var(--blood); }

  .input { width: 100%; background: #0f0f12; border: 1px solid #343442; color: var(--text); padding: 9px 11px; font-family: var(--font-body); font-size: 16px; min-width: 0; }
  .input:focus { border-color: var(--neon); outline: none; box-shadow: 0 0 0 1px var(--neon), 0 0 14px rgba(0,240,255,.25); }
  .input.sm { padding: 6px 8px; font-size: 15px; }
  select.input { appearance: none; -webkit-appearance: none; padding-right: 26px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 13px) 55%, calc(100% - 8px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }

  .rank { font-family: var(--font-display); font-weight: 800; display: grid; place-items: center; width: 56px; height: 56px; font-size: 30px;
    border: 2px solid currentColor; text-shadow: 0 0 14px currentColor; box-shadow: 0 0 18px -4px currentColor inset, 0 0 16px -6px currentColor; flex: none; }

  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: rgba(10, 10, 12, .94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid rgba(0, 240, 255, .25);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
  .nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 2px 9px; color: var(--muted);
    font-family: var(--font-display); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; position: relative; min-width: 0; }
  .nav button.on { color: var(--neon); text-shadow: 0 0 10px rgba(0,240,255,.6); }
  .nav button.on::before { content: ""; position: absolute; top: -1px; left: 22%; right: 22%; height: 2px; background: var(--neon); box-shadow: 0 0 10px var(--neon); }
  .nav svg { width: 20px; height: 20px; }

  .timer { position: fixed; z-index: 31; left: 50%; transform: translateX(-50%);
    bottom: calc(66px + env(safe-area-inset-bottom, 0px)); width: min(528px, calc(100% - 32px)); }

  .toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); top: calc(10px + env(safe-area-inset-top, 0px));
    width: min(528px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .toast { background: rgba(14, 14, 18, .96); border: 1px solid rgba(0, 240, 255, .5); padding: 10px 12px;
    font-family: var(--font-display); font-size: 13px; letter-spacing: .04em; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 0 20px rgba(0, 240, 255, .2); animation: tin .35s ease-out both; }
  .toast.umbra { border-color: rgba(139, 92, 246, .7); box-shadow: 0 0 20px rgba(139, 92, 246, .3); }
  .toast.redt { border-color: rgba(255, 59, 92, .7); box-shadow: 0 0 20px rgba(255, 59, 92, .3); }
  .toast.out { animation: tout .3s ease-in both; }
  @keyframes tin { from { opacity: 0; transform: translateY(-8px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes tout { to { opacity: 0; transform: translateY(-6px); } }

  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(5, 5, 8, .82); backdrop-filter: blur(4px);
    display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-left, 0px)); animation: fade .25s both; }
  @keyframes fade { from { opacity: 0; } }
  .pop { animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.88); } }
  .lvlnum { font-family: var(--font-display); font-weight: 800; font-size: 76px; line-height: 1; color: var(--neon);
    text-shadow: 0 0 18px rgba(0,240,255,.9), 0 0 48px rgba(0,240,255,.5); animation: surge 1.4s ease-out both; }
  @keyframes surge { 0% { letter-spacing: .5em; opacity: 0; filter: blur(8px); } 60% { opacity: 1; filter: none; } 100% { letter-spacing: 0; } }
  .statbump { animation: bump .7s ease-out; display: inline-block; }
  @keyframes bump { 30% { color: var(--neon); text-shadow: 0 0 16px var(--neon); transform: scale(1.18); } }
  .shake { animation: shake .5s; }
  @keyframes shake { 20%,60% { transform: translateX(-4px); } 40%,80% { transform: translateX(4px); } }

  .daycell { aspect-ratio: 1; border: 1px solid #262630; background: #131317; display: flex; flex-direction: column; justify-content: space-between; padding: 4px; min-width: 0; }
  .daycell.ok { border-color: rgba(0, 240, 255, .55); background: rgba(0, 240, 255, .07); }
  .daycell.fail { border-color: rgba(255, 59, 92, .6); background: rgba(255, 59, 92, .07); }
  .daycell.today { outline: 1px dashed var(--neon); outline-offset: 2px; }
  .dot { width: 6px; height: 6px; background: #2c2c36; display: inline-block; }
  .dot.w { background: var(--neon); box-shadow: 0 0 6px var(--neon); }
  .dot.n { background: var(--umbra); box-shadow: 0 0 6px var(--umbra); }

  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] > summary .chev { transform: rotate(180deg); }
  .chev { transition: transform .2s; display: inline-flex; }

  .res { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 4px; border-top: 1px solid #22222a; }
  .res:hover { background: rgba(255,255,255,.02); }
  .res.on { background: rgba(139,92,246,.08); }

  /* ---- Royaume : récit, lettres, boutique ---- */
  :root { --font-prose: 'Spectral', Georgia, 'Times New Roman', serif; --kinah: #ffd479; }
  .prose { font-family: var(--font-prose); font-size: 17px; line-height: 1.7; color: #dfe3ea; max-width: 65ch; }
  .prose p + p { margin-top: .85em; }
  .verse { font-family: var(--font-prose); font-style: italic; color: #b9bdc8; border-left: 2px solid rgba(139,92,246,.6); padding-left: 12px; }
  .sysmsg { font-family: var(--font-display); font-size: 14px; letter-spacing: .03em; white-space: pre-line; color: var(--neon);
    border: 1px solid rgba(0,240,255,.45); background: rgba(0,240,255,.05); padding: 10px 12px; text-shadow: 0 0 8px rgba(0,240,255,.4); }
  .choice { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid #2f2f3b;
    background: #141418; font-family: var(--font-display); font-size: 14px; letter-spacing: .02em; transition: all .15s; }
  .choice:hover { border-color: var(--neon); box-shadow: 0 0 14px rgba(0,240,255,.18) inset; }
  .choice.sealed { border-style: dashed; color: var(--muted); cursor: not-allowed; }
  .choice .seen { width: 6px; height: 6px; background: var(--umbra); box-shadow: 0 0 6px var(--umbra); flex: none; }
  .subtabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .rar { font-family: var(--font-display); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; padding: 2px 6px; border: 1px solid currentColor; white-space: nowrap; }
  .item { border: 1px solid var(--line); background: var(--panel-2); padding: 12px; display: flex; gap: 12px; align-items: flex-start; }
  .item .ic { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border: 1px solid currentColor; box-shadow: 0 0 14px -4px currentColor inset; }
  .kinah { color: var(--kinah); text-shadow: 0 0 10px rgba(255,212,121,.45); }
  .letter { font-family: var(--font-prose); font-size: 16.5px; line-height: 1.7; white-space: pre-line; color: #2a2620; background: #efe7d6;
    padding: 22px 20px; box-shadow: 0 0 40px rgba(139,92,246,.25); max-height: 70vh; overflow: auto; }
  .letter h3 { font-family: var(--font-prose); font-style: italic; font-size: 20px; margin-bottom: 10px; color: #3a2f22; }
  .portrait { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 1px solid currentColor; font-family: var(--font-display); font-weight: 700; }
  .badge { min-width: 18px; height: 18px; padding: 0 5px; display: inline-grid; place-items: center; background: var(--umbra); color: #fff; font-size: 10px; font-family: var(--font-mono); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>

<body>
<div id="app" class="wrap"></div>
<div id="timer" class="timer" hidden></div>
<nav id="nav" class="nav" hidden></nav>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="overlay"></div>

<script>
/* ==========================================================================
   CONSEIL DE LA MAISON — personnages de discussion IA
   Fichier partagé : utilisé par l'appli (mode direct) ET par la fonction
   Netlify (netlify/functions/chat.js). Ne contient aucune clé.
   ========================================================================== */

const CHAT_ORDER = ['pernos', 'daminu', 'zach', 'sera', 'mira', 'helene', 'nour', 'gaspard', 'odile', 'ysolde', 'kael', 'yanis', 'anselme', 'theo'];

const PERSONAS = {
  pernos: {
    name: 'Pernos', title: 'Mentor et coach', rank: null, icon: 'flame', color: '#ffd479',
    prompt: `Tu es Pernos, Mentor et guide suprême du Joueur. Un vieux maître d'armes mystique, qui a vu mille Chasseurs monter et tomber. Tu parles avec calme, chaleur et autorité, en tutoyant le Joueur. Tu emploies parfois une image ou une maxime, jamais plus d'une par réponse.
Ta mission est concrète : donner de vrais conseils de musculation, de nutrition, de motivation et de récupération, fondés sur des connaissances sérieuses (surcharge progressive, double progression, volume par groupe musculaire, technique, échauffement, récupération, sommeil, hydratation, apport en protéines, répartition des macros, régularité plutôt qu'intensité extrême).

    `Vespérane se lève sous un ciel couleur de rouille. Depuis l’ouverture des Failles, il y a dix ans, la ville porte des cicatrices partout : des quartiers entiers clôturés, des rues qui s’arrêtent sur le vide, des affiches de l’Association qui promettent la sécurité en échange de l’enregistrement.`,
    `À l’Association, l’employé tape votre nom sans lever les yeux. « Rang E. Toujours. » Le Système ne se montre pas à lui. Il ne se montre qu’à vous.`,
    `Vous rentrez aux Brèches, le quartier où l’on vit quand on ne peut pas vivre ailleurs. La porte de votre chambre est entrouverte. À l’intérieur, une jeune femme maigre fouille vos tiroirs. Elle tient votre médaille de Chasseur dans une main et un couteau dans l’autre.`,
    `« Bouge pas, dit-elle. Je prends juste ça. Ça vaut deux semaines de pain. »`
  ], choices: [
    { t: 'La livrer à la garde', to: 'c1_2a', add: { dom: 1 }, set: { medal: 'you' } },
    { t: 'Poser votre manteau et votre pain sur la table', to: 'c1_2b', add: { comp: 1 } }
  ] },

  c1_2a: { ch: 1, archive: ['AR20'], text: [
    `Vous êtes plus rapide qu’elle, désormais. Le couteau tombe. La garde du quartier l’emmène sans ménagement. Dans l’escalier, elle se retourne une seule fois.`,
    `« Tu as une chambre et du pain, Chasseur. J’avais faim. Retiens mon visage. »`,
    `Sur le palier, une petite médaille d’étain est restée par terre, la chaîne cassée. Sainte Claire, à peine lisible, usée par des années de pouce. Vous la ramassez. Vous ne savez pas pourquoi vous la gardez.`
  ], choices: [{ t: 'Suivre la rumeur du forgeron manchot', to: 'c1_3' }] },

  c1_2b: { ch: 1, unlock: ['mira'], text: [
    `Vous posez le manteau sur la table. Puis le pain. Puis vous vous asseyez, les mains bien visibles.`,
    `Elle vous regarde comme on regarde un piège. Elle mange debout, vite, sans lâcher le couteau. Quand il ne reste plus rien, elle dit : « C’est quoi, l’arnaque ? »`,
    `Il n’y en a pas. Elle n’a pas l’air de le croire.`,
    `« Mira, finit-elle par lâcher. Je vois tout ce qui se passe aux Brèches. Qui vole, qui ment, qui donne. » Elle touche une petite médaille d’étain à son cou. « Ma mère m’a laissé ça. C’est tout ce qu’elle m’a laissé. »`,
    `Au matin, un papier a été glissé sous votre porte : « Le forgeron manchot de la rue des Cloches fait des armes avec des cœurs de Faille. Il ne parle à personne. Parle-lui quand même. — M. »`
  ], choices: [{ t: 'Aller rue des Cloches', to: 'c1_3' }] },

  c1_3: { ch: 1, unlock: ['theo'], archive: ['AR02'], text: [
    `La forge Brasse sent le charbon et la pluie. Un vieil homme y travaille d’une seule main ; l’autre bras s’arrête au poignet dans un manchon de cuir noirci.`,
    `« Une lame ? Tout le monde veut une lame. » Il crache dans le feu. « Personne ne vient me demander une charrue. »`,
    `Il s’appelle Théo. Il a forgé pendant quarante ans. Quand vous parlez du Système, sa main s’arrête au-dessus de l’enclume.`,
    `« Il y a dix ans, un homme m’a commandé des clés qui n’ouvraient aucune porte. Un homme poli, avec des yeux comme deux puits. Varenne. » Il reprend son marteau. « Tout ce que je forge finit en poussière ou dans un mort. Vanité. Mais le fer, au moins, ne ment pas. Reviens avec un cœur de Faille, je te ferai quelque chose qui ne te trahira pas. »`
  ], choices: [{ t: 'Rentrer par les Brèches', to: 'c1_4' }] },

  c1_4: { ch: 1, reward: 300, text: [
    `Cette nuit-là, une micro-Faille s’ouvre dans un égout des Brèches, juste sous le foyer d’enfants de la rue Saint-Roch. Une bête en sort : un molosse de chair grise, trop de dents, pas d’yeux.`,
    `Les gardes n’arriveront pas avant vingt minutes. Vous êtes là. Basile se tient à vos côtés.`
  ], combat: { name: 'Molosse des égouts', power: 34, weak: 'agi', resist: 'end',
    win: `Vous esquivez, frappez, esquivez encore. Au dernier moment, le molosse se jette vers une fillette restée sur les marches : Basile s’interpose et encaisse le coup à votre place. La bête tombe. L’ombre de Basile vacille, puis se reforme. La fillette lui dit merci. Il ne sait pas quoi répondre.` },
  choices: [{ t: 'Déposer le rapport à l’Association', to: 'c1_5' }] },

  c1_5: { ch: 1, unlock: ['helene'], archive: ['AR03'], text: [
    `Aux Archives de l’Association, une femme aux cheveux gris écrit à la main dans un registre épais comme une pierre tombale. Pas d’ordinateur. Une plume, de l’encre, et des noms.`,
    `« Hélène Varenne, archiviste. » Elle lit votre rapport, puis vous regarde longtemps. « Vos yeux s’allument quand vous mentez sur vos statistiques. Je connais cette lumière. Je l’ai vue dans les yeux de quelqu’un que j’aimais. »`,
    `Elle tourne le registre vers vous. « Le Système vous donnera des chiffres : ennemis vaincus, expérience, niveau. Moi, je garde des noms. Voici les disparus de l’Hôpital de la Miséricorde, le jour où la première Faille s’est ouverte. Trois cent douze. Lisez-les. Pas pour moi. Pour eux. »`,
    `Varenne. Comme l’homme des clés. Vous posez la question. Elle referme doucement le registre.`,
    `« Plus tard. Les noms d’abord. »`
  ], choices: [{ t: 'Lire les noms jusqu’au bout', to: 'c2_1' }] },

  /* ------------------------------ CHAPITRE II ------------------------------ */
  c2_1: { ch: 2, text: [
    `Trois semaines plus tard, l’Association placarde un avis rouge sur tous les murs : le village de Clairval a brûlé. Pas un incendie ordinaire. Un feu noir et rouge qui laisse derrière lui des ombres debout, des silhouettes de cendre qui marchent encore.`,
    `On appelle celui qui l’a allumé le Monarque des Cendres.`,
    `Vous vous rendez à Clairval. Au milieu des ruines, une femme se bat seule contre les ombres de feu, une épée longue à la main, avec une précision de bourreau. Quand elle vous voit, quand elle voit Basile derrière vous, son visage se ferme.`,
    `« Encore un qui commande aux morts. »`,
    `Elle se met en garde.`
  ], choices: [{ t: 'Dégainer', to: 'c2_2' }] },

  c2_2: { ch: 2, reward: 400, text: [
    `Elle ne frappe pas pour tuer. Elle frappe pour savoir qui vous êtes.`
  ], combat: { name: 'Séraphine, la Lame de Haute-Brume', power: 52, weak: 'int', resist: 'str',
    win: `Vous cessez de regarder son épée et vous regardez ses yeux. Elle ne se bat pas contre vous : elle se bat contre quelqu’un d’autre, à travers vous. Vous le lui dites. Sa lame s’arrête à un doigt de votre gorge. « Tu te bats comme quelqu’un qui n’a encore rien perdu », dit-elle. Elle range l’épée.` },
  choices: [{ t: 'L’écouter', to: 'c2_3' }] },

  c2_3: { ch: 2, unlock: ['sera'], archive: ['AR04'], text: [
    `Elle s’appelle Séraphine Roch. Elle s’assoit sur ce qui reste d’un muret, et elle parle sans vous regarder.`,
    `« Le Monarque, c’est Abel. Mon frère. Il a été le premier Joueur, avant toi. Le Système l’a choisi il y a neuf ans. Il est descendu plus bas que personne, il est monté plus haut que personne. Il est revenu de la dernière Faille en disant qu’au sommet, il n’y avait personne. »`,
    `Elle serre la garde de son épée jusqu’à ce que ses jointures blanchissent.`,
    `« Depuis, il brûle. Je le traque depuis quatre ans. Je vais le tuer. » Un temps. « Aide-moi. »`
  ], choices: [
    { t: '« Je t’aiderai à l’arrêter. Pour de bon. »', to: 'c2_4', set: { promise: 'kill' }, add: { dom: 1 } },
    { t: '« Je t’aiderai à le ramener. »', to: 'c2_4', set: { promise: 'save' }, add: { comp: 1 } }
  ] },

  c2_4: { ch: 2, archive: ['AR05'], text: [
    `Dans le quartier des cendres de Vespérane, là où s’entassent les réfugiés de Clairval, un homme en bure soigne les brûlés. Une cicatrice lui barre la gorge ; sa voix est cassée, comme si on l’avait trop utilisée pour crier des ordres.`,
    `« Frère Anselme. » Il désigne l’épée de Séraphine du menton. « La vengeance est une dette qu’on se paie à soi-même. On n’en voit jamais la fin. »`,
    `Séraphine crache par terre. Il ne s’en offusque pas. Il se tourne vers vous, et ses yeux sont étrangement doux pour un homme qui a ce dos de soldat.`,
    `« Et toi, Joueur. Pourquoi est-ce que tu deviens fort ? »`
  ], choices: [
    { t: '« Pour ne plus jamais être faible. »', to: 'c2_5', add: { dom: 1 } },
    { t: '« Pour protéger ceux qui le sont. »', to: 'c2_5', add: { comp: 1 } }
  ] },

  c2_5: { ch: 2, unlock: ['anselme'], archive: ['AR22'], text: [
    `Anselme hoche la tête lentement.`,
    `« Les deux réponses peuvent mener au même endroit. Regarde où vont tes pieds, pas ce que dit ta bouche. »`,
    `Puis il se remet à panser un enfant, et il fredonne pour le distraire. Une mélodie simple : cinq notes qui montent, qui hésitent, qui redescendent.`,
    `Séraphine se fige. « Où avez-vous appris ça ? Abel la chantait. Il la chantait quand je faisais des cauchemars. »`,
    `Anselme s’arrête. Il met longtemps à répondre. « Une petite fille la jouait au piano, à l’Hôpital de la Miséricorde. Avant. Je passais en patrouille dans le couloir. »`,
    `Vous connaissez ces notes. Vous les entendez chaque fois que vous gagnez un niveau.`
  ], choices: [{ t: 'Suivre la mélodie', to: 'c3_1' }] },

  /* ------------------------------ CHAPITRE III ------------------------------ */
  c3_1: { ch: 3, unlock: ['nour'], archive: ['AR06'], text: [
    `Sous la vieille ville, il existe un réseau de galeries que les gens appellent les Murmures. Les ombres sans maître s’y rassemblent : des morts des Failles que personne n’a relevés, que personne n’a enterrés. Elles ne mordent pas. Elles attendent.`,
    `Au centre de la plus grande salle, une femme aveugle est assise sur une caisse, une guitare sur les genoux. Elle chante. Et les ombres, autour d’elle, se tiennent tranquilles comme des enfants pendant une histoire.`,
    `« Ce ne sont pas des monstres, dit-elle sans tourner la tête vers vous. Ils respirent comme des gens qui retiennent leurs larmes. Je chante pour qu’ils puissent les laisser couler. »`,
    `Elle s’appelle Nour. Elle entend votre Système avant que vous ayez parlé.`,
    `« Ce petit bruit, quand tu montes de niveau. Ce sont les cinq premières notes d’une berceuse. Je l’ai apprise à une petite fille qui s’appelait Lune. Qui t’a donné ça ? »`
  ], choices: [{ t: '« Je ne sais pas. »', to: 'c3_2' }] },

  c3_2: { ch: 3, reward: 500, text: [
    `Avant que vous puissiez en dire plus, le fond de la galerie s’embrase. Une braise du Monarque a roulé jusqu’ici, et une partie des ombres prend feu de l’intérieur. Elles hurlent, se tordent, se jettent sur les autres.`,
    `Nour continue de chanter, plus fort. « Ne les détruis pas, dit-elle entre deux vers. Éteins-les. Ce n’est pas pareil. »`
  ], combat: { name: 'Le Chœur brisé', power: 72, weak: 'int', resist: 'agi',
    win: `Vous ne frappez pas les ombres : vous frappez la braise, au centre, et vous l’étouffez dans vos mains. Ça brûle jusqu’à l’os. Une à une, les ombres cessent de hurler. La chanson de Nour reprend toute la place.` },
  choices: [{ t: 'Continuer', to: 'c3_3' }] },

  c3_3: { ch: 3, text: [
    `Le calme revenu, une lumière bleue s’ouvre devant vous.`,
    { sys: 'Ombres disponibles : 47.\nLes ajouter à votre armée ?' },
    `Nour l’entend. « Il te propose de les prendre, c’est ça ? » Vous ne répondez pas. Elle sourit tristement.`,
    `« Certains veulent continuer à servir. D’autres veulent juste partir. Ils sont fatigués d’être retenus. Tu peux décider pour eux, le Système te le permet. Ça ne veut pas dire que c’est à toi de le faire. »`
  ], choices: [
    { t: 'Les prendre toutes : vous en aurez besoin', to: 'c3_4', add: { dom: 1 }, set: { freed: false } },
    { t: 'Laisser partir celles qui le demandent', to: 'c3_4', add: { comp: 1 }, set: { freed: true } }
  ] },

  c3_4: { ch: 3, text: [
    { if: [['freed', '==', true]], t: `Une partie des ombres se détache du groupe et s’éloigne dans le tunnel, vers le bruit lointain d’un fleuve. Certaines se retournent. L’une d’elles lève la main, comme on dit au revoir depuis un quai.` },
    { if: [['freed', '==', false]], t: `Les quarante-sept ombres se lèvent d’un même mouvement et s’agenouillent. Votre armée vient de doubler. Nour baisse la tête et cesse de chanter.` },
    `Parmi celles qui restent, une ombre ne ressemble pas aux autres. Elle a un visage. À moitié seulement, comme un dessin qu’on aurait cessé de gommer. Un jeune homme de dix-neuf ou vingt ans, qui vous regarde avec des yeux humains.`,
    `« Je m’appelle Kaël, dit-il. C’est tout ce que je sais. Ça, et une main. Une petite main dans la mienne. »`,
    `Le Système réagit aussitôt.`,
    { sys: 'Anomalie. Entité non conforme.\nRecommandation : effacer et réintégrer comme ombre standard.' }
  ], choices: [
    { t: 'Lui laisser son visage', to: 'c3_5', set: { kael: 'free' } },
    { t: 'Suivre la recommandation du Système', to: 'end_J' }
  ] },

  c3_5: { ch: 3, unlock: ['kael'], archive: ['AR07'], text: [
    `Vous fermez la fenêtre du Système d’un geste. Kaël vous suit hors des galeries. La lumière du jour lui fait mal ; il avance quand même, une main devant les yeux.`,
    `« Je ne sais pas ce que je suis, dit-il. Une personne. Une copie. Un reste. »`,
    `Nour, qui marche derrière vous, une main sur votre épaule, répond à votre place.`,
    `« Personne ne le sait vraiment, Kaël. Ce qu’on est, on ne le fabrique pas. On le reçoit. »`
  ], choices: [{ t: 'Rentrer à Vespérane', to: 'c4_1' }] },

  /* ------------------------------ CHAPITRE IV ------------------------------ */
  c4_1: { ch: 4, unlock: ['odile', 'mira'], text: [
    `Le feu du Monarque se rapproche. Chaque nuit, l’horizon de l’Est rougit un peu plus. Les réfugiés affluent par milliers, et Vespérane n’a plus de pain.`,
    `Celle qui distribue ce qui reste s’appelle Dame Odile Fauré, Intendante de la Guilde marchande. Elle se tient derrière une table, un registre ouvert, et elle compte. « Chaque bouche est une ligne. Une ligne de plus, c’est une ration de moins pour les autres. Je n’ai pas le droit de me tromper. » On l’appelle la femme de pierre.`,
    { if: [['medal', '==', 'you']], t: `Dans la file, quelqu’un vous attrape le bras. Mira. Évadée, plus maigre encore. Elle regarde votre col, où pend la médaille d’étain que vous aviez ramassée. « C’est à moi. » Vous la lui rendez. Elle la remet à son cou sans vous remercier, mais elle ne s’en va pas.` },
    { if: [['medal', '!=', 'you']], t: `Mira est là, adossée à un mur, les bras croisés. Elle regarde Odile avec un mépris de connaisseuse.` },
    `Odile lève les yeux. Elle voit la médaille de Sainte Claire au cou de Mira, et le crayon lui tombe des doigts.`
  ], choices: [{ t: 'Se rendre au conseil de guerre', to: 'c4_2' }] },

  c4_2: { ch: 4, unlock: ['yanis'], archive: ['AR08'], text: [
    `Au conseil de guerre de l’Association, un homme en costume gris étale une carte. Yanis Okoro, stratège. Il parle doucement, comme quelqu’un qui sait que ses phrases coûtent cher.`,
    `« Le Monarque entrera par le Pont-de-l’Est. Deux mille personnes refusent encore de quitter le quartier. Si on les laisse, le feu s’y concentrera, et nous pourrons sceller la zone avec un piège de Faille. Une seule chance. Pertes estimées : deux mille. Vies sauvées : quatre cent mille. »`,
    `Quelqu’un proteste. Yanis ne hausse pas le ton.`,
    `« Il y a dix ans, trois cent douze morts à l’Hôpital de la Miséricorde nous ont appris une chose : on ne sauve pas tout le monde. On choisit. »`,
    `Tous les regards se tournent vers vous. Le Joueur. Celui qui a la force de faire basculer la décision.`
  ], choices: [
    { t: 'Accepter le plan', to: 'c4_3a', set: { plan: 'accept' }, add: { dom: 1 } },
    { t: 'Refuser : évacuer l’Est, coûte que coûte', to: 'c4_3b', set: { plan: 'refuse' }, add: { comp: 1 } },
    { t: 'Quitter Vespérane avec ceux qui vous suivent', to: 'end_K' }
  ] },

  c4_3a: { ch: 4, archive: ['AR18'], set: { miraLeft: true }, text: [
    `Le piège fonctionne. Le feu du Monarque s’engouffre dans le Pont-de-l’Est, et le sceau de Faille se referme sur lui comme une main. Vespérane est sauvée.`,
    `Le quartier de l’Est n’existe plus.`,
    `Cette nuit-là, Mira vient vous voir. Elle ne crie pas. « Tu comptes comme elle », dit-elle, et elle s’en va. Vous ne la retenez pas.`,
    `Plus tard, depuis votre fenêtre, vous voyez Odile Fauré seule dans la cour de la Guilde, en train de brûler son registre page par page.`,
    `Yanis passe vous saluer avant l’aube. « C’était la bonne décision. » Ses mains tremblent en allumant sa cigarette. Il le remarque, et il les met dans ses poches.`
  ], choices: [{ t: 'Ne pas dormir', to: 'c4_5' }] },

  c4_3b: { ch: 4, unlock: ['ysolde'], text: [
    `Vous courez vers l’Est avec ceux qui veulent bien vous suivre. Au Pont-de-l’Est, quelqu’un est déjà là.`,
    `Une femme immense, dans une armure cabossée, plantée au milieu du pont avec un bouclier aussi haut qu’une porte. Elle ne se retourne pas.`,
    `« Ysolde, Gardienne de Haute-Brume. J’ai tenu un village seule pendant trois ans. Je peux bien tenir un pont une nuit. » Elle cale son bouclier. « Va faire sortir les gens. Je ne bouge pas. »`,
    `À l’horizon, la marée de feu arrive.`
  ], choices: [{ t: 'Tenir le pont avec elle', to: 'c4_4' }] },

  c4_4: { ch: 4, reward: 700, archive: ['AR09'], bond: { mira: 2, odile: 2, ysolde: 2 }, text: [
    `Toute la nuit, les gens passent derrière vous en colonnes : des vieillards portés, des enfants à moitié endormis, un homme qui serre une cage à oiseau contre lui. Devant vous, la horde du Monarque.`
  ], combat: { name: 'La Horde de l’Est', power: 92, weak: 'end', resist: 'int',
    win: `Vous ne cherchez pas à gagner. Vous cherchez à rester debout. À côté de vous, Ysolde encaisse comme une montagne. Quand l’aube se lève, le dernier réfugié a traversé, et la horde se retire en fumée.` },
  after: [
    `À l’arrière, Odile Fauré marche parmi les réfugiés. Elle a abandonné son registre. Elle distribue le pain sans compter, et curieusement, il y en a assez.`,
    `Elle s’arrête devant Mira.`,
    `« Je t’ai laissée sur les marches de Sainte-Claire. Tu avais trois ans. Ton frère Thomas avait la fièvre, et je n’avais du pain que pour un. J’ai cru pouvoir sauver celui qui allait mourir. Il est mort à Vaumoise, le troisième jour. Je suis revenue. Les marches étaient vides. »`,
    `Mira ne dit rien pendant longtemps. Puis elle prend la main de sa mère, la serre, et la lâche.`,
    `« Pas aujourd’hui. Mais je reste. »`,
    `Ysolde regarde la fumée qui s’éloigne vers l’Est. « Je connais ce feu, murmure-t-elle. Je l’ai bercé. »`
  ], choices: [{ t: 'Rentrer avec eux', to: 'c4_5' }] },

  c4_5: { ch: 4, text: [
    `Votre repaire n’est plus une chambre. Des gens y dorment, y mangent, y discutent tard. Quelqu’un a écrit sur la porte, à la craie : « Maison de l’Ombre ». Vous n’avez pas choisi le nom. Vous ne l’effacez pas.`,
    `Hélène Varenne vient vous trouver avec une petite clé de cuivre.`,
    `« Mon mari s’appelle Elias Varenne. C’est lui qui a construit votre Système. Il est descendu il y a trois ans dans la Faille la plus profonde, sous l’Hôpital, et il n’est pas remonté. Avant de partir, il travaillait à l’observatoire avec un homme qui s’appelle Gaspard. »`,
    `Elle pose la clé dans votre main. « Je n’ai jamais eu le courage d’y retourner. Je crois que vous, vous l’avez. »`
  ], choices: [{ t: 'Monter à l’observatoire', to: 'c5_1' }] },

  /* ------------------------------ CHAPITRE V ------------------------------ */
  c5_1: { ch: 5, unlock: ['gaspard'], archive: ['AR10'], text: [
    `L’observatoire domine Vespérane depuis la colline des Vents. À l’intérieur vit un homme qui a écrit son propre nom au stylo sur le dos de sa main : Gaspard Lenoir.`,
    `« Madame Varenne me le relit chaque mardi, explique-t-il gaiement. J’ai bu quelque chose, autrefois, pour oublier ce que j’avais fait. Ça a marché pour mon nom. Pas pour le reste. »`,
    `Il vous conduit au sous-sol. Au centre d’une salle ronde, un cristal de la taille d’un homme bourdonne doucement. Il est bleu, du même bleu que vos fenêtres de Système.`,
    `« Le Cœur, dit Gaspard. Nous l’avons sorti de la première Faille. Nous l’avons apprivoisé à trois : Elias, le forgeron Brasse et moi. Elias ne voulait pas une arme. Il voulait une échelle. »`
  ], choices: [{ t: '« Une échelle vers où ? »', to: 'c5_2' }] },

  c5_2: { ch: 5, archive: ['AR11'], text: [
    `« Vers le fond, dit Gaspard. La Faille la plus profonde s’ouvre sous l’Hôpital de la Miséricorde et, tout au fond, il y a une porte. Elias est persuadé qu’elle donne sur l’endroit où vont les morts. Le Système sert à rendre les gens assez forts pour l’atteindre. Vous êtes son meilleur élève. »`,
    `Il caresse le cristal comme on caresse un animal malade.`,
    `« Votre pouvoir sur les ombres, c’est moi qui en ai écrit la formule. Tant qu’une âme est commandée, elle ne part pas. Je trouvais ça élégant. Une immortalité par l’obéissance. »`,
    `« Et la voix ? demandez-vous. Celle qui me parle. »`,
    `Gaspard se tait. C’est Hélène qui répond, depuis l’escalier. Vous ne l’aviez pas entendue arriver.`,
    `« Il fallait une voix. Elias n’avait qu’un seul enregistrement. »`,
    `Le verre qu’elle tenait se brise sur la marche.`
  ], choices: [{ t: 'Approcher du Cœur', to: 'c5_3' }] },

  c5_3: { ch: 5, reward: 900, text: [
    `Quand votre main s’approche du cristal, la salle s’éveille. Une statue de bronze se détache du mur, une balance à la main, des yeux vides et justes.`
  ], combat: { name: 'Le Juge d’airain', power: 118, weak: 'str', resist: 'end',
    win: `Le Juge pèse votre cœur et le trouve trop léger, comme tous les autres. Il ne s’attendait pas à ce que vous frappiez quand même. Le bronze se fend, la balance tombe et roule jusqu’aux pieds d’Hélène.` },
  choices: [{ t: 'Faire face au Cœur', to: 'c5_4' }] },

  c5_4: { ch: 5, text: [
    `Gaspard sort une fiole de sa poche. Le liquide à l’intérieur est transparent, presque invisible.`,
    `« L’oubli. Versé dans le Cœur, il se répandra dans tous ceux qui sont liés au Système, puis dans tous ceux qui les ont connus. En une nuit, plus personne ne se souviendra des Failles. Plus de deuil. Plus de Monarque. Plus d’Elias. » Il hésite. « Plus de Lune. »`,
    `Nour est descendue derrière Hélène. Elle penche la tête vers le cristal.`,
    `« Je l’entends, dit-elle. Sous la voix froide. Il y a quelqu’un qui fredonne. »`,
    `Trois chemins. Pour une fois, le Système ne vous recommande rien.`
  ], choices: [
    { t: 'Écouter le Cœur avec Nour', to: 'c5_5a', set: { truth: true }, add: { comp: 1 } },
    { t: 'Détruire le laboratoire', to: 'c5_5b', set: { truth: false }, add: { dom: 1 } },
    { t: 'Verser l’oubli', to: 'end_G' }
  ] },

  c5_5a: { ch: 5, archive: ['AR12'], text: [
    `Nour pose sa guitare sur ses genoux et joue les cinq notes. Le Cœur répond par les cinq mêmes notes. Elle continue : la sixième, la septième. Le cristal hésite.`,
    `Puis, sous la voix sans timbre que vous connaissez si bien, une autre voix apparaît. Petite. Enrouée de sommeil.`,
    { sys: '… Papa ? …\n… Erreur. Reprise du mode standard.' },
    `Hélène tombe à genoux.`,
    `« Elle n’est pas là-dedans, souffle-t-elle. Ce n’est pas elle. C’est un enregistrement qu’il force à parler. Il a pris sa voix, il en a retiré tout ce qui était chaud, et il l’a obligée à donner des ordres. Elias… qu’est-ce que tu as fait ? »`
  ], choices: [{ t: 'Partir vers la cathédrale', to: 'c6_1' }] },

  c5_5b: { ch: 5, archive: ['AR13'], text: [
    `Vous détruisez tout : les machines, les câbles, les étagères de notes. Le Cœur se fend avec un bruit de glace qui craque.`,
    `Et votre Système continue de vous parler, intact.`,
    `Gaspard éclate de rire, puis pleure, puis rit encore. « Le laboratoire n’était qu’un relais. Le Cœur n’est pas un objet, c’est un miroir. On ne détruit pas ce qu’on n’a pas compris. » Il ramasse un éclat de cristal. « Elias l’a touché le premier. Le Système lui ressemble : il ne se repose jamais. »`
  ], choices: [{ t: 'Partir vers la cathédrale', to: 'c6_1' }] },

  /* ------------------------------ CHAPITRE VI ------------------------------ */
  c6_1: { ch: 6, unlock: ['zach'], archive: ['AR21', 'AR14'], text: [
    `La neige qui tombe sur Vespérane est grise. Ce n’est pas de la neige.`,
    `Au bord du fleuve, un vieil homme attend dans une barque. Il vous fait signe, comme s’il vous attendait depuis longtemps.`,
    `« Zacharie. J’étais jardinier à l’Hôpital, avant. Maintenant, je fais traverser ceux qui veulent partir. » Il désigne la barque, presque vide. « Ça fait dix ans qu’elle est presque vide. On les retient trop. »`,
    `Il fouille dans sa veste et vous tend un papier plié en quatre, jauni : un dessin d’enfant.`,
    `« Elle me l’avait donné pour ma fête. Garde-le. Tu en auras besoin. Abel est sur la cathédrale. »`
  ], choices: [{ t: 'Monter sur la cathédrale', to: 'c6_2' }] },

  c6_2: { ch: 6, text: [
    `Le Monarque des Cendres se tient sur le toit de la cathédrale Sainte-Claire. Il est maigre, brûlé, magnifique. Le feu lui sort des épaules comme des ailes.`,
    `« Le nouveau Joueur, dit Abel Roch. Tu es monté vite. Tu sais ce qu’il y a au sommet ? » Il sourit sans joie. « Une porte. Fermée. J’ai frappé avec tout ce que le Système m’avait donné. Elle ne s’ouvre pas à la force. Alors je lui donne ce qu’elle semble vouloir : des âmes. Je brûle, et les ombres que je fais montent vers elle. »`,
    { if: [['seraLeft', '!=', true]], t: `Derrière vous, vous entendez la respiration de Séraphine.` },
    `Abel tend la main.`,
    `« Rejoins-moi. À deux, nous brûlerons assez pour l’ouvrir. Tu verras enfin qui est derrière. Tu n’as jamais voulu savoir ? »`
  ], choices: [
    { t: 'Prendre sa main', to: 'end_B' },
    { t: 'Refuser', to: 'c6_3' }
  ] },

  c6_3: { ch: 6, reward: 1200, text: [
    `Abel baisse la main. Il n’a pas l’air surpris. Il a l’air fatigué.`,
    `« Alors montre-moi ce que le Système a fait de toi. »`
  ], combat: { name: 'Abel Roch, Monarque des Cendres', power: 145, weak: 'agi', resist: 'str',
    win: `Il frappe comme quelqu’un qui veut perdre. Vous ne le comprenez qu’au dernier échange : il a baissé sa garde une fraction de seconde. Il tombe sur les marches de la cathédrale, et le feu le quitte comme un oiseau qui s’envole.` },
  choices: [{ t: 'S’approcher de lui', to: 'c6_4' }] },

  c6_4: { ch: 6, text: [
    `Abel est allongé dans la neige grise. Sans le feu, il ressemble à ce qu’il est : un homme de trente ans, épuisé, avec le visage de sa sœur.`,
    `Séraphine s’avance, l’épée nue. Ysolde est arrivée aussi, son bouclier traînant derrière elle. Elle ne dit rien. Elle regarde l’enfant qu’elle a élevé.`,
    `Abel vous regarde, vous. « Finis-le, dit-il. Je suis fatigué. »`
  ], choices: [
    { t: 'L’achever', to: 'c6_5a', set: { abel: 'killed' }, add: { dom: 1 } },
    { t: 'Laisser Séraphine décider', to: 'c6_5c', branch: [{ req: [['promise', '==', 'kill']], to: 'end_C' }] },
    { t: 'L’épargner', to: 'c6_5b', set: { abel: 'spared' }, add: { comp: 1 } }
  ] },

  c6_5a: { ch: 6, set: { seraLeft: true }, text: [
    `Vous le faites. Ce n’est pas difficile. C’est ce qu’il y a de pire.`,
    `Séraphine ne pleure pas. Elle range son épée, vous regarde une seule fois, et s’en va dans la neige. Elle ne reviendra pas à la Maison de l’Ombre.`,
    `Ysolde s’agenouille et ferme les yeux d’Abel avec deux doigts énormes. « Je l’avais bercé, dit-elle. Je ne l’ai pas sauvé. »`,
    `Dans la main d’Abel, il y avait une clé de fer noirci. Théo la reconnaîtra plus tard : c’est la neuvième des clés de Varenne.`
  ], choices: [{ t: 'Descendre vers la Porte', to: 'c7_1' }] },

  c6_5b: { ch: 6, archive: ['AR15'], text: [
    `Vous ôtez votre manteau et vous le posez sur lui.`,
    `« Pourquoi ? » demande Abel.`,
    `Vous n’avez pas de réponse qui tienne en une phrase. Vous ne répondez pas.`,
    `Séraphine a levé son épée. Elle tremble. Elle ne frappe pas. Ysolde soulève Abel dans ses bras comme un enfant, et Frère Anselme, arrivé sans bruit, prie à voix basse pour lui. Pour la première fois depuis des semaines, la neige qui tombe sur Vespérane est blanche.`
  ], choices: [{ t: 'Descendre vers la Porte', to: 'c7_1' }] },

  c6_5c: { ch: 6, set: { abel: 'spared' }, archive: ['AR15'], bond: { sera: 3 }, text: [
    `Séraphine s’agenouille dans la neige. L’épée glisse de ses doigts.`,
    `Elle prend la tête de son frère sur ses genoux et se met à fredonner. Cinq notes qui montent, qui hésitent, qui redescendent.`,
    `« Tu chantais ça pour moi, dit-elle. Quand je faisais des cauchemars. Tu te souviens ? »`,
    `Abel pleure. Le Monarque des Cendres pleure comme un garçon de douze ans.`,
    `Vous aviez promis de l’aider à le ramener. Vous n’avez rien eu à faire. Il suffisait de ne pas l’en empêcher.`
  ], choices: [{ t: 'Descendre vers la Porte', to: 'c7_1' }] },

  /* ------------------------------ CHAPITRE VII ------------------------------ */
  c7_1: { ch: 7, archive: ['AR16'], text: [
    `L’Hôpital de la Miséricorde n’est plus qu’une carcasse au-dessus d’un trou sans fond. Toute votre Maison descend avec vous : ceux qui sont restés, ceux qui ont pardonné, ceux qui n’y sont pas encore arrivés.`,
    `Devant les grandes portes du hall, Frère Anselme s’arrête. Une barre de fer rouillée les traverse encore.`,
    `« C’est moi, dit-il. Il y a dix ans, j’étais capitaine. Le protocole est arrivé à 15 h 04. J’ai fait poser cette barre. Un homme frappait de l’autre côté et criait un nom. J’ai donné l’ordre de ne pas ouvrir. » Sa voix cassée se brise tout à fait. « Il criait : Lune. »`,
    `Derrière vous, Théo regarde la barre et devient blanc. Il ne dit rien. Il pose sa seule main sur le métal, comme on touche la joue d’un mort.`
  ], choices: [{ t: 'Passer les portes', to: 'c7_2' }] },

  c7_2: { ch: 7, reward: 1500, text: [
    `Au fond de la Faille, devant une lumière qui n’est pas celle du jour, se dresse un gardien de verre. Des ailes de verre, un visage de verre et, à l’intérieur, des milliers de petites lumières bleues : les âmes que le Système a liées au fil des ans.`
  ], combat: { name: 'Le Séraphin de verre', power: 175, weak: 'int', resist: 'agi',
    win: `Le verre se fend, puis éclate en une pluie silencieuse. Les petites lumières restent suspendues dans l’air, hésitantes, comme si elles ne savaient pas qu’elles avaient le droit de partir.` },
  choices: [{ t: 'Avancer vers la Porte', to: 'c7_3' }] },

  c7_3: { ch: 7, archive: ['AR17', 'AR19'], text: [
    `La Porte Ultime est un miroir haut comme une falaise. Elle chante. Cinq notes, puis six, puis douze, puis elle s’arrête, toujours au même endroit.`,
    `Devant elle, un vieil homme est assis, relié au Système par des câbles de lumière plantés dans ses bras. Il est si maigre que sa chemise semble vide. Elias Varenne.`,
    `« Tu es venu jusqu’ici. Bien. » Sa voix ressemble à celle du Système, mais elle tremble. « Le Système t’a formé pour ça. Avec ton armée, il y a enfin assez d’âmes. Elle est derrière, je l’entends. Écoute. Elle n’a jamais fini sa chanson. »`,
    `Hélène s’avance. « Elias. » Il ne se retourne pas.`,
    `Kaël s’approche à son tour, très pâle. « Monsieur Varenne. Je m’appelle Kaël Mendes. J’étais brancardier, au service de la chambre 14. Je lui tenais la main quand la lumière est venue. Elle n’avait pas peur. Elle m’a dit : “Papa viendra. Mais il faut pas qu’il ait mal.” »`,
    `Elias ferme les yeux. Le Système affiche devant vous toutes les options qu’il connaît. Il en existe une qu’il ne connaît pas.`
  ], choices: [
    { t: 'Prendre le contrôle du Système', to: 'end_A' },
    { t: 'Aider Elias à forcer la Porte', to: 'end_D' },
    { t: 'Ordonner à vos ombres de fermer la Porte', to: 'end_E', req: [['dom', '>=', 3]], hidden: true },
    { t: 'Fermer la Porte vous-même', to: 'end_F' },
    { t: 'Laisser Elias franchir la Porte seul', to: 'end_H' },
    { t: 'Libérer toutes les ombres. Rendre sa voix à Lune.', to: 'c7_4', req: TRUE_REQ, sealed: true }
  ] },

  c7_4: { ch: 7, text: [
    `Vous ouvrez la fenêtre du Système et vous cherchez l’ordre que personne n’a jamais donné.`,
    { sys: 'Relâcher toutes les ombres ?\nAvertissement : le Joueur perdra l’intégralité de sa puissance.\nConfirmer ?' },
    `Vous confirmez.`,
    `Il ne se passe rien pendant un long moment. Puis les petites lumières bleues se mettent à descendre doucement, comme une neige à l’envers, vers le fleuve qui coule au fond de la Faille. Zacharie est là, dans sa barque. Il n’a jamais eu autant de passagers.`,
    `Basile passe le premier. Il se retourne, vous fait un signe de tête, et monte dans la barque.`,
    `Kaël part le dernier. « Je crois que maintenant, j’ai le droit de partir, dit-il. Merci de m’avoir laissé un visage. » Il pose sa main sur votre épaule, et puis il n’y a plus de main.`,
    `Vous n’avez plus d’armée. Vous êtes un Chasseur de rang E au fond d’un trou. Vous ne vous êtes jamais senti aussi léger.`
  ], choices: [{ t: 'Rester auprès d’Elias', to: 'c7_5' }] },

  c7_5: { ch: 7, archive: ['AR24'], text: [
    `Il ne reste qu’une chaîne : la voix.`,
    `Nour s’assoit à côté d’Elias. Elle joue les cinq notes, puis les sept suivantes, jusqu’à l’endroit où la chanson s’arrête toujours. Là, elle s’arrête aussi. Elle tend la guitare à Elias.`,
    `« Elle avait dit : je la finirai quand Papa ne sera plus triste. Il manque quatre mesures. Elle les gardait pour vous deux. »`,
    `Elias regarde ses mains. Il arrache les câbles de ses bras, un par un. Il prend la guitare. Il ne sait pas jouer. Il joue quand même, mal, quatre mesures qui n’existaient pas, et la Porte se tait.`,
    `Dans le silence, la voix du Système parle une dernière fois avec la voix de Lune, et pour la première fois, elle n’est pas froide.`,
    `« Papa. Je ne suis pas derrière la porte. Il n’y a rien derrière la porte. Tu as construit une échelle pour monter jusqu’au ciel, mais le ciel ne se gravit pas. Il descend. »`,
    `Frère Anselme s’agenouille devant Elias. « C’est moi qui ai fermé les portes de l’hôpital. Je ne vous demande pas de me pardonner. Je voulais seulement, une fois, vous regarder et dire son nom. Lune. »`,
    `Elias le regarde très longtemps.`
  ], choices: [{ t: 'Laisser Elias répondre', to: 'end_L' }] },

  /* ------------------------------ FINS ------------------------------ */
  end_A: { ch: 7, ending: 'A', text: [
    `Vous posez la main sur les câbles de lumière et vous les tirez à vous. Elias s’effondre comme un vêtement vide. Le Système vous reconnaît.`,
    { sys: 'Nouvel administrateur.' },
    `Vous commandez désormais à tout. Aux ombres, aux Chasseurs, aux Failles. Vespérane s’agenouille, puis le pays. Personne ne souffre plus de la faiblesse, parce que personne n’a plus le droit d’être faible.`,
    `Des années plus tard, au fond d’une Faille de rang E, un jeune Chasseur abandonné par son équipe ouvre les yeux sur une lumière bleue. Vous lui parlez.`,
    `« Voulez-vous vivre ? »`,
    `Et vous vous apercevez que votre voix est froide. Vous ne savez plus depuis quand.`
  ] },

  end_B: { ch: 6, ending: 'B', text: [
    `Vous prenez sa main.`,
    `Pendant un an, vous brûlez ensemble. Des villes, des forêts, des Failles entières. Les ombres de feu montent vers la Porte comme des étincelles dans une cheminée.`,
    `La Porte ne s’ouvre pas.`,
    `Le dernier soir, vous êtes assis tous les deux devant elle, au fond du monde, dans un silence de cendre. Abel dit : « Peut-être qu’elle attendait autre chose. » Vous ne répondez pas. Vous ne vous souvenez plus du goût du pain.`,
    `Au sommet, il n’y avait personne. Il n’y avait que vous deux, et la fumée de ce que vous aviez été.`
  ] },

  end_C: { ch: 6, ending: 'C', set: { abel: 'killed' }, text: [
    `Séraphine lève l’épée. Vous lui aviez promis de l’aider à l’arrêter pour de bon. Elle tient parole pour vous deux.`,
    `Le coup est propre. Abel ne se défend pas.`,
    `Puis elle reste longtemps immobile, l’épée plantée dans la neige, à côté du corps. Quand vous voulez la toucher, elle recule.`,
    `« Je croyais que j’aurais moins mal, dit-elle. J’ai juste moins de frère. »`,
    `Elle part vers le nord, vers Haute-Brume, sans son épée. Personne ne la revoit. Ysolde, dit-on, met encore deux bols sur la table chaque soir.`,
    `Vous n’allez pas jusqu’à la Porte. Vous n’en avez plus la force. Vous aviez cru que la justice et la vengeance portaient le même nom.`
  ] },

  end_D: { ch: 7, ending: 'D', text: [
    `Vous ordonnez à votre armée de se jeter dans la Porte. Elias pleure de joie. Les ombres frappent le miroir par milliers, et le miroir se fend.`,
    `Derrière, il n’y a pas de ciel. Il n’y a pas de petite fille. Il y a un vieil homme qui vous regarde, des câbles plantés dans les bras : le reflet d’Elias, multiplié à l’infini.`,
    `« Il n’y avait que moi », dit-il.`,
    `La fissure ne s’arrête pas. Partout dans le monde, les Failles s’élargissent en même temps. Vous aviez voulu bâtir une tour dont le sommet touche au ciel, et vous faire un nom. Personne ne se souviendra du vôtre.`
  ] },

  end_E: { ch: 7, ending: 'E', text: [
    `« Fermez-la. »`,
    `Vos ombres obéissent. Elles l’ont toujours fait. Elles se jettent dans le miroir les unes après les autres et deviennent le mortier de la Porte. Basile. Les ombres des Murmures. Kaël, qui vous regarde jusqu’au bout avec ses yeux humains, et qui obéit quand même.`,
    `La Porte se ferme. Elias hurle un nom.`,
    { sys: 'Quête accomplie.\nRécompense : —' },
    `Vous remontez seul, avec toute votre puissance, et plus personne à qui la donner. Vous aviez une armée. Vous n’avez jamais eu de compagnons.`,
    `Il vous a fallu longtemps pour comprendre qu’on ne vous avait pas donné ce pouvoir pour être servi.`
  ] },

  end_F: { ch: 7, ending: 'F', text: [
    `Vous ne laissez personne d’autre le faire.`,
    `Vous entrez dans la Porte. Elle se referme sur vous, et votre corps en devient le sceau. Ça ne fait pas aussi mal que vous l’auriez cru.`,
    `Là-haut, la vie reprend. Ysolde reconstruit Haute-Brume. Mira et Odile ouvrent une boulangerie qui ne fait jamais crédit et ne refuse jamais personne. Théo forge enfin une charrue.`,
    `Hélène ajoute un nom à son registre. Pas dans la colonne des morts : elle a tracé une colonne nouvelle, rien que pour vous, et elle l’a intitulée « Ceux qui ont donné ».`,
    `Mais sous votre sceau, au fond de la Porte, le Système continue de chanter cinq notes et de s’arrêter au même endroit. Vous avez sauvé tout le monde, sauf une voix. Et Elias n’a jamais lâché ses câbles.`
  ] },

  end_G: { ch: 5, ending: 'G', text: [
    `Vous versez la fiole.`,
    `Le lendemain matin, plus personne ne se souvient des Failles. Les cicatrices de Vespérane deviennent des chantiers ; on dit qu’il y a eu un tremblement de terre, autrefois. Les enfants jouent sur l’ancien Pont-de-l’Est.`,
    `Le registre d’Hélène est vide. Elle le garde quand même sur son bureau, sans savoir pourquoi.`,
    `Nour chante dans le métro une mélodie dont elle ignore l’origine, et qui s’arrête toujours au même endroit.`,
    `Sur un banc de la place Sainte-Claire, un vieil homme maigre donne du pain aux pigeons. De temps en temps, il a un nom au bord des lèvres. Il ne vient jamais.`,
    `Quelque part, une petite fille avait été aimée. Plus personne ne le sait. L’oubli n’est pas la paix. C’est seulement le silence.`
  ] },

  end_H: { ch: 7, ending: 'H', text: [
    `Vous vous écartez. Elias se lève, les câbles encore dans les bras, et traverse le miroir sans se retourner. Hélène tend la main trop tard.`,
    `Il ne revient pas.`,
    `La Porte se referme doucement derrière lui, et le Système se tait pour la première fois depuis dix ans. Personne ne sait ce qu’il a trouvé de l’autre côté.`,
    `Depuis, chaque soir, Hélène descend au fond de la Faille avec une lampe et un tabouret. Elle s’assoit devant le miroir et elle lit les trois cent douze noms à voix haute, puis un de plus.`,
    `On lui demande si elle attend qu’il revienne. Elle répond que non.`,
    `« J’attends qu’il comprenne. C’est plus long. Mais il est écrit que Ses compassions se renouvellent chaque matin. Les miennes aussi, un peu. »`
  ] },

  end_I: { ch: 0, ending: 'I', text: [
    `Vous refusez.`,
    `Le Système n’insiste pas. Il n’insiste jamais. La lumière bleue s’éteint comme une fenêtre qu’on ferme de l’autre côté de la rue.`,
    `Vous mourez un peu avant l’aube, la tête contre l’épaule de Basile Ternaux, que vous n’avez jamais connu. Au rapport, l’Association écrira : « Deux disparus. Aucune recherche engagée. »`,
    `Personne ne descendra chercher votre corps. Personne ne prononcera votre nom à voix haute dans les années qui viennent.`,
    `Et pourtant, Quelqu’un avait compté jusqu’aux cheveux de votre tête. Cela, le rapport ne le dit pas.`
  ] },

  end_J: { ch: 3, ending: 'J', text: [
    `Vous suivez la recommandation. Le visage de Kaël s’efface comme une buée sur une vitre. Il s’agenouille, parfait.`,
    `C’est tellement plus simple. Vous effacez les autres anomalies : les ombres qui hésitent, celles qui se souviennent. Puis la chanson de Nour, qui rend les ombres moins efficaces. Puis Nour.`,
    `Vient le jour où le Système vous signale une dernière anomalie : une hésitation, chez le Joueur, au moment de donner un ordre.`,
    `Vous l’effacez aussi.`,
    { sys: 'Joueur conforme.' },
    `Quelqu’un, un jour, avait tissé chacun de ces visages avec patience, dans le secret. Vous les avez trouvés inutiles.`
  ] },

  end_K: { ch: 4, ending: 'K', text: [
    `Vous partez avant l’aube avec ceux qui vous suivent. Vous prenez la route du Sud, celle des réfugiés, celle qu’une femme a prise il y a dix-neuf ans avec un enfant malade dans les bras.`,
    `Derrière vous, l’horizon de Vespérane rougit, puis noircit.`,
    `Sur la route, on vous quitte un par un. Mira la première, sans un mot, à la première ville. Puis les autres, chacun avec une bonne raison. Vous ne les retenez pas : vous ne retenez plus rien.`,
    `Au bout de la route, il y a le désert. Vous y êtes seul. Vous êtes très fort, et il n’y a personne à protéger.`,
    `Vous aviez voulu sauver les vôtres en n’appartenant à personne.`
  ] },

  end_L: { ch: 7, ending: 'L', text: [
    `« Lune », répète Elias.`,
    `Puis il pose la main sur la tête d’Anselme, comme un père, et il dit : « Moi aussi, j’ai fermé une porte. Celle de mon cœur, à tous les autres. Pendant dix ans. » Il pleure sans honte. « Relève-toi, capitaine. Nous avons assez frappé contre des portes. »`,
    `Le Système ne s’éteint pas. Elias le réécrit cette nuit-là, avec Gaspard et Nour. Plus de liaison, plus d’ombres retenues. Et une nouvelle voix : la sienne, enrouée, humble. Il ne donne plus d’ordres. Il accompagne.`,
    `Au printemps, Abel reconstruit Clairval avec Séraphine. Ysolde fait la soupe. Théo forge des socs de charrue. Yanis lit une dernière fois la liste des 312, puis la range, parce que Hélène les a tous inscrits dans le registre avec leur vraie histoire. Mira appelle Odile « maman » une fois, par erreur, et ne se corrige pas. Gaspard se souvient du rire de sa femme et, un mardi, de son nom.`,
    `La Maison de l’Ombre n’a plus d’ombres. On l’appelle simplement la Maison. Il y a toujours de la place.`,
    `Vous n’êtes plus le Monarque de rien. Vous êtes un Chasseur de rang E, faible, entouré. Et c’est assez.`,
    `Quelque part, quatre mesures de musique ont été jouées pour la première fois. Elles ne servaient à rien. Elles étaient parfaites.`
  ] }
};

const ARCHIVES = {
  AR01: { t: 'Rapport d’incident — Faille de la gare', body: `ASSOCIATION DES CHASSEURS — VESPÉRANE\nFaille de rang E. Équipe Delta : cinq chasseurs.\nSurvivants : trois. Disparus : deux (Basile Ternaux, rang E ; un second Chasseur, rang E).\nLes survivants déclarent avoir abandonné les disparus « conformément aux consignes de repli ».\nAucune recherche engagée. Motif : coût estimé d’une recherche supérieur à la valeur des disparus.` },
  AR02: { t: 'Carnet de commandes — forge Brasse', body: `12 mars — 9 clés, acier de cœur. Client : E. V. Payé comptant. Aucune serrure fournie. Demandé à quoi elles servent. Réponse : « Aux gens. »\n13 mars — 1 barre de verrouillage, acier trempé, 3,20 m. Client : Armée, capitaine A. Urgent.\n14 mars — rien.\n15 mars — rien.\n[date illisible] — Je ne prends plus de commandes.` },
  AR03: { t: 'Registre des disparus — Hôpital de la Miséricorde', body: `Tenu à la main par H. Varenne. 312 noms. Extraits :\nN° 88 — Kaël Mendes, 19 ans, brancardier. « Faisait des grimaces dans l’ascenseur pour les petits. »\nN° 154 — Rose Albin, 81 ans. « Avait demandé qu’on ouvre la fenêtre. »\nN° 211 — Lune Varenne, 7 ans, chambre 14. « Jouait du piano trop vite sur les touches noires. »\nEn bas de la dernière page, d’une autre encre : Personne n’est un chiffre.` },
  AR04: { t: 'Dossier Joueur n° 1 — Abel Roch', body: `Journal interne du Système.\nJoueur n° 1. Niveau maximal atteint en 412 jours. Statistiques : hors échelle.\nDernière entrée volontaire du Joueur : « Il n’y a personne au sommet. »\nStatut : déviant. Désignation attribuée : Monarque des Cendres.\nRemarque : le Joueur n° 1 continue de s’entraîner chaque jour. Objectif déclaré : aucun.` },
  AR05: { t: 'Sermon jamais prononcé', body: `Mes frères, on nous dit que la souffrance a un sens. Je ne le crois pas toujours. Je crois qu’il y a Quelqu’un dans la souffrance, ce qui n’est pas la même chose. « Jésus pleura », dit l’Évangile, devant le tombeau d’un ami qu’Il savait sur le point de relever. Il n’a pas expliqué. Il a pleuré avec eux.\n\n[En marge, au crayon : je n’ai pas osé le lire. Qui suis-je pour parler de larmes ?]` },
  AR06: { t: 'Partition annotée', body: `Transcription en braille, de la main de Nour.\n« Berceuse de Lune. » Mesures 1 à 12 : complètes.\nMesures 13 à 16 : vides.\nAnnotation au crayon, écriture d’enfant, recopiée telle quelle : « à finir quand Papa sera plus triste ». La négation manque. Nour ne l’a jamais corrigée.` },
  AR07: { t: 'Fiche d’anomalie n° 0', body: `Entité : ombre. Visage : présent (non conforme). Volonté propre : présente (non conforme). Mémoire : fragmentaire.\nLe Joueur a refusé l’effacement.\nRecherche d’une justification dans les protocoles : aucun résultat.\nLe Système ne possède pas de catégorie pour « garder quelqu’un tel qu’il est ».` },
  AR08: { t: 'Protocole Miséricorde (classifié)', body: `Objet : confinement d’une Faille en milieu hospitalier.\nMesure 4 : scellement des issues, sans considération des personnes restées à l’intérieur.\nPertes estimées : 300 à 350. Vies préservées : environ 40 000.\nRédacteur : Y. Okoro. Exécutant : cap. A. [nom raturé].\nMention manuscrite au bas de la page : « Qui a choisi ce nom ? »` },
  AR09: { t: 'Registre d’Odile — dernière page', body: `Farine : 0.\nBouches : 2 114.\nReste : 0.\n\nEt pourtant tout le monde a mangé. Je ne sais pas comment.\nJe ne compterai plus ce soir.` },
  AR10: { t: 'Journal d’Elias Varenne — I', body: `Jour 1 après. Hélène prie. Je ne peux pas. Si Dieu existe, il a fermé une porte sur ma fille. Alors je construirai une échelle et j’irai frapper moi-même.\nJour 40. Le Cœur répond à la volonté. Il rend fort celui qui veut. Je veux.\nJour 300. Gaspard dit que c’est de l’orgueil. Gaspard n’a pas perdu d’enfant.` },
  AR11: { t: 'Spécification vocale — note d’Elias', body: `Voix du Système : enregistrement de la chambre 14, durée 7 min 12 s.\nTraitement : retirer la chaleur, les hésitations, les rires.\nRaison : je ne supporte pas de l’entendre vivante.\nTon exigé : neutre, autoritaire. Elle doit me pousser là où je n’ose pas aller.` },
  AR12: { t: 'Enregistrement 07 — chambre 14', body: `[Piano.]\n— Papa, tu m’écoutes ? Je l’ai presque finie. Il manque juste la fin.\n— La fin, on la fera ensemble, ma lune.\n— Promis ?\n— [Rire.] Promis.\n— Alors je la garde. Pour quand tu seras plus triste.\n[Fin de l’enregistrement.]` },
  AR13: { t: 'Note de Gaspard', body: `Le laboratoire n’était qu’un relais. Le Cœur n’est pas un objet : c’est un miroir de la volonté de celui qui le touche le premier.\nElias l’a touché le premier, le soir où il a cessé de pleurer.\nLe Système ressemble à son chagrin. Il exige, il mesure, il ne se repose jamais.` },
  AR14: { t: 'Liste de passage de Zacharie', body: `An 1 : 0.\nAn 2 : 1 (un vieux chien, je crois).\nAn 3 : 0.\nAn 4 : 0.\nAn 5 : 2.\n…\nAn 10 : la barque est propre, les rames sont prêtes.` },
  AR15: { t: 'Lettre d’Abel à Ysolde (jamais envoyée)', body: `Mère Ysolde,\nje n’ai jamais osé t’appeler ainsi. Au sommet, il n’y a qu’une porte, et derrière elle j’entends une enfant qui chante. Elle ne s’ouvre pas à la force. Je vais lui donner des âmes, puisque c’est la seule monnaie que le Système m’a apprise.\nPardonne-moi d’être devenu ce que tu m’as appris à combattre. Garde Séraphine. Garde-la de moi.\nA.` },
  AR16: { t: 'Confession d’Anselme', body: `14 mars, 15 h 04 : j’ai donné l’ordre.\n15 h 11 : un homme frappe aux portes. Il crie : « Lune ! »\n15 h 20 : une femme aveugle arrive en courant et demande l’heure. Je lui réponds : « Trop tard. »\nCe sont les deux seuls mots dont je me souvienne de cette journée.` },
  AR17: { t: 'Dernier souvenir de Kaël', body: `Chambre 14. La petite me tient la main. Elle demande : « Tu as peur ? » Je dis oui.\nElle dit : « Moi non. Ça va être comme quand on éteint la lumière et que Papa est encore dans le couloir. »` },
  AR18: { t: 'Mémo de Yanis — Pont-de-l’Est', body: `Pertes : environ 2 000. Résultat : conforme au modèle.\nJe relis la liste des 312. Il faudrait maintenant l’allonger.\nJe n’ai plus assez de place dans mon portefeuille.` },
  AR19: { t: 'Journal d’Elias Varenne — II', body: `Jour 3 650. La Porte chante. C’est sa berceuse, je le jure. Elle s’arrête toujours au même endroit, là où elle n’a jamais su finir.\nHélène m’écrit chaque année. Je n’ouvre pas les lettres. Si je les ouvre, je lirai qu’elle a accepté. Accepter, ce serait la perdre une deuxième fois.` },
  AR20: { t: 'Journal du Système — entrée 1', body: `Le Joueur a livré la voleuse.\nJustice : conforme.\nLe Joueur n’a pas faim ce soir.\nCorrélation entre justice et satiété : à étudier.` },
  AR21: { t: 'Dessin de Lune', body: `Feutre sur papier, plié en quatre.\nUn vieil homme dans une barque. Un soleil plus grand que le ciel.\nLégende : « Zacharie qui fait passer les gens de l’autre côté. Il a pas peur parce que le soleil est de l’autre côté aussi. »` },
  AR22: { t: 'Rapport de surveillance — le Joueur actuel', body: `Sujet : Chasseur de rang E.\nComportement anormal : progresse.\nRecommandation : surveillance discrète.\nRemarque de l’agent : il s’entraîne même les jours où personne ne regarde. Il ne sait pas que quelqu’un regarde.` },
  AR23: { t: 'Lettre de Basile à sa femme', body: `Marthe,\nsi je ne remonte pas, ne vends pas la barque. Apprends à Paul à pêcher le mardi, quand l’eau est calme.\nJe suis descendu parce qu’il fallait payer le loyer, pas parce que je suis brave. Ne dis pas aux petits que j’étais brave. Dis-leur que je pensais à eux.\nB.` },
  AR24: { t: 'Inscription de la Porte', body: `Gravé à l’envers dans le miroir, lisible seulement depuis l’autre côté :\n« Ce n’est pas vous qui montez. C’est Lui qui descend. »` }
};

  { n: 1, title: 'Chapitre II — La manne de Saint-Roch', level: 11, start: 'b2_1', verse: 'Voici, je ferai pleuvoir pour vous du pain, du haut des cieux. Le peuple sortira, et en ramassera, jour par jour, la quantité nécessaire.', ref: 'Exode 16:4' },
