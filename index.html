const T4_NODES = {
  /* ---------------------------- CHAPITRE I ---------------------------- */
  d1_1: { ch: 0, unlock: ['anselme'], archive: ['D01'], text: [
    `La fièvre commence un mardi, dans les Brèches, rue Saint-Roch.`,
    `On ne l’appelle pas encore la fièvre blanche. On dit seulement que le père Gédéon, le cordonnier qui n’a qu’une jambe, ne s’est pas levé pour ouvrir sa boutique. Puis que la veuve Lacombe, au troisième, ne descend plus chercher son lait. Puis que les deux petits Morel, ceux qui toussent depuis l’hiver, dorment depuis trois jours sans se réveiller.`,
    `Ils ne souffrent pas. C’est ce qui fait peur. Leur peau devient pâle, presque transparente, comme du papier qu’on aurait laissé au soleil. Leur respiration ralentit. Leur visage est calme, propre, lisse. On dirait des gisants.`,
    `Frère Anselme vous fait appeler le quatrième jour.`,
    `Son dispensaire du quartier des cendres déborde. Il a installé des paillasses jusque dans la cour, sous une bâche qui claque au vent. Il a les manches retroussées, les avant-bras gris de fatigue. Il vous serre la main sans un mot, puis il vous emmène dehors, dans la rue.`,
    `« Regardez les portes », dit-il de sa voix cassée.`,
    `Vous regardez. Sur chaque porte de la rue Saint-Roch, quelqu’un a tracé un signe à la craie. Sur certaines, une petite croix blanche, nette, soignée. Sur d’autres, un cercle noir, au charbon.`,
    `La porte de Marthe Ternaux porte une croix blanche. Celle du père Gédéon, un cercle noir. Celle des Morel, un cercle noir. Celle de la veuve Lacombe, un cercle noir.`,
    `« Les cercles noirs, ce sont les maisons où quelqu’un s’est endormi, dit Anselme. Chaque fois. Sans exception. Mais le signe est tracé la veille. Pas le lendemain. La veille. »`,
    `Il passe le pouce sur une croix blanche. La craie ne part pas. Elle a la consistance de l’os.`,
    `« Quelqu’un passe la nuit, poursuit-il. Quelqu’un qui sait d’avance qui va tomber. Les enfants l’appellent le Médecin blanc. Ils disent qu’il porte une lanterne et des gants, et qu’il se lave les mains au puits après chaque porte. »`,
    `Paul Ternaux est assis sur la marche de sa maison, sous la croix blanche, le menton dans les mains. Il a grandi. Il vous fait un signe de tête grave, d’homme à homme, puis il regarde la porte du cordonnier, en face. « Gédéon m’a appris à recoudre une semelle, dit-il. Il dit que c’est pas parce qu’il lui manque une jambe qu’il ne sait plus marcher. »`,
    `Au bout de la rue, une femme pleure devant un cercle noir tout frais. Elle frotte avec sa manche. Le charbon s’étale, ne part pas.`
  ], choices: [
    { t: 'Effacer les cercles noirs, un par un, avec de l’eau', to: 'd1_2', set: { chalk: 'wiped' }, add: { comp: 1 } },
    { t: 'Laisser les signes et guetter celui qui les trace', to: 'd1_2', set: { chalk: 'left' } }
  ] },

  d1_2: { ch: 0, reward: 900, text: [
    { if: [['chalk', '==', 'wiped']], t: `Vous passez l’après-midi avec un seau et une brosse. Paul vous suit avec un deuxième seau. Le charbon résiste, puis cède, à force. À la nuit tombée, il n’y a plus un seul cercle noir rue Saint-Roch. Les gens vous regardent faire depuis leurs fenêtres. Personne ne dit merci. Une vieille femme vous apporte un bol de café, sans un mot, et repart.` },
    { if: [['chalk', '==', 'left']], t: `Vous attendez la nuit dans l’encoignure d’une porte cochère, face au puits. Anselme a voulu rester avec vous. Vous l’avez renvoyé à ses paillasses. Il faisait trop de bruit en toussant.` },
    `Vers deux heures du matin, le brouillard monte du fleuve. Il remplit la rue jusqu’aux genoux, puis jusqu’à la taille. Il a une odeur que vous reconnaissez sans savoir d’où : une odeur d’éther, d’eau de Javel, de linge propre qu’on vient de sortir de l’étuve.`,
    `Une lanterne apparaît au bout de la rue.`,
    `Elle avance lentement, de porte en porte. Vous ne voyez pas celui qui la porte, seulement la lumière, et deux mains gantées de blanc qui sortent du brouillard, tracent un signe, et s’y replongent. Croix blanche. Cercle noir. Cercle noir. Croix blanche.`,
    { if: [['chalk', '==', 'wiped']], t: `Il s’arrête devant la porte du père Gédéon. La porte que vous avez lavée. Les mains gantées restent suspendues un long moment devant le bois mouillé, comme si elles hésitaient. Puis elles tracent un nouveau cercle, plus épais que le premier.` },
    `Vous sortez de l’ombre. La lanterne se tourne vers vous.`,
    `Une voix d’homme, douce, fatiguée, très polie, comme celle d’un médecin qui annonce une mauvaise nouvelle à une famille.`,
    `« Je ne fais que lire ce qui est déjà écrit, dit-elle. Je ne choisis rien. Rentrez chez vous, Chasseur. Vous, vous êtes en parfaite santé. »`,
    `Puis le brouillard se lève tout entier, comme un drap qu’on secoue, et il en sort des silhouettes.`,
    `Ce sont des gens. Ou ils l’ont été. Ils sont blancs de la tête aux pieds, lisses, sans pores, sans rides, sans cicatrices. Ils n’ont plus de visage particulier, seulement un visage propre. Ils marchent vers vous en silence, les bras tendus, comme on tend les bras vers un enfant malade pour le prendre et l’emmener.`,
    { sys: 'Ennemis détectés : Blafards.\nOrigine : patients guéris.\nRemarque : aucune pathologie détectée. Aucune autre caractéristique détectée.' }
  ], combat: { name: 'Les Blafards', power: 150, weak: 'str', resist: 'int', foe: 'blafard',
    win: `Ils ne crient pas quand vous les frappez. Ils tombent comme des draps. Quand le dernier s’effondre devant le puits, il se défait en poussière de craie, et dans cette poussière il y a une seule chose qui reste : une alliance, petite, usée, gravée à l’intérieur. Quelqu’un a aimé quelqu’un. Le brouillard ne l’a pas nettoyé, ça.` },
  after: [
    `La lanterne a disparu. Sur le pavé, devant le puits, il y a une paire de gants blancs pliés avec soin, l’un sur l’autre, comme on les pose à la fin d’une opération.`,
    `Vous les ramassez. À l’intérieur du poignet droit, une étiquette cousue, à l’ancienne, au fil rouge : « M. O. — Miséricorde ».`
  ], choices: [{ t: 'Rapporter les gants à Anselme', to: 'd1_3' }] },

  d1_3: { ch: 0, bond: { anselme: 2 }, text: [
    `Anselme regarde l’étiquette pendant si longtemps que la bougie a le temps de couler jusqu’à la soucoupe.`,
    `« Malachie Oste, dit-il enfin. Le docteur Oste. Médecin-chef de la Miséricorde. »`,
    `Il repose les gants sur la table, du bout des doigts.`,
    `« Je l’ai connu. Pas bien. Un capitaine ne connaît pas bien un médecin-chef. Il avait trente-cinq ans, il dirigeait déjà tout l’hôpital. Le meilleur de nous, disait-on. Il avait vidé les Brèches de la tuberculose en deux ans, maison par maison, à pied, avec une sacoche. Il ne prenait pas d’argent quand les gens n’en avaient pas. Il soignait les chiens, aussi, quand on lui demandait. »`,
    `Il tousse. Une toux sèche, qui vient de loin.`,
    `« Après la Faille, il a disparu. On a dit qu’il était mort dedans. On a dit qu’il était parti dans le Sud. On a dit beaucoup de choses. » Il regarde la croix blanche que quelqu’un a tracée, cette nuit, sur la porte de son propre dispensaire. « Il ne s’est jamais trompé de diagnostic. C’est ce qu’on disait aussi. »`,
    `Vous lui demandez si la croix blanche est une bonne nouvelle.`,
    `Il a un petit rire sans joie.`,
    `« Je ne sais pas. Ceux qui ont un cercle noir s’endorment. Ceux qui ont une croix blanche restent éveillés. Ça devrait être une bonne nouvelle. » Il se tourne vers la cour, vers les paillasses, vers les dormeurs pâles sous la bâche. « Mais regardez qui dort. Les vieux. Les infirmes. Les enfants malades. Les fous de la rue des Cloches. Le cordonnier qui n’a qu’une jambe. Ceux qui ne rapportent rien. Ceux que personne n’attend. »`,
    `Il se tait. Puis il dit, très bas :`,
    `« Je connais cette liste. Je l’ai déjà vue quelque part. Je ne sais plus où. »`,
    `Le lendemain matin, une affiche de l’Association est collée sur tous les murs des Brèches.`
  ], choices: [{ t: 'Lire l’affiche', to: 'd2_1' }] },

  /* ---------------------------- CHAPITRE II ---------------------------- */
  d2_1: { ch: 1, archive: ['D02'], text: [
    `AVIS À LA POPULATION. Par mesure de précaution sanitaire, le quartier des Brèches sera placé sous quarantaine à compter de ce soir, vingt heures. Les accès seront fermés. Des distributions seront assurées. Restez calmes. L’Association veille sur vous.`,
    `En bas de l’affiche, en petits caractères : « Protocole Miséricorde, révision 2 ».`,
    `Vous montez au siège de l’Association. La salle des opérations est au dernier étage, derrière une porte capitonnée. Il y a une grande carte de Vespérane sur la table, avec des épingles. Les Brèches sont entourées d’un trait rouge.`,
    `Le directeur des opérations est un homme jeune, rasé de près, avec une cravate grise et des mains qui ne tremblent pas. Il s’appelle Aurèle Danet. Il vous serre la main avec une politesse parfaite.`,
    `« Le Joueur. Nous avons besoin de vous. » Il pose le doigt sur la carte. « Douze accès. Nous avons du monde pour onze. Le douzième, c’est le pont de la rue des Cloches. C’est le plus exposé. Il faut quelqu’un qui puisse tenir si les gens essaient de sortir. »`,
    `Vous lui demandez ce qui se passera pour ceux qui sont à l’intérieur.`,
    `« Des distributions seront assurées. » Il le dit exactement comme sur l’affiche. « Le docteur Oste, s’il existe, ne s’intéresse qu’aux Brèches. Si nous fermons les Brèches, nous protégeons le reste de la ville. C’est un calcul simple. Trois mille personnes contre quatre-vingt mille. »`,
    `Au fond de la salle, près de la fenêtre, quelqu’un pose bruyamment une tasse sur une soucoupe.`,
    `C’est Yanis Okoro. Il porte encore son manteau de la Maison. Il ne devrait pas être là. Il regarde la carte, le trait rouge, les douze épingles, et son visage a la couleur de la cendre.`,
    `« Révision 2, dit-il. Vous avez gardé le nom. »`,
    `Danet lui sourit. « C’était un bon protocole, monsieur Okoro. Il a fait ses preuves. »`,
    `Yanis ne répond pas. Il sort. Vous l’entendez descendre l’escalier, très vite, puis s’arrêter au milieu, et ne plus bouger.`,
    `Danet se retourne vers vous. Il attend.`,
    `Dehors, Anselme est debout sur le trottoir, sous la pluie, sa sacoche à l’épaule. Il ne vous a pas suivi à l’intérieur. Il regarde l’entrée des Brèches, au bout de l’avenue, là où des soldats commencent à dérouler des barbelés.`
  ], choices: [
    { t: 'Accepter de tenir le pont de la rue des Cloches', to: 'end_d_C', add: { dom: 1 } },
    { t: 'Refuser, et entrer dans les Brèches avec Anselme avant vingt heures', to: 'd2_2', add: { comp: 1 } }
  ] },

  d2_2: { ch: 1, reward: 1000, text: [
    `Vous passez la barrière à dix-neuf heures cinquante-cinq, au pont de la rue des Cloches, avec Anselme et sa sacoche. Le soldat qui déroule le barbelé vous regarde passer sans comprendre. « Vous ne pourrez plus ressortir, dit-il.`,
    `— Je sais », dit Anselme.`,
    `Derrière vous, à vingt heures, on referme. Le bruit du barbelé qu’on tend ressemble à celui d’une corde de piano qu’on accorde trop haut.`,
    `Anselme ne se retourne pas. Mais vous voyez sa main, celle qui ne tient pas la sacoche, se crisper sur le vide, comme si elle cherchait une barre de fer.`,
    `Vous remontez la rue Saint-Roch jusqu’au cimetière. C’est là que les enfants disent que le Médecin blanc va se laver les mains, à la fontaine de l’ossuaire, avant le jour.`,
    `Le cimetière Saint-Roch est le plus vieux de Vespérane. Les tombes sont serrées comme des dents. Il y a une chapelle de pierre noire, un ossuaire voûté, et une cloche sans corde, dans un clocheton de fer, qui ne sonne plus depuis la Faille.`,
    `Les corbeaux sont partout. Sur les croix, sur les grilles, sur les anges de pierre. Des centaines. Ils vous regardent passer avec leurs yeux de verre bleu, et ils parlent.`,
    `Ils répètent les derniers mots des morts. Hélène vous l’avait dit, un jour. Vous ne l’aviez pas tout à fait cru.`,
    `« Il fait froid, maman. » « Ferme le gaz. » « Je reviens tout de suite. » « Dis-lui que je ne lui en veux pas. » « Où sont mes lunettes ? » « Pas maintenant, pas maintenant. »`,
    `Anselme s’arrête au milieu de l’allée. Les corbeaux autour de lui se taisent, puis un seul, sur la grille, ouvre le bec et parle avec une voix d’homme, une voix jeune, cassée par la course.`,
    `« Lune ! »`,
    `Anselme ferme les yeux.`,
    `Puis un autre corbeau, plus loin, sur une tombe sans nom, parle avec une voix de vieille femme, très douce, un peu essoufflée. Une voix que vous ne connaissez pas. Vous ne savez pas pourquoi vos mains se mettent à trembler.`,
    `« Ouvrez la fenêtre, s’il vous plaît. Le petit aime entendre les pigeons. »`,
    `Le corbeau penche la tête, et vous regarde, et répète, comme s’il vous l’adressait : « Le petit. Le petit. »`
  ], choices: [{ t: 'Continuer jusqu’à l’ossuaire', to: 'd2_3' }] },

  d2_3: { ch: 1, text: [
    `À la fontaine de l’ossuaire, il n’y a personne. Seulement de l’eau qui coule d’un mufle de lion dans une vasque de pierre, et, au bord de la vasque, un savon. Un vrai savon, blanc, carré, presque neuf. Il sent le linge propre.`,
    `Anselme s’assoit sur la margelle. Il est essoufflé. Il a monté la rue trop vite.`,
    `« Vous savez pourquoi j’ai la voix cassée ? » dit-il.`,
    `Vous ne répondez pas. Il ne pose pas vraiment la question.`,
    `« Tout le monde croit que c’est à force de donner des ordres. C’est ce que je laisse croire. » Il regarde ses mains. « Le 14 mars, à 15 h 11, quand l’homme a commencé à frapper aux portes en criant le nom de sa fille, j’ai crié aussi. De l’autre côté. Pas pour lui répondre. J’ai crié à mes soldats de tenir la barre. Je l’ai crié pendant neuf minutes, de toutes mes forces, pour couvrir sa voix. Pour ne plus l’entendre. »`,
    `L’eau coule dans la vasque.`,
    `« À 15 h 20, je n’avais plus de voix. Il ne m’en est jamais revenu qu’une moitié. Je crois que c’est juste. »`,
    `Il se lève. Il prend le savon blanc dans sa main, le regarde, le repose exactement où il était.`,
    `« Il revient ici chaque matin pour se laver les mains, dit-il. Moi, ça fait dix ans que je me lave les miennes. On devrait bien finir par se croiser. »`,
    `À ce moment, Kaël tombe du mur de l’ossuaire, sans bruit, comme une feuille. Il est essoufflé lui aussi, ce qui est étrange pour une ombre.`,
    `« Je l’ai trouvé, dit-il. Il n’est pas au cimetière. Il est à l’Hospice des Incurables, de l’autre côté de la rue. Il a tout repeint en blanc. » Il hésite. « Et il y a quelque chose d’autre. Je ne sais pas comment le dire. Le bâtiment. La porte de derrière. La buanderie. » Il se frotte le front. « Je la connais. Je n’y suis jamais allé, et je la connais. »`
  ], choices: [{ t: 'Suivre Kaël par les toits', to: 'd3_1' }] },

  /* ---------------------------- CHAPITRE III ---------------------------- */
  d3_1: { ch: 2, bond: { kael: 2 }, text: [
    `Kaël passe par les toits parce que les rues des Brèches, la nuit, sont pleines de brouillard blanc. Il court sur les tuiles comme on court sur un sol plat. Vous le suivez moins bien. Anselme est resté au dispensaire, avec ses dormeurs.`,
    `Du haut des toits, vous voyez toute la quarantaine. Les Brèches sont une île de brouillard dans la ville. Tout autour, les lumières de Vespérane, les lampadaires de l’avenue, les fenêtres des beaux quartiers. Et entre les deux, une ligne de petits feux : les braseros des soldats, aux douze accès.`,
    `« Tu sais ce qui est drôle ? dit Kaël, accroupi sur une cheminée. Je me souviens de ça. Pas d’ici. De ça. Une ligne de soldats autour d’un bâtiment, et des gens à l’intérieur qui ne savent pas encore. »`,
    `Il saute sur le toit suivant.`,
    `L’Hospice des Incurables est un grand bâtiment carré, en face du cimetière, avec une cour au milieu et une chapelle sur le côté. Il était fermé depuis vingt ans. Il ne l’est plus. Toutes les fenêtres sont éclairées d’une lumière blanche, égale, sans ombre, comme celle d’une salle d’opération. Les murs ont été repeints en blanc. Les volets aussi. Même les gouttières.`,
    `Kaël s’arrête au bord du toit et regarde en bas, dans la ruelle, derrière le bâtiment.`,
    `Il y a une porte basse, une rampe pour les chariots, un grand bac de pierre, des cordes à linge sans linge.`,
    `« La buanderie », dit-il.`,
    `Sa voix a changé. Elle est plus jeune.`,
    `« Ce n’est pas celle-ci, dit-il. Ce n’est pas la même. Mais elle est pareille. La rampe. Le bac. Les chariots à draps. On sortait par là quand on ne voulait pas que la surveillante nous voie fumer. » Il rit, surpris. « Je fumais ? »`,
    `Il ne rit plus. Il se tient la tête à deux mains.`,
    `« Il y avait un garçon, dit-il. Je ne vois pas son visage. Il était lourd. Je l’ai porté. Je l’ai porté jusqu’ici. Enfin, jusqu’à une rampe comme celle-ci. » Il vous regarde, perdu. « Pourquoi je l’ai porté ? Il avait quelque chose sur les genoux. Il ne voulait pas le lâcher. »`,
    `Puis le souvenir se referme, d’un coup, comme une porte. Kaël secoue la tête. Il redevient Kaël, l’éclaireur, l’ombre au visage.`,
    `« Je ne sais pas, dit-il. Ça reviendra. Ou pas. Viens, il y a une lucarne ouverte. »`
  ], choices: [{ t: 'Entrer par la lucarne', to: 'd3_2' }] },

  d3_2: { ch: 2, reward: 1100, text: [
    `Vous descendez dans le grenier de l’Hospice, puis par l’escalier de service, jusqu’au premier étage.`,
    `Tout est blanc. Les murs, les plafonds, les rambardes. Le sol a été ciré si souvent qu’il reflète les lampes comme de l’eau. Il n’y a pas un grain de poussière. Il n’y a pas une odeur, sinon celle du savon.`,
    `Les salles communes sont pleines. Des lits en rangées parfaites, chacun à la même distance du voisin, chacun avec un drap tiré au cordeau. Et dans chaque lit, un dormeur pâle, les mains croisées sur le drap.`,
    `Vous reconnaissez le père Gédéon. Sa jambe de bois est posée contre le mur, au pied du lit, bien droite. Vous reconnaissez les deux petits Morel, dans le même lit, tête-bêche. Vous reconnaissez des visages du dispensaire, de la rue des Cloches, du marché. Des dizaines. Des centaines.`,
    `Au pied de chaque lit, une fiche, d’une écriture fine et régulière.`,
    `« Gédéon Marchais, 71 ans. Amputé. Valeur de survie : faible. »`,
    `« Morel, Lucien, 6 ans. Asthme chronique. Valeur de survie : faible. »`,
    `« Morel, Adèle, 4 ans. Idem. Valeur de survie : faible. »`,
    `Kaël lit les fiches par-dessus votre épaule, et vous sentez qu’il ne respire plus, ce qui n’est rien pour une ombre, mais qui est beaucoup pour lui.`,
    `« Valeur de survie, répète-t-il. J’ai déjà lu ces mots. Sur une porte. Sur un tableau, dans un couloir. »`,
    `Au bout de la salle, une grande porte double donne sur l’ancienne chapelle, et devant la porte, quelque chose se lève.`,
    `C’est une armure. Ou ce qu’une armure deviendrait si on la faisait entièrement en os blanchis. Un gardien haut comme deux hommes, fait des ossements de l’ossuaire de Saint-Roch, nettoyés, polis, assemblés avec une précision de chirurgien. Il tient à la main un grand balai de fer, comme un fossoyeur tient sa pelle.`,
    { sys: 'Ennemi détecté : Gardien de l’ossuaire.\nFonction : maintenir la propreté.\nInstruction en cours : évacuer les éléments non conformes.' },
    `Il vous regarde, Kaël et vous. Il penche son crâne de côté, comme pour vous évaluer. Puis il lève son balai vers Kaël, et seulement vers lui.`
  ], combat: { name: 'Gardien de l’ossuaire', power: 165, weak: 'agi', resist: 'str', foe: 'gardien_ossuaire',
    win: `Il ne vous frappe jamais. Il ne frappe que Kaël, méthodiquement, comme on balaie une tache. Vous vous mettez devant. Il vous contourne. Vous vous mettez devant encore. À la fin, quand il se disloque en pluie d’os sur le parquet ciré, vous comprenez : pour la chose qui l’a fabriqué, vous êtes un patient, et Kaël est une saleté.` },
  after: [
    `Les os roulent sur le sol jusqu’aux pieds des lits. Personne ne se réveille.`,
    `Derrière la porte double, une voix douce dit : « Entrez, je vous en prie. Et essuyez vos pieds, si ça ne vous ennuie pas. »`
  ], choices: [{ t: 'Pousser la porte de la chapelle', to: 'd3_3' }] },

  d3_3: { ch: 2, archive: ['D03'], text: [
    `La chapelle est devenue un bureau.`,
    `Les bancs ont été enlevés. L’autel sert de table. Il y a dessus des registres empilés au carré, un encrier, une lampe à abat-jour vert, et une cuvette de porcelaine avec un broc d’eau. Les vitraux ont été repeints en blanc, eux aussi, de l’intérieur. Il ne reste au plafond qu’un Christ en croix, très haut, qu’on n’a pas pu atteindre avec les pinceaux.`,
    `L’homme qui se tient derrière l’autel est grand, maigre, très droit. Il a quarante-cinq ans, il en paraît soixante. Il porte une blouse blanche impeccable, boutonnée jusqu’au col, et ses cheveux sont blancs aussi, mais pas de vieillesse : ils sont blancs comme tout le reste, de la même manière que les murs. Ses yeux sont clairs et doux. Il a des mains très longues, aux ongles coupés court, et il est en train de les essuyer, lentement, doigt par doigt, avec une serviette.`,
    `« Docteur Malachie Oste, dit-il en inclinant la tête. Je vous attendais. Pas si tôt, mais je vous attendais. »`,
    `Il regarde Kaël. Une ombre de dégoût passe sur son visage, aussitôt maîtrisée, comme un médecin bien élevé devant une plaie infectée.`,
    `« Votre… compagnon peut rester près de la porte. Il ne touche à rien, n’est-ce pas ? »`,
    `Il ouvre un registre. Il le tourne vers vous. Des colonnes. Des noms. Des âges. Une dernière colonne, à droite, avec seulement trois mots possibles : élevée, moyenne, faible.`,
    `« Je ne tue personne, dit Oste. Je voudrais que vous compreniez cela d’abord. La clé ne tue pas. Elle endort ceux dont la vie n’est plus qu’une souffrance qui coûte. Elle les endort proprement, sans douleur. Elle libère la ville d’un poids, et elle les libère d’eux-mêmes. Tout le monde y gagne. C’est la première fois dans l’histoire de la médecine qu’on peut le dire honnêtement. »`,
    `Il trempe ses mains dans la cuvette. Il les essuie de nouveau.`,
    `« Vous, je ne vous endormirai pas. Vous êtes récupérable. » Il vous regarde avec une tendresse étrange, presque paternelle. « Je le sais mieux que personne. Je vous ai déjà récupéré une fois. »`,
    `Le silence dure.`,
    `« Vous ne vous en souvenez pas, bien sûr, dit-il doucement. C’est mieux ainsi. C’était mon meilleur travail. Une fracture du fémur gauche, déplacée, avec trois fragments. Vous aviez quatorze ans. Vous ne vouliez pas lâcher un sac. »`,
    `Il referme le registre.`,
    `« Revenez quand vous aurez compris. Je ne bougerai pas d’ici. Je n’ai nulle part ailleurs où aller. »`
  ], choices: [
    { t: '« Qu’est-ce que vous savez de moi ? »', to: 'd4_1', set: { asked: true } },
    { t: 'Renverser la cuvette et sortir', to: 'd4_1', set: { asked: false }, add: { dom: 1 } }
  ] },

  /* ---------------------------- CHAPITRE IV ---------------------------- */
  d4_1: { ch: 3, bond: { helene: 2 }, text: [
    { if: [['asked', '==', true]], t: `Oste ne répond pas à votre question. Il sourit, et il dit seulement : « Demandez à la dame aux registres. Elle sait compter. Elle a seulement mal compté. » Puis il vous tourne le dos et se remet à ses fiches.` },
    { if: [['asked', '==', false]], t: `L’eau de la cuvette coule sur les marches de l’autel. Oste la regarde couler sans bouger. « Ça ne fait rien, dit-il. Je nettoierai. Demandez à la dame aux registres. Elle sait compter. Elle a seulement mal compté. »` },
    `Vous ressortez des Brèches par les égouts, comme les rats. Kaël connaît le chemin. Il ne dit pas un mot de tout le trajet.`,
    `Hélène vous reçoit dans la salle des archives, au sous-sol de l’Association, au milieu des cartons. Elle a déjà le registre des 312 ouvert sur les genoux. Elle l’a toujours ouvert. Vous lui racontez.`,
    `Quand vous dites « une fracture du fémur, quatorze ans », elle relève la tête.`,
    `« Aile Est, dit-elle lentement. Les enfants de l’aile Est avaient tous moins de douze ans, sauf un. » Elle fouille dans un carton, puis dans un autre, puis dans un troisième. « Je l’ai vu. Je l’ai vu il y a dix ans. Je n’y ai pas fait attention. »`,
    `Elle sort une liasse de feuilles jaunies, tenues par une ficelle. Le registre des admissions de la Miséricorde, mars de l’An 0. Elle la feuillette avec des doigts qui ne tremblent plus depuis longtemps et qui, à cet instant, recommencent.`,
    `« Le matin du 14 mars, il y avait trois cent treize lits occupés dans les deux ailes touchées, dit-elle. Trois cent treize. Moi, j’ai toujours compté trois cent douze disparus. J’ai toujours cru que c’était une erreur de l’hôpital, un lit libéré la veille et pas encore rayé. »`,
    `Elle pose le doigt sur une ligne.`,
    `La ligne est presque illisible. L’encre a coulé, comme si quelqu’un avait renversé de l’eau dessus, exprès, ou pleuré. Mais on lit encore la fin.`,
    `« … 14 ans. Fracture fémur gauche. Entré le 2 mars. Accompagnante : Mme R. Albin (grand-mère). Chambre 13. »`,
    `Hélène ne bouge plus.`,
    `Puis elle tourne les pages de son propre registre, celui des 312, très vite, jusqu’au numéro 154. Vous le connaissez par cœur. Tout le monde le connaît, à la Maison.`,
    `« N° 154. Rose Albin, 81 ans. Avait demandé qu’on ouvre la fenêtre. »`,
    `« Une infirmière me l’a raconté, dit Hélène d’une voix blanche. La fenêtre. Je l’ai noté parce que c’était la seule chose qu’on savait d’elle. Je croyais qu’elle était seule. Je croyais qu’elle avait chaud. »`,
    `Elle vous regarde.`,
    `« Elle avait demandé qu’on ouvre la fenêtre pour le petit de la chambre 13. Pour qu’il entende les pigeons. »`
  ], choices: [{ t: 'Ne rien dire', to: 'd4_2' }] },

  d4_2: { ch: 3, unlock: ['mira'], archive: ['D04', 'D06'], text: [
    `Vous ne dites rien parce qu’il n’y a rien en vous qui sache quoi dire. Vous ne vous souvenez d’aucune grand-mère à l’hôpital. Vous vous souvenez d’une grand-mère, oui. Une voix, un psaume murmuré, une odeur de café au lait, un tablier à carreaux. Vous vous souvenez qu’elle est morte le jour de la Faille. On vous l’a dit, après. Vous ne vous êtes jamais demandé où.`,
    `Vous vous souvenez d’un réveil dans un lit d’hôpital qui n’était pas la Miséricorde. D’une jambe dans le plâtre, de la hanche à la cheville. D’un monsieur en blanc qui vous disait que vous aviez eu de la chance, qu’on vous avait trouvé dans la rue après le tremblement de terre. Puis du foyer Saint-Roch, des dortoirs, des sacs qu’on vous donnait à porter parce que vous étiez grand pour votre âge.`,
    `C’est tout. Avant le plâtre, il n’y a rien. Vous avez toujours cru que c’était normal. Que tout le monde, dans les Brèches, avait un trou quelque part.`,
    `Mira arrive le soir, par la fenêtre de la salle des archives, comme d’habitude. Elle a un dossier sous le bras, couvert de poussière blanche.`,
    `« La clinique d’Oste, avant, dit-elle. Rue de l’Abbaye. Fermée depuis l’An 1. Personne n’y a touché. Il avait tout gardé. Tout rangé. » Elle pose le dossier sur la table. « Il range comme moi, quand j’ai peur qu’on me prenne quelque chose. »`,
    `C’est un compte rendu opératoire. Daté du 15 mars de l’An 0. L’écriture fine et régulière, la même que sur les fiches de l’Hospice.`,
    `Mira ne dit rien pendant que vous lisez. Puis elle vous regarde la jambe gauche.`,
    `« Tu boites quand il pleut, dit-elle. Je l’ai remarqué le premier jour. Je remarque tout. Et à la Faille de la gare, au début de tout, c’est la même jambe qui s’est cassée. Le Système te l’a ressoudée. Il a ressoudé une jambe qui avait déjà été ressoudée une fois. »`,
    `Vous relevez votre pantalon. Vous l’avez toujours vue, cette cicatrice. Longue, blanche, avec les petites marques des agrafes de chaque côté, comme une fermeture éclair. Vous ne l’avez jamais regardée.`,
    `Mira tend la main. Elle hésite. Elle la pose à plat sur la cicatrice, très doucement, comme on pose la main sur la tête d’un enfant qui dort.`,
    `« Moi, dit-elle, on m’a laissée sur des marches. Toi, on t’a laissé dans une buanderie. On n’est pas si différents. » Elle retire sa main. « Sauf que toi, quelqu’un t’a porté jusque-là. »`
  ], choices: [{ t: 'Retourner à la buanderie de la Miséricorde', to: 'd4_3' }] },

  d4_3: { ch: 3, bond: { mira: 2, kael: 2 }, text: [
    `Ce qui reste de l’Hôpital de la Miséricorde se trouve au bord de la grande Faille du nord, derrière la clôture de l’Association. Le hall, avec sa barre rouillée en travers des portes. L’aile Ouest, éventrée. L’aile Est n’existe plus : il y a à sa place un trou noir, immobile, d’où monte un vent tiède qui sent l’éther.`,
    `Mais la buanderie est encore là.`,
    `Elle était au sous-sol, à l’arrière, du côté de la rue. La Faille l’a frôlée sans la prendre. Il reste une rampe de béton, un grand bac de pierre fendu, des chariots à draps renversés, rongés de rouille. Et une grille de fer, scellée à l’ancienne, avec des boulons gros comme des poings. Une grille qu’on a fermée de l’extérieur.`,
    `Kaël est là avant vous. Il est assis en haut de la rampe, les bras autour des genoux, comme un garçon qui attend la fin d’une punition.`,
    `Vous descendez la rampe.`,
    `Vous ne savez pas ce qui se passe à ce moment-là. Votre jambe gauche vous fait mal, d’une douleur ancienne, profonde, que vous n’aviez jamais sentie, et qui pourtant est à vous. Vous vous asseyez sur le bord du bac. L’odeur, ici, c’est celle du linge mouillé. Et vous entendez, quelque part, très loin, des pigeons.`,
    `Une image. Une seule.`,
    `Un sac. Un petit sac de toile bleue, avec une poignée en corde et un écusson cousu : une clé de sol, maladroite, brodée au fil jaune. Il est sur vos genoux. Vous le tenez à deux mains, très fort. Quelqu’un vous a demandé d’en prendre soin.`,
    `Puis l’image se referme.`,
    `Vous levez les yeux. Kaël vous regarde depuis le haut de la rampe. Il a le visage de quelqu’un qui vient de voir un fantôme, ce qui est beaucoup pour une ombre.`,
    `« Bleu, dit-il. Le sac était bleu. Avec une clé de sol jaune. »`,
    `Vous ne lui avez rien dit.`,
    `Il descend la rampe lentement. Il s’arrête devant vous. Il vous regarde comme on regarde quelqu’un qu’on a perdu dans une foule et qu’on retrouve des années plus tard, changé, plus grand, mais reconnaissable à une seule chose, une façon de pencher la tête.`,
    `« C’était toi, dit Kaël. Le garçon de la 13. C’était toi. »`,
    { sys: 'Mise à jour du dossier Joueur.\nAntécédents : [donnée restaurée].\nChambre 13. Statut au 14 mars, 15 h 11 : hors zone.\nRemarque : ce dossier avait été effacé. Auteur de l’effacement : non identifié.' }
  ], choices: [{ t: '« Raconte-moi. »', to: 'd5_1' }] }
};

/* ==========================================================================
   TOME IV — LES INUTILES (seconde moitié : chapitres V à VIII, issues, archives)
   ========================================================================== */

Object.assign(T4_NODES, {
  /* ---------------------------- CHAPITRE V ---------------------------- */
  d5_1: { ch: 4, text: [
    `Kaël ne peut pas raconter. Pas encore. Il ouvre la bouche, et les souvenirs arrivent dans le désordre, par morceaux, comme des éclats de verre qu’on ramasse à mains nues. Un ascenseur. Une surveillante. Une liste. Un drap. Il se tait. « Laisse-moi un jour, dit-il. Un seul. Je veux te le dire dans l’ordre. Tu mérites qu’on te le dise dans l’ordre. »`,
    `Vous n’avez pas ce jour.`,
    `Le lendemain matin, Hélène frappe à votre porte, à l’aube, essoufflée. Elle n’a pas mis son manteau.`,
    `« Anselme, dit-elle. Il est tombé dans la cour du dispensaire. Il ne se réveille pas. »`,
    `Puis, avant que vous ayez pu répondre : « Et Théo. Et Nour. Cette nuit. Tous les deux. »`,
    `Rue des Cloches, la forge est froide. Théo est allongé sur son lit de camp, à côté de l’enclume, sa seule main posée sur la poitrine. Il est pâle comme la cendre de son foyer. Sur sa porte, un cercle noir, tracé au charbon.`,
    `Aux Murmures, Nour est assise contre le mur de sa chambre, la tête penchée, comme si elle écoutait quelque chose de très doux. Elle respire à peine. Sur sa porte, un cercle noir.`,
    `Mira est debout devant la porte de Nour, les poings serrés. Sur la porte de Mira, quand vous passez devant, il y a une croix blanche.`,
    `« Il est venu cette nuit, dit-elle. Je l’ai vu. Je n’ai pas pu bouger. Il est passé devant ma porte et il a tracé la croix, et il a dit : “Celle-ci, oui. Agile, jeune, utile.” Et il est passé à côté, chez Nour. » Sa voix se brise. « Il a dit : “Aveugle. Faible.” Elle ! Faible ! »`,
    `Elle frappe le mur du plat de la main.`,
    `Vous allez au dispensaire. Anselme est étendu dans la cour, sous la bâche, au milieu de ses propres patients. Personne ne l’a soulevé. Les brancardiers de l’Association sont là, avec leurs masques de toile et leurs gants, et ils trient. Ils ont une liste. Ils chargent dans un camion ceux qui ont une croix blanche sur le front, tracée au crayon gras. Ceux qui ont un cercle, ils les laissent.`,
    `Anselme a un cercle.`,
    `« Ordre de l’Association, dit un brancardier sans vous regarder. Les cas récupérables sont transférés hors quarantaine. Les autres restent ici, en observation. » Il hésite. « C’est la procédure. »`
  ], choices: [
    { t: 'Soulever Anselme et le porter vous-même', to: 'd5_2', set: { carried: true }, add: { comp: 1 } },
    { t: 'Le laisser en observation et courir à l’Hospice', to: 'd5_2', set: { carried: false } }
  ] },

  d5_2: { ch: 4, reward: 1300, text: [
    { if: [['carried', '==', true]], t: `Il est léger. Beaucoup plus léger qu’un homme de sa taille. Vous le prenez dans vos bras comme on prend un enfant endormi, et vous traversez la cour, et le brancardier ne dit rien, et vous sortez par le portail. Vous le portez jusqu’à la Maison, à travers tout le quartier des cendres. Les gens s’écartent. Une femme se signe. Vous ne le posez qu’une fois, au coin de la rue des Cloches, pour reprendre votre souffle, et Anselme, dans son sommeil, murmure quelque chose. Vous vous penchez. « Ne pose pas la barre », dit-il. Puis plus rien.` },
    { if: [['carried', '==', false]], t: `Vous le laissez. Vous vous dites que vous reviendrez. Que c’est plus urgent d’aller frapper à la source. Que c’est un calcul simple. Au portail, vous vous retournez. Le brancardier a posé une couverture sur Anselme. Une seule. Il fait froid.` },
    `L’Hospice blanc vous attend. Mais la route, cette fois, n’est plus libre.`,
    `Devant les grilles du cimetière Saint-Roch, une rangée de silhouettes vous barre le passage. Ce ne sont plus des Blafards. Ce sont des soignants. Des blouses blanches, des coiffes, des masques de toile, des gants. Ils sont une vingtaine, alignés comme pour une visite, et chacun tient à la main un instrument : un scalpel, une seringue, un plateau, un registre.`,
    `Ils ont des visages, eux. Vous en reconnaissez un. Le brancardier du dispensaire, celui qui triait. Il est là, au premier rang, avec sa liste.`,
    `« Ce sont des vivants, dit Kaël derrière vous, horrifié. La clé les a pris éveillés. Elle ne les a pas endormis. Elle les a… convaincus. »`,
    { sys: 'Ennemis détectés : Blouses blanches.\nStatut : personnel récupéré.\nFonction : appliquer la grille.\nRemarque : les sujets croient bien faire. Cela les rend plus efficaces.' },
    `Le brancardier vous regarde. Il vous reconnaît. Il a l’air sincèrement désolé.`,
    `« Vous êtes récupérable, monsieur, dit-il. Écartez-vous, s’il vous plaît. C’est pour le bien de tout le monde. »`
  ], combat: { name: 'Les Blouses blanches', power: 185, weak: 'end', resist: 'agi', foe: 'blouse_blanche',
    win: `Ils se battent proprement. Pas de cris, pas de rage. Des gestes précis, économes, efficaces. Ils visent les articulations, les tendons, les endroits où un corps cesse d’être utile. Quand ils tombent, ils se relèvent lentement et s’assoient sur le trottoir, hébétés, et ôtent leurs gants un par un, et regardent leurs mains comme s’ils ne les avaient jamais vues. Le brancardier pleure. « J’avais une liste, dit-il. J’avais seulement une liste. »` },
  after: [
    `Vous laissez le brancardier sur le trottoir avec sa liste. Il la plie en quatre, puis en huit, puis en seize, jusqu’à ce qu’elle ne puisse plus se plier.`,
    `Kaël ne vous suit pas vers l’Hospice. Il est resté en arrière, au milieu de l’allée du cimetière, immobile. Les corbeaux se sont tous posés autour de lui, en cercle, en silence.`,
    `« Attends, dit-il. Ça revient. Tout. Dans l’ordre. »`
  ], choices: [{ t: 'Rester avec lui', to: 'd6_1' }] },

  /* ---------------------------- CHAPITRE VI ---------------------------- */
  d6_1: { ch: 5, archive: ['D07'], bond: { kael: 3 }, text: [
    `Kaël s’assoit sur une tombe. Vous vous asseyez à côté de lui. Les corbeaux ne bougent pas.`,
    `Il raconte dans l’ordre, comme il l’a promis. Il parle comme on récite, les yeux fermés, pour ne rien laisser tomber.`,
    `« Le 14 mars, j’arrive à 14 heures. Je suis en retard, comme toujours. La surveillante me crie dessus. Je monte à l’aile Est avec le chariot des goûters. Je fais la grimace du poisson dans l’ascenseur pour les petits Faure, parce qu’ils m’attendent à la porte.`,
    `« À 14 h 55, un officier arrive dans le couloir avec une liste. Il lit des noms. Ilse, Berthe, Odette-la-grande, Solange, tous les soignants. Quatorze noms. Il dit : exercice d’évacuation, personnel seulement. Ilse demande si elle peut finir son pansement. Il dit non.`,
    `« Mon nom n’est pas sur la liste. Ni celui de Paulo, l’autre brancardier. Ni celui de la dame de ménage. On n’est pas du personnel soignant. On est du personnel tout court. Sur la grille, on ne vaut rien. Je ne le sais pas encore. Je crois qu’on nous a oubliés. Je trouve ça drôle. Je me dis que je vais pouvoir fumer tranquille.`,
    `« Puis je vois les soldats, en bas, par la fenêtre. Ils déchargent une barre de fer d’un camion. Une barre de trois mètres. Et je comprends que ce n’est pas un exercice. Je ne sais pas comment je le comprends. Je le comprends, c’est tout.`,
    `« Il y a vingt-deux enfants dans l’aile Est. Et la grand-mère de la 13. Et nous trois. Paulo descend par l’escalier principal pour prévenir. Il ne remonte pas. La dame de ménage se met à genoux dans le couloir et prie. Moi, je cours.`,
    `« La chambre 13 est la plus proche de l’ascenseur de service. L’ascenseur de service descend à la buanderie. La buanderie a une grille sur la rue. C’est mon chemin pour fumer. Personne ne la surveille. »`,
    `Il ouvre les yeux.`,
    `« Dans la 13, il y a un grand garçon dans un fauteuil roulant, avec la jambe dans une gouttière. Et la vieille dame qui a ouvert la fenêtre pour les pigeons. Et la petite de la 14, Lune, qui est venue poser son sac de partitions sur les genoux du garçon, parce qu’il l’emmène tous les jours à la salle de piano, à 15 heures, pour sa leçon. Elle l’appelle “le grand de la 13 qui porte mon sac”. Elle dit qu’il est son porteur officiel.`,
    `« Je dis : il faut sortir, tout de suite, par la buanderie. La vieille dame dit : prenez le petit d’abord. Il ne peut pas marcher. Moi je peux attendre. »`,
    `Kaël se tait. Les corbeaux autour de lui ont tous la tête tournée vers vous.`,
    `« Ta grand-mère, dit-il. Elle a dit : prenez le petit d’abord. Et toi, tu ne voulais pas partir sans Lune. Tu criais. Et Lune t’a mis son sac dans les bras et elle a dit : “Tu le portes, toi. Tu le donneras à Papa. Moi je viens après, avec le monsieur élastique.” »`
  ], choices: [{ t: '« Et après ? »', to: 'd6_2' }] },

  d6_2: { ch: 5, archive: ['D08'], text: [
    `« Après, je t’ai porté, dit Kaël.`,
    `« Pas dans le fauteuil, l’ascenseur était trop petit. Dans mes bras. Tu étais lourd. Tu avais quatorze ans et tu étais plus grand que moi. Tu tenais le sac bleu contre ta poitrine. Tu ne le lâchais pas. Tu as crié tout le long de l’ascenseur parce que ta jambe te faisait mal. Je t’ai dit de chanter. Tu as chanté la chanson de la baleine. Celle d’Ilse.`,
    `« La buanderie. La rampe. Les chariots à draps. Je t’ai couché sur une pile de draps propres, près de la grille, côté rue. Il était 15 h 02. Je le sais parce que l’horloge de la buanderie était au-dessus de ta tête. Je t’ai dit : ne bouge pas. Je remonte chercher les autres. Ta grand-mère, Lune, les petits Faure, tout le monde. Je fais des voyages. J’ai le temps.`,
    `« Je suis remonté. »`,
    `Il sourit. C’est le sourire le plus triste que vous ayez jamais vu sur un visage, vivant ou mort.`,
    `« À 15 h 04, j’étais dans la 14. Lune était assise sur son lit, très sage, avec ses chaussures à boucle. Elle m’a tendu la main. J’ai entendu la barre tomber, en bas, dans le hall. J’ai entendu les soldats fermer la grille de la buanderie, de l’extérieur, à coups de clé. Le protocole disait : toutes les issues. Ils ont fait leur travail. Toi, tu étais déjà dehors, de l’autre côté de la grille. Moi, j’étais dedans.`,
    `« Ta grand-mère était dans le couloir, avec les petits Faure, un dans chaque main. Elle leur récitait quelque chose. Une vallée, une ombre, ne craindre aucun mal.`,
    `« Lune m’a demandé si j’avais peur. J’ai dit oui. Elle a dit : ne t’inquiète pas. Le grand de la 13 est sorti. Il a mon sac. Il le donnera à Papa. Il porte toujours tout.`,
    `« Puis la lumière. »`,
    `Le silence est total. Même les corbeaux ne respirent plus.`,
    `Vous ne vous souvenez de rien. Et vous vous souvenez de tout. Pas des images. D’un poids. Le poids d’un petit sac bleu contre votre poitrine. Le poids de vos bras qui le serrent. Le bruit d’une grille qu’on ferme à clé, juste derrière votre tête. Et la lumière, à 15 h 11, qui passe sous la porte de la buanderie comme de l’eau sous une porte, et qui vous touche la jambe, et qui vous prend tout ce que vous saviez de ce jour-là, et qui vous laisse seulement la jambe cassée et les mains serrées sur rien.`,
    `Parce que le sac, quand on vous a réveillé dans le lit de plâtre, n’était plus là.`,
    `« Je suis resté, dit Kaël. Je suis resté dix ans dans le noir avec un nom, une petite main dans la mienne et un message à transmettre. Je croyais que c’était le message de Lune pour son père. » Il vous regarde. « C’était aussi pour toi. Je voulais te dire que tu ne l’as pas laissée. Tu avais quatorze ans et une jambe en trois morceaux. C’est elle qui t’a donné le sac. C’est elle qui a choisi. »`,
    `Il pose la main sur votre épaule. Elle est froide. Elle est réelle.`,
    `« Et puis tu m’as relevé, dit-il. Dans les Galeries des Murmures. Tu ne savais pas qui j’étais. Moi non plus. Je t’avais porté jusqu’à la grille. Tu m’as porté jusqu’à la lumière. On est quittes, on dirait. »`
  ], choices: [{ t: 'Aller chercher le sac', to: 'd6_3' }] },

  d6_3: { ch: 5, text: [
    `L’Hospice blanc a changé pendant la nuit.`,
    `La salle commune du premier étage est vide. Tous les dormeurs ont été déplacés. Il ne reste que quatre lits, au centre, sous la lumière blanche, alignés comme pour une démonstration.`,
    `Dans le premier, Théo, sa seule main posée sur la poitrine. Dans le deuxième, Nour, la tête penchée, écoutant toujours sa musique silencieuse. Dans le troisième, le père Gédéon, sa jambe de bois au pied du lit.`,
    { if: [['carried', '==', true]], t: `Le quatrième lit est vide. Sur la fiche, d’une écriture fine : « Anselme, ancien capitaine. Valeur de survie : faible. Patient soustrait au protocole par un tiers. » Quelqu’un a ajouté, en dessous, d’une main moins sûre : « Intéressant. »` },
    { if: [['carried', '==', false]], t: `Dans le quatrième, Frère Anselme, sous une seule couverture, très pâle. Sur la fiche : « Anselme, ancien capitaine. Voix : altérée. Valeur de survie : faible. »` },
    `Oste se tient au milieu de la salle, les mains jointes devant lui, gantées de neuf. À côté de lui, sur un guéridon, une cuvette, un broc, un savon blanc. Et une clé.`,
    `Elle est d’un blanc d’os, longue et fine comme un instrument de chirurgie, avec trois dents. Elle repose sur une compresse.`,
    `« Je vous fais une offre, dit Oste. Une offre médicale. Honnête. »`,
    `Il désigne les lits.`,
    `« La clé peut réveiller quelqu’un. Pas tout le monde : ce n’est pas un miracle, c’est un traitement. Elle a une capacité limitée, comme toute ressource. Trois personnes. Trois, et pas une de plus. Choisissez. »`,
    `Il sort de sa poche un crayon gras, rouge, et vous le tend.`,
    `« Tracez une croix sur les fiches de ceux que vous voulez garder. Les autres continueront à dormir, sans douleur. C’est ce que j’ai fait toute ma vie. C’est ce que tout médecin fait, chaque jour, dans chaque hôpital du monde, quand il y a plus de malades que de lits. On appelle ça le triage. Il n’y a aucune honte. Il n’y a que des chiffres. »`,
    `Il sourit.`,
    `« Vous verrez. Une fois qu’on a choisi la première fois, la deuxième fois est plus facile. »`
  ], choices: [
    { t: 'Prendre le crayon et choisir trois noms', to: 'end_d_D', add: { dom: 2 } },
    { t: '« Je ne choisis pas. Je les porte tous. »', to: 'd7_1', add: { comp: 1 } }
  ] },

  /* ---------------------------- CHAPITRE VII ---------------------------- */
  d7_1: { ch: 6, reward: 1700, archive: ['D05', 'D09'], text: [
    `Oste repose le crayon sur le guéridon. Il ne paraît pas fâché. Il paraît fatigué.`,
    `« Vous dites cela parce que vous êtes jeune, dit-il. Je l’ai dit aussi. À trente ans. Je l’ai dit à un commissaire de l’Association qui me demandait combien de lits je pouvais libérer en cas de catastrophe. Je lui ai dit : tous. Je les porterai tous. »`,
    `Il prend la clé sur la compresse. Il la fait tourner entre ses doigts.`,
    `« Le 13 mars de l’An 0, à 18 heures, un messager m’apporte une demande. Une grille de triage pour la Miséricorde, en cas de confinement. Un exercice, dit la lettre. Un exercice théorique, à rendre pour le lendemain matin. Référence de la commande : Y.O. »`,
    `Il lève les yeux vers vous.`,
    `« J’ai passé la nuit dessus. Seul, dans mon bureau. Je l’ai faite comme on fait un exercice : proprement, sans état d’âme. Valeur de survie élevée, moyenne, faible. Le personnel soignant : élevée, on aura besoin d’eux après. Les brancardiers, le ménage : faible, ça se remplace. Les patients de l’aile Ouest, ceux qui paient : élevée, leurs familles posent des questions. L’aile Est, les enfants des Brèches, les chroniques, les asthmatiques, les leucémies, ceux qui reviennent tous les trois mois : faible. Tous, sauf un. Un garçon avec une fracture simple. Récupérable en six semaines. »`,
    `Il rit doucement.`,
    `« C’était ma quatrième version. M-4. J’en étais assez fier. Elle était élégante. »`,
    `Il repose la clé.`,
    `« Le 14 mars, à 15 h 20, j’arrive à l’hôpital en courant. Je n’étais pas de garde. J’ai vu la lumière depuis la rue de l’Abbaye. Les portes sont fermées. Les soldats aussi. Je fais le tour. Derrière, rue de la Buanderie, contre une grille fermée à clé, il y a un garçon couché sur des draps, avec une jambe en trois morceaux, inconscient, qui serre un sac d’enfant contre sa poitrine. »`,
    `Il vous regarde la jambe.`,
    `« Le seul de l’aile Est. Le seul récupérable de ma grille. Le seul qui est sorti. »`,
    `Sa voix ne tremble pas. C’est ce qui est terrible.`,
    `« Vous comprenez ce que j’ai compris, ce jour-là ? Ma grille avait raison. Elle avait raison. Le seul qu’elle avait jugé digne d’être sauvé avait été sauvé. Tous les autres étaient dedans. C’était la preuve. C’était la preuve que je n’avais pas tué vingt-deux enfants avec un crayon, une nuit, pour un exercice. Que je les avais seulement… classés. Correctement. »`,
    `Il se lave les mains dans la cuvette. Il les essuie.`,
    `« Je vous ai opéré moi-même. Je vous ai effacé du registre de l’hôpital. Il ne fallait pas qu’on sache qu’il y avait un survivant dans l’aile Est : on se serait demandé pourquoi lui, et qui l’avait choisi. Je vous ai placé au foyer Saint-Roch sans nom. J’ai gardé le sac. » Il ferme les yeux. « Je n’ai jamais pu le jeter. Je l’ai rangé. »`,
    `Puis il rouvre les yeux, et ils ne sont plus doux du tout.`,
    `« Et vous voilà, dix ans après, à me dire que vous les portez tous. Vous, la preuve vivante que ma grille avait raison. Vous n’avez pas le droit. Vous n’avez pas le droit de me dire ça. »`,
    `Il plante la clé III dans sa propre paume. Il ne crie pas. La lumière blanche des lampes devient aveuglante, sans ombre, sans relief.`,
    { sys: 'Clé III : activation complète.\nPorteur : Malachie Oste.\nDésignation : Monarque de la Peste.\nObjectif déclaré : une cité saine.' }
  ], combat: { name: 'Malachie Oste, Monarque de la Peste', power: 215, weak: 'int', resist: 'end', foe: 'm_peste',
    win: `Il ne se bat pas comme Ilse. Il ne cherche pas à vous immobiliser. Il cherche votre défaut : la vieille fracture, la cicatrice aux agrafes, le genou qui fatigue quand il pleut. Il frappe toujours au même endroit, avec la précision d’un homme qui a lui-même posé les vis. Vous tombez deux fois sur cette jambe. Vous vous relevez deux fois. La troisième fois, c’est lui qui tombe, à genoux, au milieu de ses quatre lits, et la lumière blanche se met à grésiller comme une ampoule qui va griller.` },
  after: [
    `Oste est à genoux sur le parquet ciré. La clé est plantée dans sa paume, et autour de la plaie, sa main blanchit, se craquelle, se défait en craie.`,
    `Il essaie de se lever pour aller à la cuvette. Il n’y arrive pas. Il tend ses mains vers l’eau, de loin, comme un enfant.`,
    `« Mes mains, dit-il. Je dois me laver les mains. Je ne les ai jamais assez lavées. »`,
    `Le broc est à côté de vous. Le savon aussi. Et le crayon rouge, posé sur sa fiche, qui attend toujours qu’on choisisse.`
  ], choices: [
    { t: 'Prendre le broc et lui laver les mains', to: 'd8_1', add: { comp: 1 } },
    { t: 'L’achever. Il ne mérite pas qu’on le soigne', to: 'end_d_B', add: { dom: 2 } }
  ] },

  /* ---------------------------- CHAPITRE VIII ---------------------------- */
  d8_1: { ch: 7, bond: { anselme: 3, helene: 1 }, text: [
    `Vous vous agenouillez devant lui. Vous prenez ses mains, l’une après l’autre. Elles sont froides et sèches comme du plâtre. Vous versez l’eau du broc dessus, lentement. Vous prenez le savon blanc. Vous les lavez.`,
    `Il ne comprend pas. Il vous regarde faire comme on regarde un geste dans une langue étrangère.`,
    `« Pourquoi ? dit-il. Vous savez ce que j’ai fait. »`,
    `Vous lui répondez que vous ne le lavez pas parce qu’il le mérite. Vous lui répondez qu’il y a quelqu’un, une fois, qui a lavé les pieds de celui qui allait le trahir, en sachant qu’il allait le trahir. Que vous n’avez jamais compris cette histoire. Que vous commencez.`,
    `La craie de ses mains fond sous l’eau. Elle coule dans la cuvette, blanche, puis grise, puis claire. En dessous, il y a des mains d’homme. Des mains de cinquante ans, avec des taches, des veines, une vieille brûlure à l’index, des ongles rongés au sang. Des mains qui n’ont jamais été propres.`,
    `La clé III glisse de sa paume et tombe dans la cuvette avec un petit bruit de cuillère.`,
    `Oste regarde ses mains nues.`,
    `Puis il se met à pleurer. Pas comme Ilse, qui avait retenu ses larmes pendant dix ans. Comme un homme qui ne savait pas qu’il en avait.`,
    `« Vingt-deux, dit-il. Vingt-deux enfants. Et la dame de ménage. Et le brancardier qui est descendu prévenir. Et votre grand-mère. Je connais tous leurs noms. Je les ai écrits sur la grille. Je ne les ai jamais dits. »`,
    `Et il les dit. Tous. Un par un, à genoux, les mains dans la cuvette. Clément Faure. Julie Faure. Rose Albin. Paul Ledru, dit Paulo. Lune Varenne. Il les dit lentement, comme Hélène les écrit.`,
    `Autour de vous, dans tout l’Hospice, les dormeurs se réveillent.`,
    `Pas d’un coup. Un par un. Le père Gédéon ouvre les yeux et cherche sa jambe de bois à tâtons. Nour relève la tête, et elle dit : « Quelqu’un pleure. » Théo se redresse sur son lit, regarde sa seule main, et grogne : « Qu’est-ce que je fais en pyjama ? »`,
    { if: [['carried', '==', true]], t: `À la Maison, dans le lit où vous l’avez couché, Anselme se réveille à la même minute. Hélène est assise à côté de lui. Elle racontera plus tard qu’il a dit, en ouvrant les yeux, sans savoir où il était : « Il l’a lâchée ? La barre ? » Et qu’elle lui a répondu oui, sans savoir de quoi il parlait, parce que c’était visiblement la bonne réponse.` },
    { if: [['carried', '==', false]], t: `Dans la cour du dispensaire, sous sa couverture unique, Anselme se réveille seul. Il a froid. Il se lève. Il ramasse la couverture et va la poser sur l’homme d’à côté, qui se réveille aussi et grelotte. Puis il en cherche une autre, pour le suivant. Il passe la nuit à ça. Vous le trouvez à l’aube, sans voix du tout, mais debout.` },
    `Anselme arrive à l’Hospice au milieu de la nuit. Il s’agenouille à côté d’Oste, devant la cuvette. Ils ne se regardent pas. Ils regardent l’eau.`,
    `« Vous avez écrit la liste, dit Anselme de sa demi-voix. J’ai posé la barre. Aucun de nous deux n’a ouvert la porte. »`,
    `Oste hoche la tête.`,
    `Anselme prend la cuvette, l’eau sale, la clé au fond, et il la vide dans le caniveau de la cour. Puis il la remplit d’eau propre au puits, et il la repose devant Oste. Et il dit : « À votre tour. » Et il retire ses sandales.`
  ], choices: [{ t: 'Aller chercher le sac', to: 'd8_2' }] },

  d8_2: { ch: 7, archive: ['D10'], bond: { nour: 3, kael: 2 }, text: [
    `Le sac est dans le bureau d’Oste, au fond de la chapelle, dans une armoire de pharmacie fermée à clé. Il est rangé sur une étagère, à hauteur d’yeux, entre un flacon d’éther et une boîte de gants. Seul. Il y a une étiquette sur l’étagère, de l’écriture fine : « 13 ».`,
    `Un petit sac de toile bleue, délavé. Une poignée en corde. Une clé de sol brodée au fil jaune, maladroite, avec un point qui dépasse.`,
    `Vous le prenez. Il ne pèse presque rien. Il pèse tout.`,
    `Vous le rapportez à la Maison, et vous l’ouvrez sur la table de la cuisine, devant tout le monde. Hélène. Kaël. Nour, qu’on a ramenée enveloppée dans trois couvertures. Mira, perchée sur le buffet. Théo, appuyé contre le chambranle.`,
    `Dedans, il y a un cahier de musique à spirale, avec des gammes et des exercices, et des notes au crayon dans la marge, de la main de Nour, en gros caractères pour que Lune puisse lire. Une barrette en plastique en forme de chat. Un bonbon à la menthe, fondu dans son papier. Un petit diapason d’acier, glissé dans la doublure. Un dessin, plié en quatre : un grand bonhomme dans un fauteuil à roulettes, avec un sac bleu sur les genoux, et une petite fille à côté qui lui tient la main. En dessous, en lettres d’enfant : « MON PORTEUR ».`,
    `Et une enveloppe.`,
    `Une enveloppe blanche, fermée, collée avec un autocollant de chat, le même que sur le carnet de soins rose d’Ilse. Dessus, au feutre violet, en majuscules d’enfant qui penchent :`,
    `« POUR PAPA. PAS OUVRIR. SAUF QUAND IL SERA PLUS TRISTE. »`,
    `Hélène porte la main à sa bouche.`,
    `Nour tend les doigts vers l’enveloppe. Elle la touche à peine. Elle la caresse du bout de l’index, et son visage change.`,
    `« Il y a des bosses, dit-elle. À travers le papier. » Sa voix tremble. « Elle a piqué les notes avec une épingle. En braille. Comme je lui avais appris. Pour que je puisse la lire aussi. » Elle retire sa main très vite, comme si l’enveloppe brûlait. « C’est la fin. Les quatre mesures. Elle l’avait finie. Elle l’avait écrite pour lui, et elle l’avait écrite pour moi. »`,
    `Personne ne bouge.`,
    `Vous pourriez l’ouvrir. Vous pourriez demander à Nour de la lire du bout des doigts, à travers le papier, sans même décoller le chat. Vous sauriez enfin comment se termine la berceuse qui chante dans votre tête chaque fois que vous montez de niveau. Vous le méritez peut-être. Vous l’avez portée dix ans sans le savoir.`
  ], choices: [
    { t: 'Refermer le sac. Ce n’est pas à vous', to: 'd8_3', set: { page: 'sealed' }, add: { comp: 1 } },
    { t: 'Demander à Nour de la lire', to: 'd8_3', set: { page: 'asked' } }
  ] },

  d8_3: { ch: 7, archive: ['D11'], text: [
    { if: [['page', '==', 'sealed']], t: `Vous refermez le sac. Vous le serrez contre votre poitrine, comme à quatorze ans. Nour sourit, les yeux pleins de larmes. « Merci, dit-elle. Je n’aurais pas su résister. »` },
    { if: [['page', '==', 'asked']], t: `Nour secoue la tête doucement. « Non, dit-elle. Pas moi. Pas toi. » Elle pose la main sur la vôtre, sur l’enveloppe. « Elle a écrit : pour Papa. Elle a écrit : pas ouvrir. Elle avait sept ans et elle savait déjà ce qu’on ne fait pas aux gens qu’on aime. On ne leur prend pas leur chagrin. » Vous refermez le sac.` },
    `Théo s’approche de la table. Il pose la clé III à côté du sac. Elle est sèche, maintenant, et grise, comme un vieil os.`,
    { if: [['III.key', '==', 'theo']], t: `« Avec celle d’Ilse, ça fera deux dans la boîte, dit-il. Ou trois, si Ruben a été sage. »` },
    { if: [['III.key', '!=', 'theo']], t: `« Encore une, dit Théo. Il était médecin, celui-là, non ? Mon apprenti s’était brûlé, avant tout ça. On n’avait pas de quoi payer. Il est venu à la forge le soir même, avec sa sacoche, et il l’a soigné gratis. » Il secoue la tête. « On n’est jamais une seule chose, hein. »` },
    `Puis il prend le diapason dans le sac, de sa seule main. « La petite venait à la forge, parfois, avec son père, dit-il. Elle voulait voir le feu. Elle disait que le fer, c’est triste, parce qu’il ne chante pas. Alors je lui ai fait ça. » Il le frappe contre le bord de la table. Il chante. Un la, très pur, qui reste longtemps dans la cuisine.`,
    `Vous montez dans votre chambre. Vous posez le sac bleu sur l’étagère, à hauteur d’yeux, à côté de la plaque de Basile, de la médaille de Mira, des clés et des lettres. Vous vous asseyez sur le lit.`,
    `Le Système s’ouvre devant vous. Une fenêtre bleue. Vous montez de niveau.`,
    `La berceuse joue. Les cinq notes. Comme toujours.`,
    `Puis, pour la première fois depuis le premier jour, il y a une sixième note.`,
    `Une seule. Un la, très pur, exactement celui du diapason de Théo.`,
    `Et sous les statistiques, au bas de la fenêtre, là où il n’y a jamais rien, une ligne s’écrit. Pas avec la voix sans timbre du Système. Avec une autre voix. Une voix d’enfant, filtrée, lointaine, une voix que vous entendez tous les jours depuis votre éveil et que vous n’aviez jamais vraiment écoutée.`,
    { sys: 'Tu portes encore mon sac.' },
    `La ligne clignote une fois. Puis une autre fenêtre, rouge, la recouvre aussitôt, comme une main qu’on pose sur une bouche.`,
    { sys: 'ALERTE. Message non autorisé.\nSource : administrateur L.\nAccès administrateur L : révoqué en An 1.\nAnomalie : l’accès a été utilisé deux fois en dix ans.\nPremière utilisation : An 10, Faille de la gare, 2 h 04. Objet : sélection du Joueur n° 2.\nSeconde utilisation : maintenant.' },
    `La fenêtre se ferme.`,
    `Vous restez assis dans le noir, très longtemps, la main posée sur le sac bleu.`
  ], choices: [
    { t: 'Confier la clé III à Théo', to: 'end_d_A', set: { key: 'theo' } },
    { t: 'La confier à Zacharie et au fleuve', to: 'end_d_A', set: { key: 'river' } },
    { t: 'La garder sur vous', to: 'end_d_A', set: { key: 'kept' } }
  ] },

  /* ------------------------------ ISSUES ------------------------------ */
  end_d_A: { ch: 7, ending: 'A', text: [
    `La quarantaine des Brèches est levée un jeudi, sans annonce. Un matin, les soldats ne sont plus là. Il reste les braseros froids et les barbelés, que les enfants transforment en cordes à sauter.`,
    `L’Hospice des Incurables a gardé ses murs blancs. Personne n’a eu le courage de les repeindre. Mais on y a remis des bancs dans la chapelle, et du désordre dans les salles. Il y a des chaussettes sur les radiateurs. Il y a un chien.`,
    `Le docteur Malachie Oste y travaille comme aide-soignant. Pas comme médecin : il a refusé. Il fait les lits, il vide les bassins, il pousse les fauteuils. Il ne trie plus. Le soir, il fait la lecture au père Gédéon, qui s’endort au bout de deux pages, et Oste continue de lire quand même, jusqu’à la fin du chapitre, à voix basse, parce qu’on ne laisse pas une histoire au milieu.`,
    `Il ne s’est pas pardonné. Anselme non plus. Ils se lavent les mains et les pieds l’un l’autre, le premier vendredi du mois, dans la cour, devant tout le monde, et les enfants des Brèches trouvent ça très drôle, deux vieux messieurs dans une bassine. Ils ont raison.`,
    `Hélène a rayé un chiffre dans son registre. En haut de la première page, là où il était écrit 312, elle a écrit 313. Puis, au bas de la liste, elle a ajouté une ligne, de son écriture appliquée :`,
    `« N° 313. Le garçon de la chambre 13, 14 ans. Survivant. Il portait le sac de Lune. Il le porte encore. »`,
    `Puis, après un temps, à la ligne de Rose Albin, elle a ajouté une phrase : « A dit : prenez le petit d’abord. »`,
    `Le sac bleu est sur votre étagère, à hauteur d’yeux. L’enveloppe est dedans, fermée, avec son chat. Vous ne savez pas où est Elias Varenne. Personne ne le sait. Mais un jour vous le saurez, et ce jour-là vous descendrez le lui porter, où qu’il soit. C’est votre métier. Vous l’avez toujours fait.`,
    `Le Système enregistre l’événement.`,
    { sys: 'Monarque de la Peste : neutralisé.\nClé III : sans porteur.\nDormeurs réveillés : 431.\nValeur de survie moyenne de la population : non calculable.\nRemarque : la grille M-4 a été supprimée par un utilisateur sans droits d’accès. Origine de la suppression : inconnue.' },
    `Vous fermez la fenêtre. Ce soir, quand vous monterez de niveau, il y aura de nouveau six notes. Vous le savez. Vous comptez déjà les jours jusqu’à la septième.`
  ] },

  end_d_B: { ch: 6, ending: 'B', text: [
    `Vous prenez le crayon rouge sur le guéridon.`,
    `Vous tracez un cercle noir sur la fiche d’Oste. Puis vous frappez.`,
    `Il ne se défend pas. Il vous regarde jusqu’au bout avec une sorte de soulagement, comme un patient qui entend enfin un diagnostic qu’il redoutait depuis longtemps et qui le trouve juste.`,
    `« Vous voyez, dit-il dans un souffle. Vous aussi. Valeur de survie : faible. »`,
    `Il tombe en poussière de craie sur le parquet ciré. La clé III roule jusqu’à vos pieds, blanche, propre, impeccable.`,
    `Les dormeurs ne se réveillent pas. Pas un seul. Le traitement s’est arrêté en même temps que le médecin. Ils restent dans leurs lits, dans leurs draps tirés au cordeau, pâles, calmes, propres, et ils y restent encore aujourd’hui. Théo. Nour. Le père Gédéon. Anselme. Les quatre cent trente et un.`,
    `Vous avez nettoyé Vespérane de son Monarque de la Peste. On vous décore. Aurèle Danet vous serre la main sur les marches de l’Association, devant les photographes. Il dit que vous êtes un exemple. Il dit que les Brèches sont plus saines qu’elles ne l’ont jamais été. C’est vrai : on n’y entend plus tousser.`,
    `Parfois, la nuit, vous vous réveillez avec un crayon dans la main. Vous ne savez pas qui vous l’a donné. Vous ne savez plus depuis combien de temps vous regardez les gens dans la rue en vous demandant ce qu’ils valent.`,
    `Le sac bleu reste dans l’armoire de pharmacie, au fond de la chapelle, sur son étagère étiquetée « 13 ». Personne ne vient le chercher. Il n’y a plus personne pour se souvenir qu’il existe.`
  ] },

  end_d_C: { ch: 1, ending: 'C', text: [
    `Vous tenez le pont de la rue des Cloches.`,
    `La première nuit, personne n’essaie de passer. La deuxième nuit, une femme arrive avec un enfant dans les bras. L’enfant est pâle, il dort, elle dit qu’il faut un médecin, de l’autre côté. Vous lui dites qu’il y aura des distributions. Elle vous regarde. Elle repart.`,
    `La troisième nuit, il en vient vingt. La quatrième, il n’en vient plus.`,
    `Le quinzième jour, Frère Anselme apparaît de l’autre côté des barbelés. Il est entré dans les Brèches seul, le premier soir, avec sa sacoche. Il est très pâle. Il marche lentement. Il s’arrête à un mètre du fil, en face de vous.`,
    `« Capitaine », dit-il.`,
    `Il ne vous demande pas d’ouvrir. Il ne vous reproche rien. Il vous regarde seulement, avec ses yeux d’il y a dix ans, ceux qu’il avait derrière une barre de fer quand un homme frappait de l’autre côté. Puis il fait demi-tour et il remonte la rue Saint-Roch vers ses malades.`,
    `Le lendemain, il ne revient pas. Le surlendemain non plus.`,
    `La quarantaine dure deux mois. Quand on la lève, on ne trouve plus personne de « faible valeur » dans les Brèches. Les statistiques sanitaires de Vespérane n’ont jamais été aussi bonnes. Aurèle Danet reçoit une médaille. Vous aussi.`,
    `Hélène ajoute une page à son registre. Elle ne vous la montre pas.`,
    `Le Système enregistre l’événement.`,
    { sys: 'Protocole Miséricorde, révision 2 : succès.\nPertes : acceptables.\nRemarque : le Joueur a tenu sa position. Comportement conforme.' },
    `C’est la première fois que le Système vous trouve conforme. Vous découvrez que c’est la pire chose qu’il vous ait jamais dite.`
  ] },

  end_d_D: { ch: 5, ending: 'D', text: [
    `Vous prenez le crayon rouge.`,
    `C’est facile, en fait. Plus facile que vous ne l’auriez cru. Théo : il forge les armes, il est utile. Une croix. Nour : ses chants tiennent les ombres. Une croix. Ensuite, il faut choisir entre Anselme et le père Gédéon. Vous hésitez. Pas longtemps. Un aumônier rend plus de services qu’un cordonnier. Une croix.`,
    `Le père Gédéon reste endormi. Vous ne le connaissiez pas bien. Vous vous dites que c’est un calcul simple.`,
    `Oste vous reprend le crayon des mains avec un sourire de professeur satisfait.`,
    `« Vous voyez ? dit-il. Vous ne ressentez rien. C’est la première fois, et vous ne ressentez rien. C’est le métier. »`,
    `Il a raison. C’est ce qui vous empêche de dormir, cette nuit-là, et toutes les suivantes. Pas le remords. L’absence de remords.`,
    `Théo, Nour et Anselme se réveillent. Ils vous remercient. Puis ils apprennent comment. Théo ne vous parle plus. Nour vous parle, mais elle ne chante plus quand vous êtes dans la pièce. Anselme, lui, vous regarde longtemps et vous dit, de sa demi-voix : « Maintenant vous savez ce que c’est. Je suis désolé que vous le sachiez. »`,
    `Le docteur Oste est toujours à l’Hospice blanc. Il vous envoie, chaque mois, une nouvelle grille à valider. Il dit que vous avez l’œil. Vous ne les validez pas. Vous ne les jetez pas non plus.`,
    `Le sac bleu reste dans son armoire, avec son étiquette « 13 ». Vous savez qu’il est là. Vous n’allez pas le chercher. Vous ne savez plus si vous en êtes digne.`,
    `Le père Gédéon dort toujours, au premier étage, sa jambe de bois au pied du lit. Quelqu’un lui a ciré ses chaussures. Ce n’est pas vous.`
  ] }
});

/* ---------- Archives du Tome IV (préfixe D) ---------- */
Object.assign(ARCHIVES, {
  D01: { t: 'Relevé des craies — rue Saint-Roch', body: `Noté par Frère Anselme, au dos d’une ordonnance.\nN° 3 : croix blanche. Marthe Ternaux et son fils. Éveillés.\nN° 4 : cercle noir. Gédéon Marchais, cordonnier, une jambe. Endormi le lendemain.\nN° 7 : cercle noir. Veuve Lacombe. Endormie le lendemain.\nN° 9 : cercle noir. Lucien et Adèle Morel, asthmatiques. Endormis le lendemain.\nN° 12 : croix blanche. Famille Brunet, boulangers.\nSigne tracé : la veille, chaque fois.\n\nEn bas, d’une autre encre : « Les signes ne prédisent pas. Ils décident. »` },
  D02: { t: 'Avis de quarantaine', body: `ASSOCIATION DES CHASSEURS — AVIS À LA POPULATION\nPar mesure de précaution sanitaire, le quartier des Brèches sera placé sous quarantaine à compter de ce soir, vingt heures.\nLes accès seront fermés. Des distributions seront assurées.\nRestez calmes. L’Association veille sur vous.\n\nRéférence : Protocole Miséricorde, révision 2.\nPour la direction des opérations : A. Danet.` },
  D03: { t: 'Registre de l’Hospice blanc', body: `Tenu par le Dr M. Oste. Extraits.\nGédéon Marchais, 71 ans. Amputé. Valeur de survie : faible.\nLucien Morel, 6 ans. Asthme chronique. Valeur de survie : faible.\nVeuve Lacombe, 88 ans. Seule. Valeur de survie : faible.\nUn musicien des rues, âge inconnu. Ivre. Valeur de survie : faible.\n\nEn marge, à l’encre, de la même main : « Aucun d’eux ne souffre. »\nEn marge, au crayon, d’une main plus tremblante : « Est-ce que c’est vrai ? »` },
  D04: { t: 'Admissions — aile Est, mars de l’An 0', body: `HÔPITAL DE LA MISÉRICORDE — REGISTRE DES ENTRÉES\nLits occupés au matin du 14 mars (ailes touchées) : 313.\n[…]\nChambre 12 — Faure, Clément et Julie, 5 et 7 ans. Leucémie (Julie), accompagnant (Clément).\nChambre 13 — [nom effacé par l’eau], 14 ans. Fracture du fémur gauche, trois fragments. Entré le 2 mars. Accompagnante : Mme R. Albin (grand-mère).\nChambre 14 — Varenne, Lune, 7 ans. Entrée le 21 février.\n[…]\n\nNote d’H. Varenne, An 10 : « J’ai toujours compté 312. Je ne me suis jamais demandé où était passé le 313e. »` },
  D05: { t: 'Grille M-4 — exercice de confinement', body: `HÔPITAL DE LA MISÉRICORDE — Grille de triage, quatrième version.\nÉtablie dans la nuit du 13 au 14 mars, An 0, par le Dr M. Oste, médecin-chef.\nCommande : Y.O. Motif indiqué : « exercice théorique ».\n\nValeur de survie ÉLEVÉE : personnel soignant (14 noms) ; aile Ouest, patients à couverture complète.\nValeur de survie MOYENNE : aile Ouest, patients sans couverture.\nValeur de survie FAIBLE : personnel non soignant (brancardiers, entretien) ; aile Est, pathologies chroniques, enfants des Brèches.\nException, aile Est : chambre 13. Fracture simple. Récupérable en six semaines.\n\nConsigne en cas de confinement : évacuer la catégorie ÉLEVÉE. Maintenir les autres en chambre.\n\nAu dos, de la même écriture, datée du 15 mars : « Ce n’était pas un exercice. »` },
  D06: { t: 'Compte rendu opératoire — 15 mars, An 0', body: `Clinique de la rue de l’Abbaye. Opérateur : Dr M. Oste.\nPatient : sans nom. Désignation provisoire : « 13 ».\nSexe masculin, environ 14 ans. Trouvé inconscient rue de la Buanderie, contre la grille de l’hôpital, le 14 mars à 15 h 40.\nFracture déplacée du fémur gauche, trois fragments. Ostéosynthèse par plaque et vis. Agrafes.\nAu réveil : amnésie complète de l’événement. Ne connaît pas son adresse. Réclame un sac.\nRemarque : le patient tenait à son arrivée un sac d’enfant en toile bleue. Il a refusé de le lâcher pendant l’anesthésie. Retiré après endormissement.\nOrientation : foyer Saint-Roch. Ne pas signaler la provenance.` },
  D07: { t: 'Ce que Kaël a retrouvé', body: `Récité par Kaël, sur une tombe du cimetière Saint-Roch. Noté par le Joueur.\n14 h 55 : la liste. Mon nom n’y est pas. Les brancardiers ne valent rien.\n14 h 58 : la barre, en bas, dans le camion. Je comprends.\n15 h 00 : chambre 13. La grand-mère dit : prenez le petit d’abord. Lune lui donne son sac : « Tu le portes, toi. Tu le donneras à Papa. »\n15 h 02 : la buanderie. Je le couche sur les draps. Je dis : ne bouge pas, je reviens.\n15 h 04 : la barre tombe. La grille de la buanderie se ferme. Je suis dedans.\n15 h 11 : la petite main dans la mienne.\n\n« Je l’avais porté jusqu’à la grille. Il m’a porté jusqu’à la lumière. »` },
  D08: { t: 'Relevé du Système — clé III', body: `Objet : clé III (porteur : M. Oste).\nEffet : asepsie.\nPrincipe : suppression de la maladie par suppression des malades.\nCritère : valeur de survie.\nRemarque : le critère n’a pas été défini par le Système. Il a été importé du porteur.\nRemarque complémentaire : le porteur ne l’avait pas inventé non plus. Il l’avait reçu par commande.` },
  D09: { t: 'Fiche d’orientation — foyer Saint-Roch', body: `FOYER SAINT-ROCH POUR GARÇONS — ADMISSION\nDate : 2 mai, An 0.\nNom : non déclaré. Prénom : celui qu’il donnera.\nÂge : 14 ans environ.\nProvenance : « trouvé dans la rue après le tremblement de terre ».\nÉtat : jambe gauche consolidée. Boite légèrement. Calme. Ne parle pas de sa famille.\nAdressé par : Dr M. Oste. Frais de pension réglés d’avance pour quatre ans. Donateur : anonyme.\n\nNote de la surveillante, An 1 : « Il porte les sacs des petits jusqu’à l’école. On ne le lui a jamais demandé. »` },
  D10: { t: 'Inventaire du sac bleu', body: `Un sac de toile bleue, poignée en corde, écusson brodé (clé de sol, fil jaune).\nContenu :\n— un cahier de musique à spirale, annoté par Nour en gros caractères ;\n— une barrette en forme de chat ;\n— un bonbon à la menthe, fondu ;\n— un dessin : « MON PORTEUR » ;\n— un diapason d’acier (la 440), forgé par T. Brasse ;\n— une enveloppe fermée, autocollant de chat. Inscription : « POUR PAPA. PAS OUVRIR. SAUF QUAND IL SERA PLUS TRISTE. » Au toucher : relief de braille, quatre mesures.\n\nNon ouverte.` },
  D11: { t: 'Journal du Système — accès administrateur L', body: `Accès administrateur L. Créé : An −1 (projet Échelle). Titulaire déclaré : « voix de référence ».\nRévoqué : An 1, sur ordre de E. V. (« elle ne doit plus rien décider »).\nUtilisations après révocation : 2.\n1. An 10, Faille de la gare, 2 h 04. Action : attribution du statut de Joueur à un Chasseur de rang E sans clé. Motif enregistré : « c’est lui ».\n2. An 10, après la neutralisation de la clé III. Action : message non autorisé. Contenu : « Tu portes encore mon sac. »\n\nStatut : anomalie non résolue.` }
});
