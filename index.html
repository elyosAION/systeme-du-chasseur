/* Ysolde a-t-elle été rencontrée au Pont-de-l’Est (Tome I, plan refusé) ? */
const T3_KNOWN = [['I.plan', '==', 'refuse']];
const T3_NEW = [['I.plan', '!=', 'refuse']];

const T3_NODES = {

  /* ------------------------------ CHAPITRE I ------------------------------ */
  g1_1: { ch: 0, unlock: ['ysolde'], archive: ['C07'], text: [
    `La lettre arrive par Hélène, un matin de pluie. L’enveloppe est épaisse, d’un papier gris de mauvaise qualité, et l’écriture est énorme, appliquée, celle de quelqu’un qui tient un crayon comme on tient un manche de pioche.`,
    `Hélène la pose sur votre table sans l’ouvrir. « Elle est passée par l’Association. Il n’y a pas de nom de destinataire. Il y a seulement écrit : “Au Joueur. Celui qui ne s’agenouille pas devant ses morts.” » Elle a un petit sourire triste. « J’ai pensé que c’était vous. »`,
    `Vous l’ouvrez.`,
    `« Joueur,`,
    `je ne demande jamais rien à personne. C’est une règle. Mais la règle ne sert plus à grand-chose parce que bientôt il n’y aura plus personne à qui ne rien demander.`,
    `À Haute-Brume, il y avait vingt-trois maisons. Il y en a neuf avec la fenêtre allumée. Depuis deux hivers, l’hiver ne s’en va plus. Il descend du col. Il neige en août. Le puits gèle la nuit, je casse la glace le matin.`,
    `Les gens montent. Ils montent au vieux sanatorium des Mélèzes, celui qu’on a fermé quand j’étais petite. Il y a de la lumière là-haut maintenant, et une femme en blanc. Ceux qui ont mal montent la voir. Ils ne redescendent pas.`,
    `Je ne peux pas monter. Si je monte, plus personne ne garde le village. Si je reste, le village monte sans moi.`,
    `Je ne sais pas me battre contre une chose qui ne me frappe pas.`,
    `Viens si tu peux. La soupe est sur le feu.`,
    `Ysolde, de Haute-Brume. »`,
    { if: T3_KNOWN, t: `Vous revoyez la femme immense plantée au milieu du Pont-de-l’Est, la nuit de la horde, avec son bouclier haut comme une porte. Elle n’avait pas demandé d’aide, cette nuit-là. Elle vous avait dit de faire sortir les gens.` },
    { if: T3_NEW, t: `Vous ne connaissez pas cette femme. Mais Séraphine, qui lisait par-dessus votre épaule, a pâli d’un coup. « C’est elle qui nous a élevés, dit-elle. Abel et moi. Elle n’a jamais écrit une lettre de sa vie. Jamais. »` },
    { if: T3_KNOWN, t: `Séraphine, qui lisait par-dessus votre épaule, a pâli. « Elle n’a jamais écrit une lettre de sa vie, dit-elle. Jamais. Même quand on est partis, Abel et moi. »` }
  ], choices: [{ t: 'Partir vers le nord avec Séraphine', to: 'g1_2' }] },

  g1_2: { ch: 0, text: [
    `La route de Haute-Brume quitte la vallée par les vergers abandonnés, puis s’accroche à la montagne en lacets. Au troisième lacet, la pluie devient de la neige. Au cinquième, il fait nuit en plein après-midi. Au septième, vous ne sentez plus vos mains.`,
    `Séraphine marche devant. Elle connaît chaque pierre. Elle ne dit rien pendant des heures, puis, au détour d’un virage, elle s’arrête devant un rocher plat au bord du vide.`,
    `« Abel m’a appris à siffler ici, dit-elle. J’avais sept ans. Il m’a dit que si je savais siffler, je ne serais jamais perdue, parce qu’il m’entendrait toujours. » Elle met deux doigts dans sa bouche. Le sifflement part dans la vallée et se perd dans la neige. Personne ne répond. Elle reprend la marche.`,
    `Haute-Brume apparaît à la nuit tombée. Vingt-trois maisons serrées autour d’une chapelle et d’un puits, sur un replat entre deux falaises. La neige les recouvre jusqu’aux fenêtres. La plupart des fenêtres sont noires.`,
    `Vous les comptez. Neuf lumières.`,
    `Au milieu de la place, près du puits, une silhouette immense casse la glace à coups de masse. Elle se retourne en entendant vos pas dans la neige. Elle lève une lanterne.`,
    `Elle voit Séraphine. La masse lui tombe des mains.`,
    `Pendant un long moment, personne ne bouge. Puis Ysolde traverse la place en trois enjambées et serre Séraphine contre elle si fort que la duelliste disparaît tout entière dans son manteau.`,
    `« Tu as maigri, dit Ysolde.`,
    `— Tu as vieilli, dit Séraphine.`,
    `— C’est l’hiver. »`,
    `Elle vous regarde par-dessus la tête de Séraphine.`,
    { if: T3_KNOWN, t: `« Toi. Le pont. » Elle hoche la tête. « Tu es venu. Bien. Entrez. »` },
    { if: T3_NEW, t: `« C’est toi, le Joueur ? » Elle vous détaille de haut en bas, comme on évalue un cheval. « Tu es plus petit que je croyais. Ce n’est pas grave. Les grands, ça casse. Entrez. »` },
    `Dans la maison d’Ysolde, il fait chaud. Il y a un grand chaudron sur le feu. Il sent l’oignon, le lard et quelque chose de très ancien, comme une soupe qu’on aurait allongée chaque jour depuis des années sans jamais la finir.`,
    `« Elle est sur le feu depuis dix ans, dit Ysolde en vous servant. J’en rajoute chaque matin. Le fond, c’est encore celle du jour où Abel est parti. » Elle pose le bol devant Séraphine. « Mange. »`
  ], choices: [{ t: 'Demander ce qui se passe au col', to: 'g1_3' }] },

  g1_3: { ch: 0, text: [
    `Ysolde parle en remuant la soupe, sans vous regarder, comme si les mots étaient des légumes qu’on épluche.`,
    `Il y a deux ans, une femme est montée au sanatorium des Mélèzes. Personne ne l’a vue passer. Une nuit, il y a eu de la lumière là-haut, une lumière blanche, et le lendemain matin il neigeait en juin.`,
    `Au début, Ysolde l’a presque bénie. Les bêtes du col, celles qu’elle avait repoussées seule pendant trois ans, sont restées figées dans la glace, au milieu de leur saut. Pour la première fois depuis des années, elle a dormi une nuit entière.`,
    `« Je devrais la remercier, dit-elle. Elle a fait en un hiver ce que je n’ai pas réussi en trois ans. »`,
    `Puis les gens ont commencé à monter.`,
    `La veuve Fabre d’abord, après l’enterrement de son mari. Puis le petit Bouvier, quand son chien est mort. Puis les Maréchal, tous les deux, le soir de l’anniversaire de leur fille partie à Vespérane et jamais revenue. Ils montaient la nuit, pieds nus dans la neige, sans manteau, comme des somnambules. Ils ne redescendaient pas.`,
    `« Ceux qui ont mal, dit Ysolde. Seulement ceux qui ont mal. Elle ne prend que ceux-là. »`,
    `Elle pose la louche.`,
    `« Le vieil Anatole a enterré Jeanne il y a six jours. Cinquante et un ans de mariage. Il ne mange plus. Il regarde le col. » Elle se tourne vers la fenêtre. « Je crois que c’est cette nuit. »`,
    `Vous suivez son regard. Dans la nuit bleue, entre les maisons noires, une silhouette maigre traverse la place en direction du sentier du col. Pieds nus. En chemise.`
  ], choices: [
    { t: 'Le rattraper et l’arrêter de force', to: 'g1_4a', set: { anatole: 'forced' }, add: { dom: 1 } },
    { t: 'Le rattraper et marcher avec lui', to: 'g1_4b', set: { anatole: 'walked' }, add: { comp: 1 } },
    { t: 'Le laisser monter et le suivre de loin', to: 'g1_4c', set: { anatole: 'let' } }
  ] },

  g1_4a: { ch: 0, text: [
    `Vous le rattrapez au bas du sentier. Il ne vous voit pas venir. Vous le prenez par les épaules et vous le retournez vers le village.`,
    `Il ne crie pas. Il se débat, avec une force étonnante pour un homme de quatre-vingts ans, des coups de coude maladroits, des coups de pied dans la neige. Puis il s’effondre contre vous et il se met à pleurer, d’un pleur sec, sans larmes, comme une toux.`,
    `« Laisse-moi, dit-il. Laisse-moi ne plus sentir. Juste un peu. Je ne veux pas mourir. Je veux juste que ça s’arrête. »`,
    `Vous le ramenez chez lui de force. Ysolde l’enroule dans une couverture et s’assied devant sa porte, la masse sur les genoux.`,
    `Il ne vous adresse plus la parole. Au matin, il est toujours là. Il regarde le col.`
  ], choices: [{ t: 'Redescendre à Vespérane chercher des réponses', to: 'g2_1' }] },

  g1_4b: { ch: 0, archive: ['C06'], text: [
    `Vous le rattrapez au bas du sentier. Vous ne l’arrêtez pas. Vous ôtez votre manteau, vous le lui mettez sur les épaules, et vous marchez à côté de lui.`,
    `Il ne vous regarde pas. Il monte. Vous montez. La neige crisse. Au bout d’un moment, sans tourner la tête, il dit :`,
    `« Elle s’appelait Jeanne. »`,
    `Vous ne répondez pas. Vous continuez à marcher.`,
    `« Cinquante et un ans. Elle chantait faux. Elle ronflait. Elle mettait trop de sel dans tout. On s’est disputés pour des bêtises tous les jours pendant cinquante et un ans. » Il s’arrête pour reprendre son souffle. « Il y a six jours, elle s’est assise dans son fauteuil et elle n’a plus rien dit. »`,
    `Vous marchez encore. Il parle de la ferme, de la guerre, des enfants qui sont partis à la ville, du jour où Jeanne a jeté son fusil dans le puits parce qu’il voulait chasser le dimanche.`,
    `À mi-pente, il s’arrête de nouveau. Il regarde en haut, vers la lumière blanche du sanatorium. Puis il regarde en bas, vers sa maison, où il n’y a plus personne.`,
    `« Ce qui me fait peur, dit-il, ce n’est pas que ça fasse mal. C’est que ça arrête de faire mal. Si un jour ça ne fait plus mal, c’est que je l’aurai oubliée. »`,
    `Il reste longtemps immobile. Vous ne dites rien. Vous restez à côté de lui, les pieds dans la neige, sans manteau.`,
    `Puis il fait demi-tour.`,
    `Au village, il vous rend votre manteau sans un mot. Le lendemain matin, sur sa table, vous trouvez une lettre qu’il a écrite pendant la nuit. Elle n’est pas pour vous. Elle est pour Jeanne. Il l’a laissée là pour que quelqu’un la lise, parce qu’on n’écrit pas une lettre pour qu’elle reste dans un tiroir.`
  ], choices: [{ t: 'Redescendre à Vespérane chercher des réponses', to: 'g2_1' }] },

  g1_4c: { ch: 0, text: [
    `Vous le laissez monter. Vous le suivez à distance, dans ses traces. Il ne se retourne jamais.`,
    `En haut, au bout du sentier, les grilles du sanatorium sont ouvertes. Une lumière blanche sort des grandes baies vitrées. Une silhouette en blouse claire attend sur le perron. Elle tend la main au vieil homme. Il la prend.`,
    `Ils entrent ensemble. Les portes se referment.`,
    `Vous essayez de les suivre. Les grilles se sont refermées derrière eux, couvertes d’une glace si dure que vos coups n’y laissent qu’une rayure blanche. Une fenêtre bleue s’ouvre devant vous.`,
    { sys: 'Accès refusé.\nLe sanatorium n’admet que les personnes qui souffrent.\nVotre niveau de douleur : non mesurable.' },
    `Vous redescendez. Au village, Ysolde vous attend devant la maison d’Anatole. Elle a vu la lumière. Elle ne vous demande rien. Elle rentre éteindre la lampe à sa fenêtre.`,
    `Il reste huit lumières.`
  ], choices: [{ t: 'Redescendre à Vespérane chercher des réponses', to: 'g2_1' }] },

  /* ------------------------------ CHAPITRE II ------------------------------ */
  g2_1: { ch: 1, archive: ['C01'], text: [
    `Hélène connaît le nom avant que vous ayez fini de décrire la femme en blanc.`,
    `Elle ne dit rien. Elle se lève, va au fond des Archives, dans la réserve où personne ne descend, et revient avec un dossier épais, ficelé, sur lequel une étiquette jaunie porte deux mots : AFFAIRE VARGA.`,
    `« Ilse Varga, dit-elle. Infirmière à la Miséricorde pendant vingt ans. Elle s’occupait de l’aile Est. Des enfants. » Elle défait la ficelle avec des doigts qui ne tremblent pas tout à fait. « De la chambre 14. »`,
    `Elle ouvre le dossier. Le procès-verbal d’audience est en haut. Elle le pose devant vous et va se tenir à la fenêtre, le dos tourné.`,
    `Vous lisez.`,
    `Ilse Varga a été jugée un an après la Faille pour abandon de poste. Le jour du 14 mars, à 15 heures, quand la lumière est venue, elle n’était pas dans l’aile Est. Elle était dehors, sur le parvis. Elle a été retrouvée là par les secours, assise par terre, les mains en sang à force d’avoir frappé contre les portes.`,
    `À l’audience, elle a déclaré qu’un officier qu’elle ne connaissait pas était venu dans le couloir à 14 h 55, une liste à la main, et avait fait sortir tout le personnel de l’aile pour « un exercice d’évacuation ». Les patients devaient rester en chambre. Elle a obéi. Quand elle a voulu rentrer, les portes étaient barrées.`,
    `L’armée a déclaré qu’aucun exercice n’était prévu ce jour-là. Aucun autre membre du personnel de l’aile Est n’a survécu pour confirmer ou infirmer : ils étaient tous retournés à l’intérieur par une autre porte, avant le scellement, pour rester avec les enfants. Elle seule était restée dehors.`,
    `Puis viennent les témoins.`,
    `Une mère, Agnès Delorme, dont le fils Hugo, neuf ans, était dans la chambre 12 : « Elle nous avait promis qu’elle ne le quitterait pas. »`,
    `Et une autre.`,
    `« Mme Hélène Varenne, mère de la patiente de la chambre 14, déclare : “Ma fille me disait qu’Ilse était toujours là. Toujours. Ce jour-là, elle n’y était pas.” »`,
    `Verdict : coupable de négligence. Radiation. Un an de prison ferme.`,
    `Vous levez les yeux. Hélène n’a pas bougé de la fenêtre.`,
    `« Je voulais que quelqu’un soit coupable, dit-elle sans se retourner. Vous comprenez ? Si personne n’était coupable, alors c’était Dieu. Ou Elias. Ou moi, qui l’avais laissée là ce matin-là parce que j’avais une réunion. » Sa voix ne se brise pas. Elle est simplement très basse. « Ilse était là. Elle n’avait pas de nom important, pas de titre, personne pour la défendre. Elle était parfaite pour être coupable. »`
  ], choices: [
    { t: '« Venez avec nous à Haute-Brume. »', to: 'g2_2', set: { heleneCame: true } },
    { t: 'Ne rien dire et la laisser seule un moment', to: 'g2_2', set: { heleneCame: true, heleneAlone: true } }
  ] },

  g2_2: { ch: 1, text: [
    { if: [['heleneAlone', '==', true]], t: `Vous sortez sans un mot. Une heure plus tard, Hélène vous rejoint dans la cour de l’Association, en manteau, avec une petite valise et son registre sous le bras. « Je viens, dit-elle. Ce n’est pas à vous de m’emmener. C’est à moi d’y aller. »` },
    { if: [['heleneAlone', '!=', true]], t: `Hélène se retourne enfin. Elle vous regarde longtemps. « Oui, dit-elle. Oui. Je crois que ça fait neuf ans que j’attends que quelqu’un me le demande. »` },
    `Avant de partir, vous passez voir Frère Anselme au quartier des cendres. Vous lui montrez le procès-verbal. Vous lui montrez la phrase sur l’officier et la liste, à 14 h 55.`,
    `Il lit. Il relit. Son visage devient gris.`,
    `« Ce n’était pas moi, dit-il de sa voix cassée. Moi, je suis arrivé à 15 h 04, avec l’ordre de scellement. Il y avait une infirmière sur le parvis. Une seule. Elle a couru vers moi en disant que les enfants étaient à l’intérieur. Je l’ai fait écarter par deux soldats. Je me suis dit qu’elle avait fui et qu’elle avait des remords. Je l’ai méprisée pour ça. » Il repose la feuille. « Je ne me suis jamais demandé pourquoi elle était dehors. »`,
    `Il repose la feuille avec précaution, comme une chose qui pourrait exploser.`,
    `« Une liste, dit-il. Quelqu’un avait une liste à 14 h 55. Neuf minutes avant que l’ordre me parvienne. » Il ferme les yeux. « Qui savait ? »`,
    `Vous n’avez pas la réponse. Vous la notez quelque part, dans un coin de votre tête où vous rangez les choses qui reviendront.`,
    `Au moment de partir, Kaël vous attend à la porte de la ville, son sac sur l’épaule. Il a entendu parler de l’affaire. Ou plutôt, il a entendu le nom.`,
    `« Varga, dit-il. Je la connaissais. Enfin, celui que j’étais la connaissait. » Il se frotte le front, comme quand un souvenir revient. « Elle chantait en faisant les pansements. Des chansons idiotes, des chansons de marins. Elle disait que si on chante, la douleur ne sait plus où donner de la tête. » Il sourit, surpris de se souvenir. « Les petits l’adoraient. »`
  ], choices: [{ t: 'Repartir vers le nord, à quatre', to: 'g2_3' }] },

  g2_3: { ch: 1, text: [
    `Le retour vers Haute-Brume est plus long. Il neige plus bas qu’à l’aller : l’hiver est descendu de deux lacets en une semaine.`,
    `Hélène marche lentement. Elle n’est pas faite pour la montagne. Elle ne se plaint pas. Le soir, au refuge du quatrième lacet, pendant que Kaël fait du feu et que Séraphine aiguise son épée, elle sort son registre et l’ouvre à une page que vous n’avez jamais vue : une page blanche, au tout début, avant les 312.`,
    `Elle y écrit un nom. Ilse Varga.`,
    `« Elle n’est pas morte, dit-elle en sentant votre regard. Mais c’est moi qui l’ai mise dans la colonne des coupables. Il faut bien que je l’écrive quelque part ailleurs. »`,
    `Elle reste longtemps à regarder le nom, la plume suspendue.`,
    `« Vous savez ce qu’elle a dit, à la fin de l’audience ? Ce n’est pas dans le procès-verbal. Le greffier ne l’a pas noté. Elle s’est tournée vers moi et elle a dit : “Madame Varenne, elle avait presque fini sa chanson.” »`,
    `Hélène referme le registre.`,
    `« Je ne lui ai jamais demandé ce qu’elle voulait dire. »`,
    `Dehors, la neige tombe sans bruit. Quelque part au-dessus de vous, sur le col, une lumière blanche veille.`,
    { if: [['anatole', '==', 'walked']], t: `Le lendemain, quand vous traversez Haute-Brume, Anatole Bouvier est assis devant sa porte, emmitouflé. Il épluche des pommes de terre. Il vous fait un petit signe de la main, sans sourire. Il y a dix lumières, ce matin. Il a rallumé celle de Jeanne.` },
    { if: [['anatole', '==', 'forced']], t: `Le lendemain, quand vous traversez Haute-Brume, Ysolde vous attend au puits. « Anatole est monté cette nuit, dit-elle. J’ai dormi une heure. Une seule. » Elle ne vous reproche rien. Elle vous informe. Il reste huit lumières.` },
    { if: [['anatole', '==', 'let']], t: `Le lendemain, quand vous traversez Haute-Brume, vous passez devant la maison d’Anatole. La fenêtre est noire. Il reste huit lumières.` }
  ], choices: [{ t: 'Monter au sanatorium', to: 'g3_1' }] },

  /* ------------------------------ CHAPITRE III ------------------------------ */
  g3_1: { ch: 2, archive: ['C09'], text: [
    `Le sentier du col est une galerie de statues.`,
    `Ce sont les bêtes. Celles qu’Ysolde a combattues trois ans : des loups de montagne aux épaules de taureau, des choses à six pattes couvertes de plaques d’os, une wyverne entière, figée en plein vol au-dessus du sentier, les ailes déployées, la gueule ouverte sur un cri que personne n’entendra jamais. La glace les a prises au milieu du mouvement. Elles sont transparentes. On voit leurs cœurs arrêtés.`,
    `Ysolde marche entre elles sans les regarder. Elle les connaît toutes.`,
    `« Celle-là, je l’appelais Saint Jérôme. Elle m’a pris un doigt de pied. » Elle désigne une bête à crocs. « Celle-là, c’était Sainte Agathe. Je n’ai jamais réussi à la tuer. Elle revenait toujours. » Elle pose sa main gantée sur la glace. « Je leur donnais des noms de saints pour qu’elles aient honte. Ça n’a jamais marché. »`,
    `Une fenêtre bleue s’ouvre devant vous.`,
    { sys: 'Clé II détectée.\nEffet : anesthésie.\nPrincipe : suppression de la douleur par arrêt du mouvement.\nRemarque : tout ce qui ne bouge plus ne souffre plus.' },
    `Au-dessus de vous, la wyverne figée craque. Un long craquement, comme un lac qui se fend au printemps. Une aile bouge.`,
    `« L’hiver recule ici, dit Séraphine en dégainant. Elle étend son domaine vers la vallée, alors elle lâche le haut. » Elle lève les yeux vers la bête qui se dégage lentement de sa prison. « Et ce qu’elle lâche se réveille. »`
  ], choices: [{ t: 'Se mettre en garde', to: 'g3_2' }] },

  g3_2: { ch: 2, reward: 900, text: [
    `La wyverne tombe sur le sentier dans une pluie d’éclats de glace. Elle a faim. Elle a eu faim pendant deux ans, figée en plein saut, sans pouvoir bouger ni mourir.`
  ], combat: { name: 'Wyverne du col', power: 140, weak: 'agi', resist: 'str', foe: 'wyverne',
    win: `Elle est lourde, engourdie, furieuse. Vous jouez avec sa colère, vous la faites charger contre les statues de ses semblables, et la glace la blesse plus que vos coups. Quand elle s’effondre enfin au bord du vide, Ysolde s’approche et lui pose la main sur le museau. « Saint Michel, dit-elle. C’était la plus belle. »` },
  choices: [{ t: 'Continuer jusqu’au sanatorium', to: 'g3_3' }] },

  g3_3: { ch: 2, archive: ['C02'], text: [
    `Le sanatorium des Mélèzes est un long bâtiment blanc, posé sur la pente comme un paquebot échoué, avec des galeries vitrées à chaque étage où l’on installait autrefois les malades au soleil pour soigner leurs poumons.`,
    `Les grilles sont ouvertes.`,
    { if: [['anatole', '==', 'let']], t: `La dernière fois, elles s’étaient refermées devant vous. Aujourd’hui, elles sont grandes ouvertes. Hélène est avec vous. Hélène a mal. Le sanatorium l’a sentie.` },
    `Vous entrez dans la première galerie.`,
    `Il y a des lits. Des dizaines de lits de fer alignés le long des baies vitrées, face à la vallée, comme autrefois. Dans chaque lit, quelqu’un dort. Ils sont couverts d’une fine couche de glace transparente, comme un drap. Leurs visages sont paisibles. Certains sourient. Aucun ne respire.`,
    `Au pied de chaque lit, une fiche, accrochée à une pince, écrite d’une écriture d’infirmière, nette et ronde.`,
    `« Lit 4. Mme Fabre, Lucienne. Admise le 2 février. Douleur : veuvage. Intensité : 9/10. Traitement : repos. »`,
    `« Lit 11. Bouvier, Théo, 12 ans. Admis le 30 mai. Douleur : chien (Pacha). Intensité : 10/10. Traitement : repos. »`,
    `« Lit 17. M. et Mme Maréchal. Admis le 14 juillet. Douleur : fille partie. Intensité : 10/10 et 10/10. Traitement : repos, ensemble. »`,
    { if: [['anatole', '!=', 'walked']], t: `« Lit 23. Bouvier, Anatole. Admis il y a dix jours. Douleur : Jeanne. Intensité : hors échelle. Traitement : repos. » Le vieil homme sourit dans son lit de glace, les mains croisées sur la poitrine. Il a l’air d’attendre que quelqu’un vienne lui dire que le repas est servi.` },
    `Il y a plus de cent lits. Ils ne viennent pas tous de Haute-Brume. Il y a des gens des vallées, des gens de Vespérane. Des mères. Des soldats. Un vieux Chasseur dont la fiche dit : « Douleur : équipe perdue. »`,
    `Au bout de la galerie, une porte s’ouvre. Une femme sort, en blouse d’infirmière blanche, un plateau à la main. Elle a une cinquantaine d’années, des cheveux gris tirés en chignon, un visage doux et fatigué. Sa blouse est de givre. Ses mains sont de givre. Ses yeux sont d’un bleu si pâle qu’ils ont l’air vides.`,
    `Elle vous voit. Elle sourit. Un vrai sourire, professionnel et gentil.`,
    `« Bonsoir. Vous avez mal quelque part ? »`
  ], choices: [{ t: 'Ne pas répondre et la regarder', to: 'g3_4' }] },

  g3_4: { ch: 2, text: [
    `Elle pose son plateau. Elle s’approche d’Ysolde la première, comme une infirmière va d’abord au patient le plus lourd.`,
    `« Vous, dit-elle, vous avez mal partout. Depuis longtemps. Aux épaules, aux genoux, et là. » Elle effleure le plastron d’Ysolde, à l’endroit du cœur. « Un enfant ? Deux enfants. Un qui est parti. » Ysolde ne bouge pas. Ilse hoche la tête. « Je peux vous soulager. »`,
    `Elle passe à Séraphine. « Vous, c’est une colère. Ancienne. Bien entretenue. Elle vous tient chaud. Je peux vous l’enlever, mais vous aurez froid après. »`,
    `Elle passe à Kaël. Elle s’arrête. Elle fronce les sourcils, comme devant un dossier mal rempli.`,
    `« Vous, je vous connais. » Elle penche la tête. « Le brancardier. Celui qui faisait des grimaces dans l’ascenseur. » Sa voix ne tremble pas, mais quelque chose passe dans le bleu de ses yeux, très vite, comme un poisson sous la glace. « Vous êtes mort. Vous n’avez plus mal. C’est bien. »`,
    `Puis elle voit Hélène.`,
    `Elle reste immobile. Le plateau, sur la table derrière elle, se couvre de givre d’un seul coup.`,
    `« Madame Varenne. »`,
    `Hélène soutient son regard. « Ilse. »`,
    `« Vous avez témoigné. » Ce n’est pas un reproche. C’est une ligne sur une fiche. « Vous aviez mal. Vous aviez raison d’avoir mal. » Ilse s’approche et lève la main vers le visage d’Hélène, très doucement. « Je peux vous enlever ça aussi. Tout. Le témoignage, la petite, la chambre. Vous n’aurez plus jamais mal. »`,
    `Hélène ne recule pas. Elle ne répond pas non plus.`,
    `Ilse se tourne enfin vers vous. Elle vous regarde longtemps. Elle pose deux doigts glacés sur votre poitrine, comme on prend un pouls.`,
    `Elle fronce les sourcils.`,
    `« C’est étrange, dit-elle. Vous, vous n’avez mal nulle part. Pas pour vous. » Elle retire sa main. « Vous portez des choses pour les autres. Beaucoup de choses. Mais vous n’avez rien à vous. » Elle vous regarde avec une curiosité presque médicale. « Qui vous a fait comme ça ? »`
  ], choices: [{ t: '« Parlez-nous de la chambre 14. »', to: 'g4_1' }] },

  /* ------------------------------ CHAPITRE IV ------------------------------ */
  g4_1: { ch: 3, archive: ['C03'], text: [
    `Ilse vous conduit à son bureau, au bout de la galerie. C’est l’ancien bureau de l’infirmière-chef du sanatorium. Tout est rangé, étiqueté, propre. Il y a des boîtes de fiches classées par ordre alphabétique, une bouilloire qui ne chauffe plus, un crucifix au mur couvert de givre.`,
    `Sur le bureau, sous une plaque de glace, comme une relique sous verre, un petit carnet à spirale. La couverture est rose. Il y a un autocollant de chat dessus.`,
    `« Mon carnet de soins, dit Ilse. Aile Est. J’avais un carnet par enfant. C’est le seul que j’ai gardé. »`,
    `Elle passe la main au-dessus de la glace, et la glace fond, juste assez pour qu’on puisse prendre le carnet. Elle le tend à Hélène.`,
    `Hélène l’ouvre. Elle lit. Vous lisez par-dessus son épaule.`,
    `« Chambre 14. Lune V., 7 ans. 12 mars. Douleur : 2/10. Mange peu. Réclame son père. Joue la berceuse sur la table de chevet avec les doigts, pendant les soins. Dit qu’elle a presque fini. »`,
    `« 13 mars. Douleur : 1/10. A ri parce que le capitaine marche trop fort dans le couloir. Dit que la fin de la berceuse est “pour quand Papa sera plus triste”. Je lui ai dit qu’on disait “moins triste”. Elle m’a dit non, plus triste. Je n’ai pas compris. »`,
    `« 14 mars, 13 h 40. Douleur : 0/10. Très gaie. Elle m’a demandé d’appeler son père. Elle dit qu’elle l’a finie, qu’elle veut la lui jouer aujourd’hui, tout de suite, avant qu’il redevienne triste. Je lui ai dit : après les soins. »`,
    `C’est la dernière ligne.`,
    `Hélène referme le carnet. Elle le serre contre elle. Elle ne pleure pas. Elle ne peut pas. Ilse la regarde sans expression.`,
    `« Elle l’avait finie, dit Hélène. Elle avait fini la chanson. »`,
    `« Oui, dit Ilse.`,
    `— Pourquoi vous ne l’avez pas dit au procès ?`,
    `— Parce que ce n’était pas la question. »`
  ], choices: [{ t: '« Alors quelle était la question ? »', to: 'g4_2' }] },

  g4_2: { ch: 3, archive: ['C04'], text: [
    `Ilse s’assoit derrière son bureau. Elle croise les mains. Elle parle comme on fait une transmission de garde : précisément, dans l’ordre, sans un mot de trop.`,
    `« À 13 h 40, Lune m’a demandé d’appeler son père. Elle voulait lui jouer la fin de la chanson. Je lui ai dit : après les soins. J’avais six enfants à faire avant 15 heures. Je me suis dit : je l’appellerai à 15 heures, il viendra à 15 h 30, elle lui jouera sa chanson avant le goûter.`,
    `« À 14 h 55, un officier est venu dans le couloir avec une liste. Il a lu nos noms. Il a dit : exercice d’évacuation, personnel seulement, les patients restent en chambre, c’est la procédure. J’ai demandé si je pouvais finir mon soin. Il a dit non. Je suis sortie.`,
    `« À 15 h 04, les soldats ont posé la barre.`,
    `« À 15 h 11, un homme est arrivé en courant et il a frappé aux portes en criant : Lune. C’était son père. Personne ne l’avait appelé. Il était venu tout seul. Je ne sais pas comment il savait. »`,
    `Elle se tait. Ses mains de givre sont posées l’une sur l’autre, immobiles.`,
    `« Au procès, on m’a demandé si j’avais abandonné mon poste. J’ai dit non, on m’a fait sortir. C’était vrai. Personne ne m’a crue. » Elle penche la tête. « Mais ce n’était pas ma faute. Ma faute, c’est 13 h 40. Si j’avais appelé à 13 h 40, il serait venu à 14 h 10. Il l’aurait prise dans ses bras. Il aurait entendu la fin de la chanson. Peut-être qu’il l’aurait emmenée se promener, dehors, au soleil. Peut-être qu’elle aurait été sur le parvis avec moi, à 14 h 55. »`,
    `Elle ouvre un tiroir et en sort une feuille pliée, jaunie, qu’elle pose sur le bureau. Une note de service, tamponnée, avec une liste de noms. La sienne est cochée.`,
    `« Je l’ai ramassée par terre sur le parvis. L’officier l’avait laissée tomber. Je l’ai montrée au procès. Le juge a dit que c’était un faux. » Elle la pousse vers vous. « Gardez-la. Moi, je n’en ai plus besoin. Je n’ai plus mal. »`,
    `Elle dit cela, et à cet instant, pour la première fois, sa voix se fêle. Juste une fraction de seconde. Une fissure dans la glace.`
  ], choices: [
    { t: 'Se taire et laisser Hélène parler', to: 'g4_3a', set: { helene: 'spoke' }, add: { comp: 1 } },
    { t: '« Ce n’était pas votre faute, Ilse. Vous ne pouviez pas savoir. »', to: 'g4_3b', set: { helene: 'silent' } }
  ] },

  g4_3a: { ch: 3, text: [
    `Vous vous taisez. Le silence dure. Il dure si longtemps que Kaël commence à se balancer d’un pied sur l’autre et que Séraphine pose la main sur son bras pour l’arrêter.`,
    `Puis Hélène pose le carnet rose sur le bureau, entre elles deux. Elle se lève. Elle fait le tour du bureau. Et elle s’agenouille devant Ilse Varga, sur le carrelage glacé, sa longue jupe noire étalée autour d’elle.`,
    `« J’ai témoigné contre vous, dit-elle. J’ai dit que vous n’étiez pas là. Je savais que vous l’aimiez. Je savais que vous chantiez pendant les soins pour qu’elle n’ait pas peur. Je l’ai dit quand même. Parce que j’avais besoin que quelqu’un soit coupable, et que vous étiez la plus petite personne dans la salle. »`,
    `Ilse ne bouge pas.`,
    `« Je ne vous demande pas de me pardonner, continue Hélène. Je n’ai pas le droit de vous demander ça. Je voulais seulement vous dire que je sais. Que quelqu’un sait. Que vous n’avez pas abandonné ma fille. Et que vous lui avez donné ses derniers jours de joie. Elle riait à cause du capitaine. Elle a fini sa chanson. Elle était à 0 sur 10. » Sa voix se casse enfin. « Zéro sur dix, Ilse. C’est vous qui l’avez écrit. »`,
    `Le givre, sur la joue d’Ilse, se fend en une ligne fine, de l’œil jusqu’au menton.`,
    `Ce n’est pas une larme. Pas encore. C’est l’endroit où une larme passera.`,
    `Ilse se lève brusquement. Elle reprend son plateau. « Il est l’heure de la tournée », dit-elle d’une voix blanche. Et elle sort.`
  ], choices: [{ t: 'La suivre dans la galerie', to: 'g5_1' }] },

  g4_3b: { ch: 3, text: [
    `Vous le dites avec douceur. Vous le pensez. C’est vrai, après tout : elle ne pouvait pas savoir.`,
    `Ilse vous regarde. Et la fissure dans sa voix se referme. Vous voyez la glace repousser sur son visage, plus épaisse, comme un lac qui regèle après qu’on a cassé la surface.`,
    `« Ne m’enlevez pas ça, dit-elle très calmement. C’est tout ce qui me reste d’elle. »`,
    `Elle se lève, reprend son plateau, et sort pour sa tournée.`,
    `Hélène ne vous regarde pas. Elle reste assise, le carnet rose sur les genoux. Au bout d’un long moment, elle dit, sans reproche :`,
    `« On ne console pas quelqu’un en lui retirant sa faute. On le console en restant à côté pendant qu’il la porte. » Elle se lève. « Je ne l’ai pas fait non plus. J’aurais dû parler la première. »`
  ], choices: [{ t: 'Suivre Ilse dans la galerie', to: 'g5_1' }] }
};

/* ==========================================================================
   TOME III — « Le Cœur de givre » — chapitres 5 à 8, issues, archives
   ========================================================================== */

Object.assign(T3_NODES, {

  /* ------------------------------ CHAPITRE V ------------------------------ */
  g5_1: { ch: 4, text: [
    `Ilse fait sa tournée comme elle l’a faite pendant vingt ans à la Miséricorde : lentement, lit par lit, en commençant par le premier.`,
    `Elle remonte un drap de glace sur une épaule. Elle vérifie une fiche. Elle se penche sur un visage et murmure quelque chose qu’on n’entend pas. Elle ne touche jamais les dormeurs à mains nues : elle a toujours un linge de givre entre ses doigts et leur peau, comme on garde une compresse entre la plaie et le pansement.`,
    `Vous la suivez. Hélène marche derrière vous, le carnet rose serré contre sa poitrine.`,
    `Au lit numéro 1, tout au bout de la première galerie, face à la plus grande baie vitrée, Ilse s’arrête plus longtemps.`,
    `Une femme dort là. La quarantaine. Un visage dur, même dans le sommeil, avec deux plis profonds au coin de la bouche. Elle serre dans ses mains, sous la glace, un petit avion en bois peint en rouge.`,
    `La fiche dit : « Lit 1. Delorme, Agnès. Admise il y a deux ans. Douleur : Hugo. Intensité : hors échelle. Traitement : repos. »`,
    `Hélène s’arrête net.`,
    `« Agnès », souffle-t-elle.`,
    `Ilse arrange le drap de glace sur les épaules de la dormeuse avec un soin infini.`,
    `« Elle est montée il y a deux ans, dit-elle. À pied, depuis Vespérane. Trois jours de marche. Elle m’a reconnue sur le perron. Elle ne m’a pas demandé pardon. Elle m’a dit : je n’en peux plus. » Ilse lisse la fiche contre le montant du lit. « Je l’ai couchée tout de suite. Elle avait les pieds en sang. »`,
    `« Elle avait témoigné contre vous, dit Hélène.`,
    `— Elle avait mal », répond Ilse. Elle hausse légèrement les épaules, comme devant une évidence. « Ça n’a rien à voir. »`,
    `Elle passe au lit suivant. Hélène reste immobile devant le lit numéro 1, devant cette femme qui a dit à la même barre, le même jour, presque les mêmes mots qu’elle.`,
    `Vous regardez l’avion rouge dans les mains d’Agnès Delorme. La glace est fine, à cet endroit-là. Un coup de poing suffirait. Ou une main posée assez longtemps.`
  ], choices: [
    { t: 'Poser la main sur la glace et réveiller Agnès', to: 'g5_2a', set: { thaw: true }, add: { comp: 1 } },
    { t: 'La laisser dormir', to: 'g5_2b', set: { thaw: false } }
  ] },

  g5_2a: { ch: 4, archive: ['C08'], bond: { helene: 2 }, text: [
    `Vous posez la main à plat sur la glace, au-dessus de l’avion rouge.`,
    `Ilse se retourne d’un bloc. « Non. » Sa voix claque comme une vitre. « Si vous la réveillez, elle aura mal comme au premier jour. Pire. Deux ans de douleur d’un seul coup. Vous ne savez pas ce que vous faites. »`,
    `Vous ne retirez pas votre main. Hélène vient poser la sienne à côté. Puis Kaël, sans qu’on le lui demande, avec ses doigts d’ombre qui ne sentent pas le froid.`,
    `La glace fond lentement. Elle coule sur le matelas, goutte à goutte, avec un bruit de pluie d’avril. Les plis au coin de la bouche d’Agnès se creusent. Sa main se referme sur l’avion.`,
    `Elle ouvre les yeux.`,
    `Pendant une seconde, elle ne sait pas où elle est. Puis elle sait. Puis tout revient, d’un seul coup, comme Ilse l’avait dit, et elle crie. Un cri qui ne ressemble à rien de ce que vous avez entendu dans les Failles. Pas un cri de peur. Le cri d’une mère qui apprend à nouveau, pour la première fois, que son fils est mort.`,
    `« Hugo ! »`,
    `Personne ne lui dit de se calmer. Personne ne lui dit que ça va aller. Hélène s’assoit sur le bord du lit. Vous vous asseyez par terre. Ysolde, qui était restée à la porte de la galerie, vient s’asseoir de l’autre côté, et le lit de fer grince sous son poids.`,
    `Personne ne parle.`,
    `Agnès crie, puis pleure, puis se tait, puis recommence. Dehors, la nuit passe sur la vallée. Vous ne bougez pas. Vous ne savez pas quoi dire, alors vous ne dites rien, et c’est peut-être la seule chose juste que vous ayez faite depuis que vous êtes Joueur.`,
    `À l’aube, Agnès se tait pour de bon. Elle regarde l’avion rouge dans sa main. Elle dit, d’une voix éraillée :`,
    `« Il voulait être pilote. Il avait peur du vide. Il disait que dans un avion, ce n’est pas pareil, parce qu’on est assis. »`,
    `Hélène rit. Un petit rire mouillé. Agnès la regarde, la reconnaît, et ne dit rien. Puis elle tend la main, et Hélène la prend.`,
    `Au bout de la galerie, debout près de la baie vitrée, Ilse Varga a regardé toute la nuit sans bouger. Sur sa joue, la ligne fine dans le givre s’est allongée jusqu’au cou.`
  ], choices: [{ t: 'Rejoindre Ilse', to: 'g5_3' }] },

  g5_2b: { ch: 4, text: [
    `Vous retirez votre main. La glace reste intacte. Agnès dort, l’avion rouge contre la poitrine.`,
    `Ilse hoche la tête, satisfaite. « Vous êtes raisonnable, dit-elle. Ce n’est pas fréquent, chez les Chasseurs. »`,
    `Cette approbation vous glace plus que le sanatorium.`,
    `Hélène reste un long moment devant le lit, puis elle sort son registre et, sur la page blanche du début, sous le nom d’Ilse Varga, elle écrit un deuxième nom : Agnès Delorme. Elle ne dit pas pourquoi. Vous ne demandez pas.`
  ], choices: [{ t: 'Rejoindre Ilse', to: 'g5_3' }] },

  g5_3: { ch: 4, text: [
    `Ilse vous attend dans le grand réfectoire du sanatorium, une salle immense et vide, avec des tables couvertes de nappes de givre et des chaises alignées pour personne.`,
    `Elle a préparé des tasses. Il n’y a rien dedans. Elle vous les sert quand même, avec un geste d’hôtesse.`,
    `« Vous voyez, dit-elle. Ici, personne ne souffre. Je ne tue personne. Je ne prends rien. Je donne seulement du repos. Dites-moi ce qu’il y a de mal à ça. »`,
    `Séraphine fixe sa tasse vide. Elle n’a pas dit un mot depuis la galerie. Elle relève la tête.`,
    `« Est-ce que vous pouvez enlever seulement une partie ? demande-t-elle. Pas tout. Juste une personne. »`,
    `Ilse la regarde avec intérêt. « Votre frère.`,
    `— Je ne veux plus le haïr, dit Séraphine. Et je ne veux plus l’aimer non plus. Je veux que ça s’arrête. Qu’il devienne un nom comme un autre. »`,
    `Ilse tend la main par-dessus la table. Ses doigts de givre s’arrêtent à un centimètre du front de Séraphine.`,
    `C’est Ysolde qui bouge. Elle ne se lève pas. Elle pose simplement sa main énorme sur la table, entre elles deux, à plat, comme une barrière.`,
    `« Si tu gèles ça, dit-elle à Séraphine sans regarder Ilse, tu gèles aussi le rocher du septième lacet. Le jour où il t’a appris à siffler. Tu gèles les nuits où il te chantait la berceuse parce que tu avais peur du noir. On ne peut pas enlever la haine sans enlever ce qu’il y avait dessous. C’est le même morceau. »`,
    `Séraphine regarde la main d’Ysolde. Elle se met à trembler. Puis elle se lève, sans un mot, et sort dans la neige.`,
    `Par la baie vitrée, vous la voyez marcher jusqu’au bord du col, mettre deux doigts dans sa bouche, et siffler vers la vallée. Longtemps.`,
    `Ilse retire sa main. Elle se tourne vers vous.`,
    `« Et vous ? Vous portez tant de choses qui ne sont pas à vous. Une plaque de Chasseur. Une médaille. Des lettres. Des noms. Vous n’avez rien à vous, mais vous portez pour tout le monde. » Sa voix est douce, presque tendre. « Vous devez être si fatigué. Je pourrais vous en décharger. Un lit. Une nuit. Une seule. Rien de plus. »`,
    `Une fenêtre bleue s’ouvre devant vos yeux, sans que vous l’ayez appelée.`,
    { sys: 'Proposition de repos détectée.\nDurée : indéterminée.\nEffet : suppression de toute charge.\nAccepter ?' }
  ], choices: [
    { t: 'Accepter. Juste une nuit.', to: 'end_g_D' },
    { t: '« Non. Ce que je porte, je le porte. »', to: 'g6_1', add: { comp: 1 } }
  ] },

  /* ------------------------------ CHAPITRE VI ------------------------------ */
  g6_1: { ch: 5, archive: ['C05'], text: [
    `Le lendemain, l’hiver descend de trois lacets d’un coup.`,
    `Vous le voyez depuis le sanatorium : une ligne blanche qui glisse sur la montagne comme une marée, avale les vergers, les murets, les granges. Elle s’arrête à cinq cents mètres de Haute-Brume. Derrière elle, tout est immobile.`,
    `Et au-dessus du sanatorium, là où l’hiver a reculé pour descendre, les statues du col se fendent les unes après les autres. Les bêtes qu’Ysolde a combattues trois ans se réveillent, affamées, engourdies, furieuses.`,
    `Haute-Brume est prise entre les deux : le froid qui monte, et les bêtes qui descendent.`,
    `Ysolde ne dit rien. Elle descend au village. Vous la suivez. Elle entre chez elle, ouvre un coffre, et en sort un gros cahier à couverture de cuir, gondolé par l’humidité. Elle vous le tend sans un mot pendant qu’elle enfile son plastron.`,
    `C’est son livre de garde. Trois ans. Une ligne par nuit. Presque toutes les lignes disent la même chose : « Rien à signaler. Les fenêtres sont allumées. » Parfois : « Une bête. Repoussée. » Parfois : « Deux bêtes. Doigt de pied. » Une seule fois, au milieu de la deuxième année : « Abel est passé sur la route du bas. Il n’est pas monté. Il a regardé les fenêtres. Je n’ai pas crié. J’aurais dû crier. »`,
    `Ysolde serre la dernière boucle de son plastron.`,
    `« Pendant trois ans, personne ne m’a dit merci, dit-elle. Au début, ça me rongeait. Puis j’ai compris que je ne faisais pas ça pour le merci. Le soir, je comptais les fenêtres. C’était mon salaire. » Elle prend son bouclier. « Et puis l’autre est arrivée là-haut avec son hiver, et en une nuit, elle a fait ce que je n’avais pas réussi à faire. Et le lendemain matin, j’ai dormi, et je l’ai bénie. Et après, elle m’a pris mes fenêtres, une par une. »`,
    `Elle soupèse sa masse.`,
    `« Job a tout perdu et il n’a pas maudit. Moi, je n’ai rien perdu, et j’ai maudit souvent. Il m’a gardée quand même. » Elle vous regarde. « Je ne la remercierai pas. Mais je vais lui porter de la soupe. Après. »`,
    `« Après quoi ? »`,
    `Elle désigne le col, où les premières bêtes réveillées descendent dans la neige.`,
    `« Après ça. »`
  ], choices: [{ t: 'Tenir le col avec elle', to: 'g6_2' }] },

  g6_2: { ch: 5, reward: 1100, text: [
    `C’est comme au Pont-de-l’Est. Ou c’est comme les trois ans d’Ysolde, que vous n’avez pas vécus et que vous comprenez maintenant. Le même sentier, la même neige, la même femme immense plantée au milieu, et les bêtes qui viennent.`
  ], combat: { name: 'Les bêtes du col', power: 165, weak: 'end', resist: 'agi', foe: 'bete_col',
    win: `Vous tenez. Ysolde tient. Les bêtes viennent par vagues, engourdies par deux ans de glace, et se brisent sur le bouclier comme la mer sur une digue. Quand la dernière recule vers les hauteurs, Ysolde l’appelle par son nom de sainte, sainte Agathe, celle qui revenait toujours, et lui dit, presque tendrement : « Va. Reviens demain. Je serai là. »` },
  after: [
    `Le village est intact. Huit fenêtres, ou neuf, ou dix, selon les nuits. Ysolde les compte du haut du sentier, la masse sur l’épaule, le front en sang.`,
    `Puis elle rentre chez elle, décroche le chaudron de dix ans, l’enveloppe dans une couverture, le hisse sur son dos avec une corde, et repart vers le sanatorium.`
  ], choices: [{ t: 'Porter le chaudron avec elle', to: 'g6_3' }] },

  g6_3: { ch: 5, text: [
    `Dans le réfectoire vide, Ysolde pose le chaudron sur la table, défait la couverture, et la vapeur monte. La seule chaleur du bâtiment. Les nappes de givre se mettent à goutter autour.`,
    `Elle remplit un bol et le pose devant Ilse.`,
    `« Mange. »`,
    `Ilse regarde le bol. Elle le prend dans ses mains de givre. La soupe fume entre ses doigts sans les réchauffer.`,
    `« Je ne sens plus le chaud, dit-elle. Ni le froid. Ni rien. »`,
    `Ysolde tire une chaise et s’assoit en face d’elle.`,
    `« Alors je reste jusqu’à ce que tu le sentes. »`,
    `Elles restent ainsi longtemps. Ilse tient le bol. Ysolde la regarde. Hélène est assise au bout de la table, le carnet rose devant elle. Kaël s’est accroupi contre le mur. Séraphine est revenue du col, le visage gelé, et s’est assise à côté d’Ysolde sans rien dire, comme quand elle avait six ans.`,
    `Puis quelque chose se passe dans la galerie.`,
    `La vapeur de la soupe a coulé sous la porte. La chaleur du chaudron, la chaleur de six personnes dans une salle qui n’avait plus connu de corps vivants depuis deux ans, a fait reculer le givre de quelques centimètres. Et dans la galerie, au lit numéro 17, Mme Maréchal a bougé un doigt.`,
    `Ilse se lève d’un bond. Le bol se brise par terre.`,
    `« Non. » Elle court vers la galerie. « Non, non, non. Vous allez les réveiller. Ils vont avoir mal. Ils vont avoir mal comme moi ! »`,
    `Et à l’instant où elle dit « comme moi », la clé s’allume dans sa poitrine.`
  ], choices: [{ t: 'La suivre dans la galerie', to: 'g7_1' }] },

  /* ------------------------------ CHAPITRE VII ------------------------------ */
  g7_1: { ch: 6, reward: 1500, text: [
    `C’est une clé de fer bleuté, à deux dents, plantée dans le sternum d’Ilse comme une broche. Le froid en sort par vagues.`,
    `Les vitres de la galerie se couvrent de fougères de givre. Les lits se recouvrent d’une seconde couche de glace, plus épaisse, opaque. Le sanatorium tout entier gémit comme un bateau pris dans la banquise. Et dehors, la marée blanche se remet en marche vers Haute-Brume.`,
    `Ilse se tient au milieu de la galerie, les bras écartés devant les lits, comme une mère devant ses enfants.`,
    `« Je vais geler la vallée, dit-elle. Toute. Vespérane aussi. Plus personne n’aura jamais mal. Vous ne comprenez pas ? Plus jamais personne n’attendra un coup de téléphone qui ne vient pas. »`,
    `Sa voix se brise sur le dernier mot. Le givre gagne son visage, ses yeux, sa bouche. Elle devient ce que la clé a toujours voulu faire d’elle : une statue qui parle.`,
    { sys: 'Clé II : activation complète.\nPorteur : Ilse Varga.\nDésignation : Monarque des Glaces.' }
  ], combat: { name: 'Ilse Varga, Monarque des Glaces', power: 185, weak: 'end', resist: 'int', foe: 'm_glaces',
    win: `Elle ne frappe pas pour blesser. Elle frappe pour immobiliser, et chaque coup qui vous touche vous engourdit un peu plus, vous rend un peu plus léger, un peu moins soucieux. Vous tenez en pensant à ce qui fait mal : la plaque de Basile, la médaille, le carnet rose. Vous tenez parce que ça fait mal. Quand elle tombe à genoux au milieu de la galerie, la glace de son visage est fendue de partout, comme un pare-brise après un choc.` },
  after: [
    `Ilse est à genoux entre les lits. La clé palpite dans sa poitrine. Autour d’elle, le givre recule et avance par à-coups, comme une respiration.`,
    `Ysolde s’approche. Elle a ôté son manteau, le grand manteau de laine grise rapiécé aux coudes qu’elle porte depuis vingt ans. Elle le tient à deux mains.`,
    `Elle vous regarde. Elle attend votre signe.`
  ], choices: [
    { t: 'Faire signe à Ysolde', to: 'g7_2', branch: [{ req: [['helene', '!=', 'spoke']], to: 'end_g_C' }] },
    { t: 'Briser le cœur de glace', to: 'end_g_B', add: { dom: 1 } }
  ] },

  g7_2: { ch: 6, text: [
    `Ysolde pose le manteau sur les épaules d’Ilse.`,
    `C’est un geste très simple. Un geste de grand-mère, de sœur, de voisine qui passe un soir d’hiver. Le manteau est lourd, usé, il sent le feu de bois et la soupe et dix ans de garde.`,
    `Ilse ne bouge pas. Puis ses épaules se mettent à trembler.`,
    `La glace se fend. Pas d’un coup : de partout à la fois, en mille lignes fines, comme un lac au premier jour du printemps. Et par les fentes, quelque chose coule. De l’eau. De l’eau tiède.`,
    `Ilse Varga pleure.`,
    `Elle pleure pour la première fois depuis neuf ans, et elle a honte. Elle cache son visage dans ses mains. « Pardon, dit-elle. Pardon, pardon, je ne devrais pas, je suis l’infirmière, ce n’est pas moi qui… »`,
    `Ysolde s’assoit par terre à côté d’elle et lui passe un bras autour des épaules.`,
    `« Avoir mal, c’est la preuve qu’on n’est pas mort, dit-elle. C’est cher, mais c’est la preuve. »`,
    `Hélène s’agenouille de l’autre côté. Elle pose le carnet rose sur les genoux d’Ilse. Elle ne dit rien. Elle n’a plus besoin de rien dire : elle l’a déjà dit, dans le bureau.`,
    `Ilse pleure pour Lune. Pour l’appel qu’elle n’a pas passé. Pour Agnès, et Hugo, et les cent dix-sept lits. Pour elle-même, qui ne s’était plus autorisée à se plaindre depuis le tribunal.`,
    `Et puis, de l’autre bout de la galerie, une voix s’élève. Une voix de jeune homme, un peu fausse, qui chante une chanson idiote, une chanson de marins, avec un refrain qui parle d’une baleine qui avait mal aux dents.`,
    `C’est Kaël. Il ne sait pas pourquoi il connaît cette chanson. Il la chante quand même.`,
    `Ilse relève la tête. Elle le regarde, à travers ses larmes. Et elle rit. Un rire cassé, mouillé, absurde.`,
    `« C’est la chanson des pansements, dit-elle. Elle ne sert à rien. Elle sert seulement à ce que la douleur ne sache plus où donner de la tête. »`,
    `La clé se détache de sa poitrine et tombe sur le carrelage avec un petit bruit de verre.`,
    { sys: 'Clé II : libérée.\nPorteur : aucun.\nEffet d’anesthésie : interrompu.\nAvertissement : réveil de 117 patients en cours.' }
  ], choices: [{ t: 'Aider Ilse à se relever', to: 'g8_1' }] },

  /* ------------------------------ CHAPITRE VIII ------------------------------ */
  g8_1: { ch: 7, archive: ['C10'], text: [
    `Ilse refuse qu’on l’aide.`,
    `« C’est moi qui les ai endormis, dit-elle en s’essuyant les yeux avec la manche du manteau d’Ysolde. C’est moi qui les réveille. Un par un. »`,
    `Elle remet sa coiffe d’infirmière, qui n’est plus de givre mais de simple coton blanc, un peu froissé. Elle prend une chaise. Elle la porte jusqu’au lit numéro 1.`,
    { if: [['thaw', '==', true]], t: `Agnès Delorme est déjà réveillée, assise sur son lit, l’avion rouge sur les genoux. Elle regarde Ilse s’asseoir à côté d’elle. Elle ne dit rien. Puis elle se lève et va chercher une deuxième chaise. Elle la porte jusqu’au lit numéro 2. « Je sais ce que ça fait, dit-elle. Je vais m’asseoir avec eux. »` },
    { if: [['thaw', '!=', true]], t: `Agnès Delorme se réveille la première. Elle crie, comme Ilse l’avait prédit. Ilse ne lui dit pas de se calmer. Elle lui prend la main et reste assise. Au matin, Agnès la reconnaît enfin. « Vous êtes là », dit-elle. Et Ilse répond : « Oui. Cette fois, je suis là. »` },
    `Il faut neuf jours.`,
    `Neuf jours pour réveiller cent dix-sept personnes. Ilse ne dort presque pas. Elle va de lit en lit, elle pose la main, la glace fond, la personne se réveille, et la douleur revient, intacte, et Ilse reste. Elle reste une heure, une nuit, deux jours s’il le faut. Elle ne dit pas que ça va passer. Elle ne dit pas que c’est la volonté de Dieu. Elle tient une main. Elle chante la chanson de la baleine qui a mal aux dents.`,
    `Ysolde fait la soupe. Le chaudron de dix ans ne désemplit pas. Séraphine coupe du bois. Hélène note, dans son registre, chaque nom qui se réveille, avec une phrase. « Lucienne Fabre. Son mari ronflait comme un tracteur, elle le regrette. » « Théo Bouvier, 12 ans. Va adopter un autre chien, mais pas tout de suite. » « Les Maréchal. Vont écrire à leur fille. »`,
    { if: [['anatole', '!=', 'walked']], t: `Au lit numéro 23, quand la glace fond, le vieil Anatole ouvre les yeux et dit un seul mot : « Jeanne. » Puis il pleure, et puis il rit, parce qu’il se souvient qu’elle mettait trop de sel dans tout. « Elle est toujours là, dit-il, émerveillé. Ça fait toujours mal. Elle est toujours là. »` },
    { if: [['anatole', '==', 'walked']], t: `Anatole Bouvier monte au sanatorium le troisième jour. De lui-même, à pied, avec un manteau cette fois. Il a appris pour les réveils. Il s’assoit à côté du lit d’un vieux Chasseur dont la fiche dit « équipe perdue », et quand l’homme ouvre les yeux, Anatole lui dit : « Moi, c’est Jeanne. Toi, c’est qui ? » Et ils parlent toute la nuit.` },
    `Le neuvième soir, quand le dernier lit est vide, Ilse s’assoit sur les marches du perron, son manteau emprunté sur les épaules, et regarde la vallée. La marée blanche a reculé. Les vergers réapparaissent, noirs et mouillés. Il pleut. C’est la première pluie à Haute-Brume depuis deux ans.`,
    `Kaël s’assoit à côté d’elle.`,
    `« Vous vous souvenez de moi ? » demande-t-il.`,
    `Elle le regarde longtemps.`,
    `« Tu faisais des grimaces dans l’ascenseur. Tu étais toujours en retard. Tu volais les biscuits de la salle de garde pour les donner aux petits. » Elle sourit. « La petite de la chambre 14 t’appelait le monsieur élastique. »`,
    `Kaël rit. Il ne s’en souvenait pas. Maintenant, si.`
  ], choices: [{ t: 'Ramasser la clé II', to: 'g8_2' }] },

  g8_2: { ch: 7, text: [
    `La clé II est restée sur le carrelage de la galerie, au milieu d’une flaque. Elle est tiède, maintenant. Une clé de fer bleuté, à deux dents.`,
    `Quand vous la prenez, vous entendez, très loin, la voix de tous ceux que vous aimez qui vous dit : repose-toi. Tu as le droit. Arrête d’avoir mal.`,
    `Vous fermez la main. La voix se tait. Elle reviendra. Ce n’est pas grave.`
  ], choices: [
    { t: 'La rapporter à Théo', to: 'g8_3', set: { key: 'theo' } },
    { t: 'La confier à Zacharie et au fleuve', to: 'g8_3', set: { key: 'river' } },
    { t: 'La garder sur vous', to: 'g8_3', set: { key: 'kept' } }
  ] },

  g8_3: { ch: 7, bond: { ysolde: 3, helene: 1 }, text: [
    { if: [['key', '==', 'theo'], ['II.key', '==', 'theo']], t: `Rue des Cloches, Théo ouvre la boîte en fer. Il y a déjà la clé I, couchée dans son feutre. Il pose la clé II à côté. Il les regarde un moment. « Deux », dit-il. Puis, après un silence : « Elle était infirmière, celle-là, non ? Elle m’avait soigné la main, après le Cœur. Elle chantait une chanson idiote. » Il referme la boîte doucement. « Sept. Il en reste sept. »` },
    { if: [['key', '==', 'theo'], ['II.key', '!=', 'theo']], t: `Rue des Cloches, Théo ouvre la boîte en fer aux neuf emplacements. Il pose la clé II dans le feutre. « Une, dit-il. Ou deux, si on compte celle qui dort au fond du fleuve ou dans ta poche. » Il grogne. « Elle était infirmière, celle-là, non ? Elle m’avait soigné la main, après le Cœur. Elle chantait une chanson idiote. »` },
    { if: [['key', '==', 'river']], t: `Zacharie prend la clé II et la regarde longtemps avant de la laisser tomber dans l’eau. « Celle-là ne voulait de mal à personne, dit-il. C’est les pires. »` },
    { if: [['key', '==', 'kept']], t: `Vous glissez la clé II dans votre poche, à côté du reste. Il y a des nuits où elle vous propose le sommeil. Vous dites non. Vous dormez quand même, mal, mais à vous.` },
    `Le dernier soir avant votre départ, vous êtes sur la place de Haute-Brume avec Ysolde. Il fait nuit. Il ne neige plus.`,
    `Elle compte les fenêtres à voix haute, comme pendant trois ans, avec le doigt.`,
    `« … vingt et un, vingt-deux. » Elle s’arrête. La maison au bout de la place, celle avec le volet vert, est noire. La sienne.`,
    `« Vingt-deux, dit-elle. La mienne ne compte pas, je suis dehors. » Puis elle se reprend : « Si. Vingt-trois. Ilse dort chez moi. Elle a allumé. »`,
    `Elle reste un moment immobile devant les vingt-trois fenêtres allumées. Puis elle dit, très bas, comme on dit une prière dont on a oublié la fin :`,
    `« C’est mon salaire. »`,
    `Séraphine est assise sur la margelle du puits. Elle met deux doigts dans sa bouche et siffle vers la vallée, comme chaque soir depuis votre arrivée.`,
    `Cette fois, très loin, au fond de la vallée noire, quelqu’un siffle en retour.`,
    `Séraphine se fige. Ysolde aussi. Personne ne dit le nom. Le sifflement ne recommence pas.`,
    `Mais Séraphine reste assise sur le puits jusqu’à l’aube, et quand vous partez le matin, elle a sur le visage quelque chose que vous ne lui aviez jamais vu. Pas de la paix. Le début de quelque chose qui pourrait, un jour, y ressembler.`
  ], choices: [{ t: 'Redescendre vers Vespérane', to: 'end_g_A' }] },

  /* ------------------------------ ISSUES ------------------------------ */
  end_g_A: { ch: 7, ending: 'A', text: [
    `Le sanatorium des Mélèzes a fermé ses portes pour de bon. Ilse Varga est restée à Haute-Brume. Elle a ouvert une infirmerie dans l’ancienne école, avec trois lits, une bouilloire qui marche et un crucifix sans givre.`,
    `Elle soigne les engelures, les fièvres, les doigts de pied qu’Ysolde perd de temps en temps contre une bête. Elle chante en faisant les pansements. Les enfants du village connaissent tous la chanson de la baleine.`,
    `Le premier mardi de chaque mois, Agnès Delorme monte de Vespérane et passe la journée avec elle. Elles ne parlent pas beaucoup. Elles plient des compresses.`,
    `Hélène a ajouté une colonne à son registre, au début, avant les 312. Elle l’a intitulée « Ceux qu’on a accusés ». Il y a un nom dedans, puis une ligne : « Innocente. Elle avait presque fini sa chanson. Elle était à 0 sur 10. »`,
    `Il y a toujours de la douleur à Haute-Brume. Anatole pleure Jeanne chaque soir, et chaque matin il se lève et met trop de sel dans sa soupe, exprès. Les Maréchal attendent une lettre de leur fille. Le petit Théo Bouvier n’a pas encore pris de chien.`,
    `Mais il pleut, maintenant, quand il doit pleuvoir. Et il neige en hiver, seulement en hiver.`,
    `Le Système enregistre l’événement à sa manière.`,
    { sys: 'Monarque des Glaces : neutralisé.\nClé II : sans porteur.\nPatients réveillés : 117.\nDouleur moyenne mesurée : en hausse.\nRemarque : le Joueur considère ce résultat comme un succès. Incohérence non résolue.' },
    `Vous fermez la fenêtre. Vous avez froid aux mains. Vous les mettez dans vos poches, à côté de la plaque, de la médaille, des lettres et des clés. Ça pèse. C’est à vous.`
  ] },

  end_g_B: { ch: 6, ending: 'B', text: [
    `Vous frappez la clé dans la poitrine d’Ilse. Une fois. De toutes vos forces.`,
    `Le cœur de glace se brise comme un vitrail. Ilse Varga n’a pas le temps de dire un mot. Elle tombe en mille éclats bleus sur le carrelage de la galerie, et la clé II roule jusqu’à vos pieds.`,
    `Puis le sanatorium se réveille. D’un seul coup.`,
    `Cent dix-sept personnes ouvrent les yeux en même temps, et en même temps, deux ans de douleur gelée leur reviennent dans la poitrine. Personne n’est là pour leur tenir la main. Ysolde court d’un lit à l’autre. Hélène aussi. Ce n’est pas assez. Ce n’est jamais assez, avec cent dix-sept.`,
    `Certains ne s’en remettent pas. Le cœur du vieil Anatole lâche au milieu de la nuit, en disant le nom de Jeanne. D’autres repartent dans la vallée sans un mot, et on ne les revoit jamais.`,
    `L’hiver s’en va de Haute-Brume. Les bêtes du col reviennent. Ysolde reprend sa garde, seule, comme avant.`,
    `Elle ne vous reproche rien. Elle a seulement dit, en ramassant les éclats d’Ilse dans un linge pour les enterrer : « Elle ne voulait de mal à personne. C’est nous qui n’avions pas le temps. »`,
    `Vous aviez débarrassé la montagne d’un Monarque. Vous aviez oublié qu’on ne guérit pas quelqu’un en brisant la seule chose qui le tenait encore debout.`
  ] },

  end_g_C: { ch: 6, ending: 'C', text: [
    `Ysolde pose le manteau sur les épaules d’Ilse.`,
    `Ilse le regarde. Elle le touche. Elle ne pleure pas. Quelque chose manque, quelque part, une phrase qui n’a pas été dite dans le bureau de l’infirmière-chef, une main qui ne s’est pas tendue au bon moment. La glace se fend, mais elle ne coule pas.`,
    `« Je ne peux pas, dit Ilse. Je ne sais plus comment on fait. »`,
    `Elle se lève, le manteau d’Ysolde sur les épaules, et elle sort dans la neige. Elle monte vers le sommet du col, au-delà du sanatorium, là où il n’y a plus de sentier.`,
    `Le lendemain, il y a une nouvelle statue sur la crête. Une femme en blouse blanche, avec un manteau gris rapiécé aux coudes, assise sur un rocher, face à la vallée. La clé II brille dans sa poitrine comme une étoile froide.`,
    `L’hiver cesse de descendre. Il ne remonte pas non plus. Les lits du sanatorium restent gelés. Haute-Brume garde ses neuf fenêtres.`,
    `Ysolde a repris sa garde. Plus pour les bêtes : pour la statue. Chaque soir, elle monte au sommet du col avec un bol de soupe qu’elle pose aux pieds d’Ilse, et chaque matin elle redescend le bol, plein, gelé. Elle dit qu’elle continuera jusqu’à ce que le bol soit vide.`,
    `On lui demande ce qu’elle attend. Elle répond qu’elle n’attend rien. Elle veille.`
  ] },

  end_g_D: { ch: 4, ending: 'D', text: [
    `Vous dites oui.`,
    `Ilse vous prend la main. Ses doigts sont froids et doux. Elle vous conduit jusqu’à un lit vide, au bout de la deuxième galerie, face à la vallée. Elle vous aide à vous allonger. Elle remonte le drap.`,
    `« Juste une nuit », dit-elle. Elle le pense vraiment.`,
    `Le froid entre par les pieds. Il ne fait pas mal. C’est même agréable, comme une main fraîche sur un front de fièvre. Il monte. La plaque de Basile, dans votre poche, cesse de peser. La médaille aussi. Les noms du registre s’effacent un par un. Les lettres. Les clés. Tout ce que vous portiez glisse de vos épaules comme un sac trop lourd qu’on pose enfin.`,
    `Vous n’avez plus mal nulle part. Vous n’avez plus rien à vous, et maintenant, plus rien à personne.`,
    `Au pied de votre lit, Ilse accroche une fiche, de son écriture nette et ronde.`,
    `« Lit 118. Le Joueur. Douleur : celle des autres. Intensité : non mesurable. Traitement : repos. »`,
    `Hélène pleure à côté du lit. Vous ne la voyez pas. Ysolde tient le col, seule. Les Failles s’ouvrent, dans la vallée, et personne ne vient. Personne ne descend chercher les Chasseurs de rang E abandonnés dans le noir.`,
    `Il paraît que le Maître de ce monde a pleuré, un jour, devant la tombe d’un ami. Il n’a pas demandé qu’on lui enlève ça. Vous, vous avez dormi.`
  ] }
});

/* ---------- Archives du Tome III (préfixe C) ---------- */
Object.assign(ARCHIVES, {
  C01: { t: 'Procès-verbal d’audience — affaire Varga', body: `Tribunal de Vespérane, An 1.\nPrévenue : Ilse Varga, infirmière, aile Est, Hôpital de la Miséricorde.\nChef d’accusation : abandon de poste ayant entraîné la mort de patients mineurs.\n\nDéclaration de la prévenue : « À 14 h 55, un officier est venu avec une liste. Il nous a fait sortir pour un exercice. »\nDéclaration de l’autorité militaire : « Aucun exercice n’était prévu. »\nTémoin A. Delorme : « Elle nous avait promis qu’elle ne le quitterait pas. »\nTémoin H. Varenne : « Ma fille me disait qu’Ilse était toujours là. Ce jour-là, elle n’y était pas. »\n\nVerdict : coupable. Radiation. Un an de prison ferme.` },
  C02: { t: 'Fiches d’admission des Mélèzes', body: `Lit 4 — Fabre, Lucienne. Douleur : veuvage. 9/10. Traitement : repos.\nLit 11 — Bouvier, Théo, 12 ans. Douleur : chien (Pacha). 10/10. Traitement : repos.\nLit 17 — Maréchal, M. et Mme. Douleur : fille partie. 10/10 et 10/10. Traitement : repos, ensemble.\nLit 42 — [illisible], Chasseur de rang D. Douleur : équipe perdue. 10/10. Traitement : repos.\nLit 88 — [vide]. Gardé pour quelqu’un.\n\nNote de l’infirmière-chef : « Personne ici n’a mal. »` },
  C03: { t: 'Carnet de soins — chambre 14', body: `Couverture rose, autocollant de chat.\n\n12 mars. Douleur : 2/10. Mange peu. Réclame son père. Joue la berceuse sur la table de chevet avec les doigts, pendant les soins. Dit qu’elle a presque fini.\n13 mars. Douleur : 1/10. A ri parce que le capitaine marche trop fort. Dit que la fin est « pour quand Papa sera plus triste ». Je lui ai dit qu’on disait « moins ». Elle a dit non, plus.\n14 mars, 13 h 40. Douleur : 0/10. Très gaie. Elle l’a finie. Elle veut que j’appelle son père. Je lui ai dit : après les soins.` },
  C04: { t: 'Note de service — 14 mars, 14 h 50', body: `ASSOCIATION DES CHASSEURS — DIRECTION DES OPÉRATIONS\nObjet : aile Est, Hôpital de la Miséricorde.\nPersonnel soignant : exercice d’évacuation immédiat. Patients : maintenir en chambre.\nListe nominative jointe (14 noms). [Le nom d’I. Varga est coché.]\nRéférence du modèle : Y.O. / M-4.\nSignature : illisible.\n\n[Déclarée « faux manifeste » par le tribunal, An 1.]` },
  C05: { t: 'Livre de garde de Haute-Brume', body: `An 2, nuit 1 : Rien à signaler. Les fenêtres sont allumées.\nAn 2, nuit 46 : Une bête. Repoussée.\nAn 2, nuit 211 : Deux bêtes. Doigt de pied.\nAn 3, nuit 140 : Abel est passé sur la route du bas. Il n’est pas monté. Il a regardé les fenêtres. Je n’ai pas crié. J’aurais dû crier.\nAn 4, nuit 365 : Rien à signaler. Les fenêtres sont allumées. Personne n’a dit merci. Ça ne fait rien.\nAn 5, nuit 1 : La relève n’est pas venue. Je reste.` },
  C06: { t: 'Lettre d’Anatole à Jeanne', body: `Jeanne,\nj’ai failli monter là-haut cette nuit. Un jeune m’a accompagné sans rien dire, sans manteau, l’idiot. Il ne m’a pas arrêté. Il a marché avec moi. Alors j’ai réfléchi.\nSi ça arrête de faire mal, c’est que je t’aurai oubliée. Je préfère avoir mal.\nJ’ai mis trop de sel dans la soupe ce soir. Exprès.\nTon vieux.` },
  C07: { t: 'Lettre d’Ysolde au Joueur', body: `Joueur,\nje ne demande jamais rien à personne. Mais bientôt il n’y aura plus personne à qui ne rien demander.\nIl y avait vingt-trois maisons. Il y en a neuf avec la fenêtre allumée. Les gens montent au sanatorium. Ils ne redescendent pas.\nJe ne sais pas me battre contre une chose qui ne me frappe pas.\nViens si tu peux. La soupe est sur le feu.\nYsolde, de Haute-Brume.` },
  C08: { t: 'Ce qu’Agnès a dit en se réveillant', body: `Transcription d’Hélène Varenne, à l’aube :\n« Il voulait être pilote. Il avait peur du vide. Il disait que dans un avion, ce n’est pas pareil, parce qu’on est assis. »\n\nPuis, plus tard, à Ilse Varga :\n« Vous êtes là. »\nRéponse : « Oui. »` },
  C09: { t: 'Relevé du Système — clé II', body: `Objet : clé II (porteur : I. Varga).\nEffet : anesthésie.\nPrincipe : suppression de la douleur par arrêt du mouvement.\nRemarque : tout ce qui ne bouge plus ne souffre plus.\nRemarque complémentaire : tout ce qui ne souffre plus ne guérit plus.` },
  C10: { t: 'La chanson des pansements', body: `Chantée par I. Varga, aile Est, de mémoire de K. Mendes :\n\n« La baleine avait mal aux dents,\nelle pleurait dans l’océan,\nle capitaine a dit : “Tant pis,\non va chanter jusqu’à midi !” »\n\n(Il n’y a pas de deuxième couplet. On recommence jusqu’à ce que le pansement soit fini.)` }
});

const T4_CHAPTERS = [
  { n: 0, title: 'Chapitre I — La craie', level: 18, start: 'd1_1', verse: 'Ce ne sont pas ceux qui se portent bien qui ont besoin de médecin, mais les malades.', ref: 'Matthieu 9:12' },
  { n: 1, title: 'Chapitre II — La barrière', level: 19, start: 'd2_1', verse: 'J’étais nu, et vous m’avez vêtu ; j’étais malade, et vous m’avez visité ; j’étais en prison, et vous êtes venus vers moi.', ref: 'Matthieu 25:36' },
  { n: 2, title: 'Chapitre III — L’Hospice blanc', level: 20, start: 'd3_1', verse: 'L’Éternel ne considère pas ce que l’homme considère ; l’homme regarde à ce qui frappe les yeux, mais l’Éternel regarde au cœur.', ref: '1 Samuel 16:7' },
