const T2_NODES = {

  /* ------------------------------ CHAPITRE I ------------------------------ */
  b1_1: { ch: 0, archive: [], text: [
    `Vous avez gardé la plaque.`,
    `Elle est dans la poche intérieure de votre manteau depuis la nuit de la gare. Un rectangle d’acier cabossé, percé d’un trou pour la chaîne, gravé à la machine : BASILE TERNAUX — RANG E. Vous l’avez sortie souvent. Vous ne l’avez jamais rendue. Il y a des objets qu’on garde parce qu’on ne sait pas à qui ils appartiennent, et d’autres parce qu’on le sait trop bien.`,
    `Dans le registre d’Hélène, sous le nom de Basile, il y a une adresse écrite d’une encre plus récente : « Marthe Ternaux, quai des Pêcheurs, n° 7. Un fils, Paul. » Hélène a ajouté au crayon, en marge : « Personne n’est allé la voir. »`,
    `Le quartier des Pêcheurs longe le fleuve, en contrebas de la cathédrale. Avant les Failles, on y vendait des anguilles et des brochets le matin, on y réparait les coques l’après-midi, on y buvait le soir. Aujourd’hui, l’eau est grise et sent le métal. Les pêcheurs qui restent descendent quand même, par habitude, comme on va à la messe quand on ne croit plus tout à fait.`,
    `Le numéro 7 est une maison étroite, collée à la digue. Devant la porte, une femme d’une quarantaine d’années est assise sur un tabouret bas, un filet sur les genoux. Elle répare les mailles une à une avec une navette en bois. Ses doigts vont vite. Son visage ne bouge pas.`,
    `À côté de la maison, il y a un anneau de fer scellé dans la pierre du quai, et une corde coupée qui pend dans l’eau. Il n’y a pas de barque au bout.`,
    `Elle lève les yeux vers vous. Elle voit votre manteau de Chasseur. Elle ne demande rien. Elle attend que vous parliez, comme on attend la suite d’une phrase qu’on connaît déjà.`
  ], choices: [
    { t: 'Lui tendre la plaque sans rien dire', to: 'b1_2', set: { first: 'silence' } },
    { t: '« Je m’appelle… J’étais avec lui, à la fin. »', to: 'b1_2', set: { first: 'words' } }
  ] },

  b1_2: { ch: 0, archive: ['B06'], text: [
    { if: [['first', '==', 'silence']], t: `Vous lui tendez la plaque. Elle la regarde un long moment sans la prendre, comme si le métal pouvait encore la mordre. Puis elle pose le filet, essuie ses mains sur son tablier, et la prend à deux mains.` },
    { if: [['first', '==', 'words']], t: `Les mots sortent mal. Elle vous laisse finir. Puis elle tend la main, paume ouverte, sans un mot, et vous comprenez qu’elle attend la plaque. Vous la posez dans sa main. Elle referme les doigts dessus.` },
    `« L’Association m’a envoyé un papier, dit-elle. “Disparu. Aucune recherche engagée.” Trois lignes. Ils ont mal écrit Ternaux. Avec un h. »`,
    `Elle passe le pouce sur les lettres gravées, comme Mira passe le sien sur sa médaille.`,
    `« Il n’était pas courageux, vous savez. Il était descendu pour le loyer. Il avait peur des caves. Quand Paul était petit, c’est moi qui allais chercher le charbon. »`,
    { if: [['arch:AR23', '==', true]], t: `Vous sortez la lettre que vous avez trouvée dans sa poche de poitrine, la nuit de la gare. Vous ne l’avez jamais dépliée devant personne. Elle la lit deux fois. À la deuxième, ses lèvres bougent. Quand elle arrive à « ne vends pas la barque », elle ferme les yeux.` },
    { if: [['arch:AR23', '==', true]], t: `« Je l’ai vendue, dit-elle. Le mois dernier. Il n’y avait plus rien à manger. » Elle replie la lettre en quatre, très soigneusement, et la glisse dans son corsage. « Il a écrit qu’il pensait aux petits. Il n’a qu’un petit. Il disait toujours “les petits”, comme s’il en avait dix. Il était comme ça. Il voyait plus de monde qu’il n’y en avait. »` },
    { if: [['arch:AR23', '!=', true]], t: `« Il disait toujours : “Ne vends jamais la barque. Tant qu’on a la barque, on a à manger.” » Elle regarde l’anneau de fer, la corde coupée. « Je l’ai vendue le mois dernier. Il n’y avait plus rien. »` },
    `« À qui ? demandez-vous.`,
    `— Un homme avec des mains énormes. Il est venu à la nuit. Il a payé le double de ce qu’elle valait, sans discuter, et il est reparti à la rame vers l’amont. Il n’a pas dit son nom. Il sentait la farine. »`,
    `Elle se tait. Puis, plus bas :`,
    `« Et Paul est parti. »`,
    `Elle rentre dans la maison et revient avec un morceau de papier d’emballage plié. L’écriture est celle d’un garçon qui n’a pas beaucoup écrit, appliquée, avec des lettres qui penchent dans tous les sens.`
  ], choices: [{ t: 'Lire le mot de Paul', to: 'b1_3' }] },

  b1_3: { ch: 0, text: [
    `« Maman. Je pars là où on mange tous les jours. Les loups ont laissé du pain chez les Morel et Lucas dit que c’est le signe. Ils emmènent ceux qui veulent. Je reviendrai avec à manger pour toi. Ne pleure pas. Je prends le couteau de papa pour les poissons. Paul. »`,
    `« Il a quatorze ans, dit Marthe. Il croit qu’on peut revenir de partout. Son père croyait la même chose. »`,
    `Elle reprend son filet. Ses doigts tremblent un peu, puis plus du tout.`,
    `« Trois semaines. Les Morel ont perdu leur fille aussi. Et le petit Lucas. Et deux autres dans la rue d’après. Les gens disent qu’il y a un ogre dans la forêt de Vaumoise qui nourrit les enfants. Les gens disent n’importe quoi quand ils ont faim. » Elle tire sur une maille, trop fort. Le fil casse. « Mais Paul n’est pas revenu. »`,
    `Vous regardez la plaque qu’elle a posée sur ses genoux, sur le filet. Rang E. Vous pensez à l’équipe Delta qui ne s’est pas retournée. À la ligne de l’Association : aucune recherche engagée. Au coût estimé d’une recherche, supérieur à la valeur des disparus.`
  ], choices: [
    { t: '« Je vais le chercher. »', to: 'b1_4', set: { promise: true }, add: { comp: 1 } },
    { t: '« Je vais chercher qui a pris votre barque. Et votre fils avec. »', to: 'b1_4', set: { promise: true }, add: { comp: 1 } }
  ] },

  b1_4: { ch: 0, text: [
    `Marthe hoche la tête une seule fois. Elle ne vous remercie pas. Vous comprenez que ce n’est pas de l’ingratitude : elle a déjà été remerciée pour un mort par trois lignes mal orthographiées, et elle n’a plus confiance dans les promesses de l’Association, même quand elles portent un manteau.`,
    `« Si vous le trouvez, dit-elle enfin, dites-lui que je n’ai pas faim. Ce n’est pas vrai, mais dites-le-lui. »`,
    { if: T2_MIRA, t: `Mira vous attend au coin de la digue, assise sur une bitte d’amarrage, les jambes ballantes. Elle a tout entendu, évidemment. « La manne de Saint-Roch, dit-elle avant que vous ouvriez la bouche. Tous les mardis, avant l’aube. Du pain sur le seuil des maisons les plus pauvres des Brèches. Depuis deux ans. Personne ne sait d’où ça vient. J’ai essayé de savoir, une fois. Je me suis endormie. » Elle a l’air vexée de l’avouer. « On est lundi. »` },
    { if: T2_NOMIRA, t: `Au coin de la digue, un gamin des Brèches qui vend des allumettes vous interpelle. Il a entendu, lui aussi. « La manne de Saint-Roch, m’sieur. Le mardi, avant le jour. Du pain devant les portes. C’est les loups qui l’apportent, mais faut pas le dire, sinon ils reviennent plus. » Il hausse les épaules. « On est lundi. »` },
    `Le soir tombe sur le fleuve. Quelque part en amont, une barque que vous ne connaissez pas encore remonte le courant, ramée par des mains énormes.`
  ], choices: [{ t: 'Attendre l’aube dans les Brèches', to: 'b1_5' }] },

  b1_5: { ch: 0, reward: 350, text: [
    `Vous passez la nuit sur un toit de la rue Saint-Roch, le dos contre une cheminée froide. Les Brèches dorment mal : des toux derrière les volets, des bébés qui pleurent de faim, un homme qui crie dans son sommeil.`,
    `Vers quatre heures, ils arrivent.`,
    `Ce sont des loups. Six, sept, gris comme de la cendre, plus grands que des loups ordinaires, avec quelque chose de trop régulier dans la démarche, comme s’ils obéissaient à un rythme qu’eux seuls entendent. Chacun porte dans sa gueule un sac de toile. Ils ne courent pas. Ils marchent sur la pointe des pattes, pour ne réveiller personne.`,
    `Devant chaque porte qu’ils choisissent, l’un d’eux s’arrête, pose le sac sur le seuil, le pousse du museau contre le bois, et repart. Pas devant toutes les portes. Devant celles où l’on tousse, celles où l’on pleure, celles dont les volets sont cassés depuis longtemps.`,
    `Sur le flanc de chaque bête, la fourrure est brûlée en une forme précise : une clé. La même clé, sept fois.`,
    `Le dernier loup s’arrête au milieu de la rue. Il lève la tête vers votre toit. Il vous a senti. Il ne grogne pas. Il vous regarde comme un chien de berger regarde un étranger près du troupeau : sans haine, avec une immense fatigue.`
  ], choices: [
    { t: 'Les laisser finir leur tournée, puis les suivre', to: 'b2_1', set: { wolves: 'followed' }, add: { comp: 1 } },
    { t: 'Sauter dans la rue et les attaquer', to: 'b1_6', set: { wolves: 'attacked' }, add: { dom: 1 } }
  ] },

  b1_6: { ch: 0, archive: ['B09'], text: [
    `Vous tombez au milieu d’eux. Le premier lâche son sac pour se défendre. Le pain roule dans le caniveau.`
  ], combat: { name: 'Meute des Crocs', power: 80, weak: 'agi', resist: 'end', foe: 'loup_cendre',
    win: `Vous en abattez trois avant que les autres ne s’enfuient vers le sud, la queue basse, sans même essayer de vous mordre vraiment. Ils se battaient comme on se débat, pas comme on chasse.` },
  after: [
    `Le silence revient. Une porte s’ouvre. Une petite fille en chemise de nuit sort sur le seuil, voit les loups morts, voit le pain dans le caniveau, et se met à pleurer. Pas de peur. De faim.`,
    `« Ils vont plus revenir, dit-elle. Maintenant ils vont plus revenir. »`,
    `Sa mère la tire à l’intérieur et vous regarde par l’entrebâillement comme on regarde quelqu’un qui vient de casser la seule chose qui marchait encore dans la rue.`,
    `Vous ramassez le pain. Il est encore tiède. Vous le posez sur le seuil. La porte ne se rouvre pas.`,
    `Les traces des loups partent vers le sud. Vers la route de Vaumoise.`
  ], choices: [{ t: 'Suivre les traces', to: 'b2_1' }] },

  /* ------------------------------ CHAPITRE II ------------------------------ */
  b2_1: { ch: 1, archive: ['B01'], text: [
    { if: [['wolves', '==', 'followed']], t: `Vous suivez les loups à distance. Ils ne se pressent pas. À la dernière maison, ils se regroupent et descendent la rue Saint-Roch jusqu’au bout, là où elle se termine en cul-de-sac devant une ancienne boucherie aux volets cloués.` },
    { if: [['wolves', '==', 'attacked']], t: `Les traces de sang et de farine mêlés ne vont pas directement vers le sud. Elles descendent d’abord la rue Saint-Roch jusqu’au bout, là où elle se termine en cul-de-sac devant une ancienne boucherie aux volets cloués.` },
    `L’enseigne est tombée depuis longtemps. Il en reste un crochet rouillé et, peinte sur la façade, à moitié effacée par la pluie : BOUCHERIE KASK — VIANDES — CHARCUTERIE — DEPUIS 1961.`,
    `La porte de derrière n’est pas fermée. À l’intérieur, il fait chaud. Au fond de la boutique, derrière l’étal vide, un four à pain a été construit en briques, maladroitement, par quelqu’un qui n’était pas boulanger. Il est encore tiède. Le sol est blanc de farine. Il y a des traces de pattes partout, et une seule paire de traces de bottes, très grandes.`,
    `Les crochets à viande sont vides. Sur l’un d’eux, quelqu’un a accroché un dessin d’enfant, jauni, gondolé par l’humidité : un bonhomme énorme avec un tablier rouge, un couteau aussi grand que lui, et un sourire jusqu’aux oreilles. En dessous, en lettres capitales : PAPA BOUCHER.`,
    `Sur l’étal, sous une pierre qui sert de presse-papier, un carnet. Un vrai carnet de commerçant, à couverture de toile, avec des colonnes tirées à la règle. Les premières pages sont jaunies. Les dernières sont d’hier.`
  ], choices: [{ t: 'Ouvrir le carnet', to: 'b2_2' }] },

  b2_2: { ch: 1, text: [
    `Il y a des noms. Des familles des Brèches, rue par rue. En face de chaque nom, le nombre de bouches. En face du nombre de bouches, une colonne « pain ». Et une colonne que le boucher a intitulée, d’une écriture lourde : « Assez ? »`,
    `Certaines lignes ont une croix dans cette colonne. La plupart n’en ont pas.`,
    `Les pages les plus récentes sont les mêmes, mardi après mardi, et le nombre de lignes sans croix augmente.`,
    `Vous revenez à la première page. Elle est datée de l’Hiver de Vaumoise, il y a dix-neuf ans. Elle ne contient que quatre lignes.`,
    `« Élie : 1 ration. »`,
    `« Moi : 0. »`,
    `« Donné à une femme avec deux petits, pour la route du Sud : toute la réserve. Elle avait l’air de savoir où elle allait. »`,
    `Et, plus bas, d’une autre encre, onze jours plus tard, une seule ligne, sans colonne :`,
    `« Élie. »`,
    `Rien d’autre sur la page. Le reste du carnet commence l’année suivante, et à partir de là, il n’y a plus jamais un seul jour où la colonne « Assez ? » ne soit pas remplie avec un soin maniaque.`
  ], choices: [
    { t: 'Rapporter le carnet à Odile Fauré', to: 'b2_3', set: { carnet: 'odile' } },
    { t: 'Le garder pour vous et suivre la piste', to: 'b2_3', set: { carnet: 'kept' } }
  ] },

  b2_3: { ch: 1, bond: { odile: 1 }, text: [
    { if: [['carnet', '==', 'odile']], t: `Vous trouvez Odile à la Guilde, derrière sa table, devant un registre qui ressemble trait pour trait à celui du boucher. Vous posez le carnet ouvert à la première page à côté du sien. Elle lit. Elle s’arrête à la troisième ligne. Elle relit la troisième ligne. Ses mains, posées à plat sur la table, deviennent blanches aux jointures.` },
    { if: [['carnet', '==', 'kept']], t: `Vous comptiez garder le carnet. Mais en traversant la place de la Guilde, vous voyez Odile Fauré qui distribue des tickets de rationnement sous la pluie, et vos pieds vous mènent à sa table avant que vous l’ayez décidé. Vous posez le carnet ouvert à la première page à côté de son registre. Elle lit. Elle s’arrête à la troisième ligne. Ses mains, posées à plat sur la table, deviennent blanches aux jointures.` },
    `« Rue Saint-Roch, dit-elle très bas. Un boucher. Grand comme une porte. Il a vu Thomas tousser dans mes bras. Il est rentré dans sa boutique et il est ressorti avec un sac. Il n’a rien demandé. Il a dit : “Pour la route.” Je ne lui ai pas demandé son nom. Je ne lui ai même pas dit merci, je crois. Je pensais à la route. »`,
    `Elle pose le doigt sur la ligne suivante. « Élie. » Onze jours plus tard.`,
    `« Il avait un fils, dit-elle. Il m’a donné le pain de son fils. »`,
    { if: T2_MIRA, t: `Mira, qui s’était approchée sans bruit, lit par-dessus l’épaule de sa mère. Vous voyez le moment exact où elle comprend. Le pain de la route du Sud. Le pain que Thomas a mangé les trois derniers jours de sa vie. Le pain qui aurait pu être pour les marches de Sainte-Claire, et qui est parti ailleurs.` },
    { if: T2_MIRA, t: `« Le pain de mon frère », dit Mira. Elle ne dit rien d’autre. Elle ne regarde pas Odile. Mais elle ne s’en va pas non plus.` },
    `Odile referme les deux registres l’un sur l’autre. Elle reste un moment les mains posées dessus, comme on pose les mains sur un cercueil.`,
    `« J’ai compté toutes les bouches de cette ville pendant dix ans, dit-elle. Toutes. Sauf la sienne. »`
  ], choices: [{ t: '« Les loups portent une marque. Une clé. »', to: 'b2_4' }] },

  b2_4: { ch: 1, archive: ['B02'], text: [
    `Rue des Cloches, Théo écoute votre description sans arrêter de marteler un fer à cheval qu’il n’a aucune raison de forger, puisqu’il n’y a plus de chevaux aux Brèches depuis longtemps.`,
    `Quand vous dessinez la forme de la brûlure dans la poussière de son atelier, avec le bout de votre botte, le marteau s’arrête.`,
    `« Le panneton à trois dents, dit-il. Et l’anneau ovale. C’est la première. » Il pose le marteau. « J’en ai forgé neuf pour Varenne. Les huit premières, il les a données à des volontaires. Des gens qui voulaient être les premiers à monter son échelle. On les appelait les Huit. On disait ça avec respect, au début. »`,
    `Il fouille dans un tiroir de son établi, sous des clous, des limes et des factures jamais payées, et sort une feuille pliée en quatre, tachée d’huile. Une liste de huit noms, de la main d’Elias. En face de chaque nom, un numéro de clé et un mot. Théo pose son doigt couturé sur le premier.`,
    `« Lazare Pell. Clé I. Un docker. Un brave type. Il avait trois gosses et une peur bleue de la faim, parce qu’il avait connu l’Hiver de Vaumoise comme tout le monde ici. Varenne disait que la clé “amplifiait la volonté”. Il ne disait pas laquelle. »`,
    `Il replie la liste et vous la tend.`,
    `« Garde-la. Et écoute-moi bien, Joueur. Si tu trouves ces clés, toutes, ne les laisse pas traîner. Ne les donne à personne. Rapporte-les-moi. » Il regarde son moignon. « J’en ferai une charrue. C’est la seule chose qu’on puisse faire avec du fer qui a trop voulu. »`
  ], choices: [{ t: 'Prendre la route du Sud', to: 'b3_1', set: { theoPromise: true } }] },

  /* ------------------------------ CHAPITRE III ------------------------------ */
  b3_1: { ch: 2, text: [
    `La route du Sud quitte Vespérane par la porte de Vaumoise et s’enfonce dans la forêt en ligne droite, comme si celui qui l’avait tracée était pressé d’en sortir.`,
    `Elle est pleine de voitures.`,
    `Pas des épaves récentes : des voitures de l’Hiver de Vaumoise, dix-neuf ans plus tôt, quand la moitié des Brèches avait tenté de partir vers le Sud en même temps, et que la route s’était bouchée, et que les gens avaient continué à pied en laissant tout derrière eux. Personne ne les a jamais enlevées. Les arbres ont poussé à travers les toits. Des valises éventrées pendent encore aux galeries. Sur le pare-brise d’une petite voiture bleue, quelqu’un a écrit dans la poussière, il y a très longtemps, avec un doigt d’enfant : « On est où ? »`,
    { if: [['met:odile', '==', true]], t: `Odile a tenu à venir. Elle marche à côté de vous, un peu en retrait, son registre serré contre la poitrine comme un bouclier. Elle ne regarde pas les voitures. Elle connaît cette route. Elle l’a déjà faite dans l’autre sens, avec un enfant de deux ans dans les bras et une petite fille laissée derrière.` },
    `Au bout de deux heures de marche, l’odeur commence.`,
    `C’est une odeur douce, d’abord, presque agréable. Le pain chaud. Les pommes. La viande qui fume. Puis, en dessous, autre chose. Quelque chose de sucré et de lourd qui colle au fond de la gorge.`,
    `Au détour d’un virage, vous les voyez : des silos.`
  ], choices: [{ t: 'Approcher des silos', to: 'b3_2' }] },

  b3_2: { ch: 2, archive: ['B04'], text: [
    `Ils sont construits avec les voitures. Des dizaines de carcasses empilées, soudées, cerclées de fer, montées en tours rondes de dix ou quinze mètres de haut, avec des trappes à chaque étage. Il y en a partout entre les arbres. Une forêt de greniers.`,
    `Vous ouvrez la trappe la plus basse du premier silo. Une avalanche de grains vous tombe sur les bottes. Du blé, de l’orge, des pois secs. Et dans le blé, des vers. Des milliers. Le grain est gâté jusqu’au cœur. Il a été entassé bien au-delà de ce que quiconque pourrait manger, et il a pourri dans le noir, attendant un hiver qui ne vient pas.`,
    `Le deuxième silo est plein de pommes. Brunes, molles, fermentées. Le troisième de viande séchée, verte de moisissure. Le quatrième de pain. Des milliers de miches entassées jusqu’au toit, dures comme des pierres, couvertes d’un duvet blanc.`,
    `Sur la porte de chaque silo, peint à la main, le même panneau :`,
    `« RÉSERVE. NE PAS TOUCHER. AU CAS OÙ. »`,
    { if: [['met:odile', '==', true]], t: `Odile ouvre son registre par réflexe, puis le referme sans rien écrire. « Il y a là de quoi nourrir les Brèches pendant trois ans, dit-elle. Et tout est perdu. » Elle se tourne vers vous, et pour la première fois depuis que vous la connaissez, la femme de pierre a l’air d’avoir peur. « C’est ce que j’aurais fait, si j’avais eu une clé. Exactement ça. »` },
    `Quelque chose bouge sous le tas de grain du premier silo. Le blé se soulève en vagues. Une forme longue, articulée, couverte d’écailles de rouille, se déroule hors de la trappe.`
  ], choices: [{ t: 'Se mettre en garde', to: 'b3_3' }] },

  b3_3: { ch: 2, reward: 600, text: [
    `C’est un serpent. Ou c’était un serpent, avant qu’il ne mange le fer des voitures pendant dix ans. Son corps est fait de plaques de carrosserie qui grincent les unes sur les autres. Il garde les silos comme un chien garde une niche vide.`
  ], combat: { name: 'Serpent de rouille', power: 100, weak: 'end', resist: 'agi', foe: 'serpent_rouille',
    win: `Il frappe vite, mais il est lourd de tout ce qu’il a mangé. Vous tenez, vous encaissez, vous attendez qu’il se fatigue. Il s’effondre sur le tas de grain pourri, et ses écailles de tôle se détachent une à une avec un bruit de vaisselle cassée.` },
  after: [
    `Dans le ventre ouvert de la bête, au milieu des boulons et des enjoliveurs, il y a un objet qui n’est pas du fer de voiture : une gamelle militaire cabossée, et à l’intérieur, enveloppé dans de la toile cirée, un petit carnet.`,
    `Sur la couverture, au couteau : L. PELL.`
  ], choices: [{ t: 'Lire le carnet de Lazare Pell', to: 'b3_4' }] },

  b3_4: { ch: 2, archive: ['B03'], text: [
    `Vous lisez assis sur le marchepied d’un camion de déménagement, pendant que la lumière baisse. Le carnet est court. L’écriture devient de plus en plus grande à mesure qu’on avance, comme si l’homme qui écrivait voyait de moins en moins bien, ou criait de plus en plus fort.`,
    `Lazare Pell raconte les tests à l’observatoire. Les huit volontaires en rang dans le sous-sol. Elias Varenne qui leur parle doucement, comme un médecin. La clé posée sur la poitrine, froide, puis brûlante. Le Cœur qui chante.`,
    `« Varenne dit que la clé ne donne rien. Elle prend ce qu’on veut le plus et elle le rend plus grand. Il dit que c’est comme ça qu’on monte. Moi, ce que je veux le plus, c’est que mes gosses ne connaissent jamais ce que j’ai connu à Vaumoise. Alors depuis, j’entasse. »`,
    `Les pages suivantes sont des listes. Des quantités. Des tonnes. Des cachettes.`,
    `Puis, vers la fin, une phrase seule sur une page :`,
    `« Ma femme est partie avec les petits. Elle dit qu’elle ne peut pas vivre dans une cave pleine de conserves avec un homme qui ne dort plus. Elle dit qu’ils n’ont jamais eu faim. Je ne comprends pas ce qu’elle veut dire. »`,
    `Et la dernière page :`,
    `« J’ai laissé la clé sous le grand chêne, près de la route. Pour qu’elle arrête de me parler. Si quelqu’un la trouve, qu’il ne la ramasse pas. Elle parle avec la voix de ce qu’on aime. »`,
    `Le reste du carnet est vide.`
  ], choices: [{ t: 'Chercher le grand chêne', to: 'b3_5' }] },

  b3_5: { ch: 2, text: [
    `Le chêne n’est pas difficile à trouver. Il est au bord de la route, à l’endroit où la forêt s’ouvre en clairière, et il est immense. Pas grand comme un arbre : grand comme une église. Son tronc est creux, et par l’ouverture, haute comme trois hommes, sort une lumière chaude et une odeur de pain. Ses branches se penchent au-dessus de la route comme des bras qui voudraient retenir les voyageurs. La nuit, il bourdonne.`,
    `Les gens des Brèches l’appellent la Mère de Vaumoise.`,
    { if: [['met:odile', '==', true]], t: `Odile s’arrête net au bord de la clairière.` },
    { if: [['met:odile', '==', true]], t: `Elle regarde le chêne, puis le fossé au pied du chêne, à droite de la route. Il y a là une petite élévation de terre, couverte de mousse, que rien ne distingue des autres. Sauf qu’elle la reconnaît.` },
    { if: [['met:odile', '==', true]], t: `« Il n’y avait pas d’arbre, dit-elle. Il y avait juste un fossé et un poteau kilométrique. J’ai creusé avec une cuillère et une plaque d’immatriculation. Ça m’a pris toute la nuit. Le matin, j’ai planté le poteau à la tête, pour retrouver l’endroit. » Le poteau est là. Il a été englouti par l’écorce. Il dépasse encore du tronc, à hauteur d’homme, avec un chiffre à moitié lisible : 31. « Le chêne a poussé sur Thomas. »` },
    { if: [['met:odile', '!=', true]], t: `Au pied du chêne, dans le fossé, une petite élévation de terre, couverte de mousse. À la tête, un vieux poteau kilométrique a été englouti par l’écorce. Il dépasse encore du tronc, avec un chiffre à moitié lisible : 31. Quelqu’un a posé dessus, récemment, un morceau de pain.` },
    `Derrière l’ouverture du tronc, vous entendez des enfants rire.`
  ], choices: [
    { t: 'Rester un moment au pied du chêne, avec Odile', to: 'b4_1', set: { grave: true }, add: { comp: 1 }, req: [['met:odile', '==', true]], hidden: true },
    { t: 'Entrer dans le chêne', to: 'b4_1', set: { grave: false } }
  ] },

  /* ------------------------------ CHAPITRE IV ------------------------------ */
  b4_1: { ch: 3, archive: ['B05'], text: [
    { if: [['grave', '==', true]], t: `Vous restez avec Odile au pied du chêne jusqu’à ce que la nuit soit tout à fait tombée. Elle ne prie pas. Elle ne pleure pas. Elle reste assise dans le fossé, le dos contre l’écorce, une main posée sur la mousse. Au bout d’un long moment, elle dit : « Il avait vu un lièvre. Le deuxième jour. Il a ri. » Puis elle se relève, époussette sa jupe, et vous fait signe d’entrer.` },
    `À l’intérieur, le chêne est une ville.`,
    `Le tronc creux monte à perte de vue, et sur ses parois intérieures, quelqu’un a construit des planchers, des escaliers, des passerelles, des chambres, des cuisines, une école, un réfectoire. Des lanternes pendent partout. Il fait chaud. Ça sent le pain qui sort du four, la soupe, le linge propre. Des rires d’enfants descendent des étages.`,
    `Il y a des enfants partout. Soixante, peut-être plus. Ils ont entre cinq et quinze ans. Ils ont les joues rondes. Ils portent des vêtements propres, rapiécés avec soin. Certains épluchent des légumes à une longue table, d’autres récitent des tables de multiplication devant un tableau noir où quelqu’un a écrit à la craie : « 7 × 8 = 56 pains ». Une petite fille donne à manger à un loup gris qui la laisse lui tirer les oreilles.`,
    `Au-dessus de la porte du réfectoire, peint en grandes lettres sur une planche :`,
    `« ICI, PERSONNE N’A FAIM.`,
    `ICI, PERSONNE NE PART. »`,
    `En dessous, une liste de règles écrites à la main. Vous la lisez jusqu’au bout. La dernière règle est soulignée trois fois : « On ne jette rien. On garde tout. Au cas où. »`
  ], choices: [{ t: 'Chercher Paul', to: 'b4_2' }] },

  b4_2: { ch: 3, text: [
    `Vous le trouvez au fournil, en bas, près des racines. Un garçon de quatorze ans, maigre de partout sauf des joues, qui enfourne des miches avec une longue pelle de bois, en tablier, les avant-bras couverts de farine. Il a le visage de Basile. Pas les traits : l’expression. Cette façon de froncer les sourcils en se concentrant, comme si le monde entier tenait dans la tâche qu’il est en train de faire.`,
    `« Paul. »`,
    `Il sursaute. Il voit votre manteau. Son visage se ferme exactement comme celui de sa mère.`,
    `« L’Association ? Vous venez me chercher ? » Il serre la pelle. « Je ne rentre pas. »`,
    `Vous lui dites que sa mère vous envoie. Il baisse la pelle.`,
    `« Elle va bien ?`,
    `— Elle dit qu’elle n’a pas faim. »`,
    `Il rit, un rire bref, sans joie. « Elle dit toujours ça. Même quand elle mange les épluchures. » Il pose la pelle, s’essuie les mains, et vous fait signe de le suivre au fond du fournil. Là, derrière les sacs de farine, sous une couverture, il y a trois gros sacs de toile.`,
    `« Regardez. C’est pour elle. Je mets de côté tous les jours. Une miche par jour. Ruben dit que c’est bien, qu’il faut toujours garder de côté. Quand j’en aurai assez, je rentrerai, et elle n’aura plus jamais faim. »`,
    `Il soulève la couverture avec fierté. Une odeur aigre en sort. Il ne la sent pas. Il a l’habitude.`,
    `« Ici, on mange tous les jours, dit-il. Tous les jours. Vous savez ce que ça fait ? »`,
    `Vous savez. Vous ne répondez pas.`,
    `Derrière vous, le plancher craque. Quelque chose de très lourd vient de descendre l’escalier.`
  ], choices: [{ t: 'Se retourner', to: 'b4_3' }] },

  b4_3: { ch: 3, text: [
    `Il est grand comme une porte.`,
    `Ce n’est pas une image. Il doit se baisser pour passer sous les poutres du fournil, et ses épaules frôlent les deux murs. Il porte un tablier de boucher, rouge sombre, propre. Ses mains sont énormes, couvertes de farine jusqu’aux poignets. Son visage est celui d’un homme de soixante ans, bon et usé. Mais sa mâchoire est trop longue. Elle s’avance comme celle d’un loup, et quand il ouvre la bouche, ses dents sont des crocs.`,
    `Trois loups gris le suivent et s’asseyent à ses pieds.`,
    `« Le Joueur, dit Ruben Kask. Celui qui a des ombres. » Sa voix est douce, profonde, un peu traînante, la voix d’un homme qui parle aux enfants plus souvent qu’aux adultes. « Moi, j’ai des bêtes. Elles portent ce que je leur dis de porter. »`,
    { if: [['wolves', '==', 'attacked']], t: `Il regarde vos mains. « Tu en as tué trois, mardi. Rue Saint-Roch. La petite Clémence n’a pas eu son pain. » Ce n’est pas un reproche. C’est un compte. « Je les ai remplacés. J’ai toujours de quoi remplacer. »` },
    `Il ne vous attaque pas. Il fait un geste vers l’escalier, vers le réfectoire où les enfants commencent à se rassembler pour le dîner, avec leurs bols en bois et leurs cuillères.`,
    `« Viens. Assieds-toi. Mange. Ensuite, tu parleras. Personne ne parle bien le ventre vide. »`
  ], choices: [
    { t: 'S’asseoir à sa table et manger', to: 'b4_4a', set: { table: true }, add: { comp: 1 } },
    { t: '« Je ne mange pas à la table d’un geôlier. »', to: 'b4_4b', set: { table: false }, add: { dom: 1 } }
  ] },

  b4_4a: { ch: 3, text: [
    `Vous vous asseyez au bout de la longue table, entre une fillette qui n’a plus de dents de devant et un garçon qui vous dévisage sans gêne. Paul s’assied en face. Ruben ne s’assied pas : il fait le tour de la table avec une marmite énorme et remplit chaque bol, le vôtre en dernier.`,
    `C’est une soupe épaisse, avec des légumes, des haricots, un morceau de lard. Le pain est encore chaud. C’est la meilleure chose que vous ayez mangée depuis des mois.`,
    `Ruben ne mange pas. Il reste debout au bout de la table, les bras croisés sur son tablier, et il regarde les enfants manger. Il les regarde comme on regarde le feu, l’hiver. Il compte les bols vides. Il en remplit un deuxième, un troisième. Un petit garçon demande s’il peut avoir encore du pain, et Ruben en sort un de sa poche, comme un magicien.`,
    `« Tu vois, dit-il quand vous avez fini. Ici, personne n’a faim. Dehors, il y a la faim. Ici, il n’y en a pas. C’est simple. »`,
    `Vous lui demandez pourquoi personne ne part.`,
    `« Ceux qui partent tombent malades. » Il dit cela sans méchanceté, avec une tristesse sincère. « La petite Morel est partie, le mois dernier. Elle voulait voir sa mère. Trois jours après, elle était plus maigre qu’en arrivant. Elle est revenue en rampant. Dehors, ça vous mange de l’intérieur. Le monde est comme ça, maintenant. Il faut rester où il y a assez. »`,
    `Vous fermez les yeux. Une fenêtre bleue s’ouvre derrière vos paupières.`,
    { sys: 'Clé I détectée.\nEffet : rétention.\nRayon : forêt de Vaumoise, route du Sud, quartier des Brèches.\nTout ce qui entre dans le rayon du Grenier lui appartient. Tout ce qui en sort est réclamé.' },
    `Vous comprenez. Ce n’est pas le monde qui affame ceux qui partent. C’est la clé. Elle tire tout vers le Grenier : les récoltes des fermes de Vaumoise, le pain des Brèches, la graisse des corps de ceux qui s’éloignent. Les Brèches ont faim parce que le Grenier se remplit. Et chaque mardi, Ruben leur rapporte une petite part de ce que sa clé leur a pris, et il croit leur faire l’aumône.`,
    `Ruben vous regarde. Il ne voit pas la fenêtre. Il voit seulement que vous avez mangé, et il est content.`
  ], choices: [{ t: 'Repartir pour la nuit, sans rien dire encore', to: 'b5_1' }] },

  b4_4b: { ch: 3, text: [
    `Ruben ne se fâche pas. C’est pire. Il a l’air blessé, comme un vieil homme dont on refuse le gâteau.`,
    `« Geôlier. » Il répète le mot, lentement, comme pour le goûter. « Tu crois que je les enferme. » Il secoue sa tête énorme. « Je les nourris. C’est tout. Ils peuvent partir quand ils veulent. Seulement ceux qui partent tombent malades. Ce n’est pas moi. C’est le dehors. »`,
    `Il fait un geste. Les trois loups se lèvent et vous encadrent, sans montrer les dents, comme des chiens qui raccompagnent un invité vers la porte.`,
    `« Va-t’en, Joueur. Tu reviendras quand tu auras faim. Tout le monde revient quand il a faim. »`,
    `Dehors, dans la clairière, au pied de la Mère de Vaumoise, vous fermez les yeux. Une fenêtre bleue s’ouvre derrière vos paupières.`,
    { sys: 'Clé I détectée.\nEffet : rétention.\nRayon : forêt de Vaumoise, route du Sud, quartier des Brèches.\nTout ce qui entre dans le rayon du Grenier lui appartient. Tout ce qui en sort est réclamé.' },
    `Vous comprenez. Ce n’est pas le monde qui affame ceux qui partent. C’est la clé. Elle tire tout vers le Grenier : les récoltes des fermes de Vaumoise, le pain des Brèches, la graisse des corps de ceux qui s’éloignent. Les Brèches ont faim parce que le Grenier se remplit. Et chaque mardi, Ruben leur rapporte une petite part de ce que sa clé leur a pris, et il croit leur faire l’aumône.`,
    `Derrière vous, dans le chêne, les enfants chantent le bénédicité avant le dîner. Ils chantent faux et fort. Ils sont heureux.`
  ], choices: [{ t: 'Revenir le lendemain', to: 'b5_1' }] }
};

/* ==========================================================================
   TOME II — « Le Pain de chaque jour » — chapitres 5 à 8, issues, archives
   ========================================================================== */

Object.assign(T2_NODES, {

  /* ------------------------------ CHAPITRE V ------------------------------ */
  b5_1: { ch: 4, text: [
    `Odile insiste pour voir Ruben seule.`,
    `Vous la laissez entrer dans le chêne et vous restez à la porte de la cuisine, là où on peut entendre sans être vu. Ce n’est pas très honnête. Vous le faites quand même. Il y a des conversations dont on sait qu’elles changeront quelque chose, et qu’on n’a pas le droit de manquer.`,
    `Ruben est en train de pétrir. Il pétrit toujours, dit Paul, même la nuit, même quand il n’y a plus de place dans les silos. Ses avant-bras plongent dans la pâte jusqu’aux coudes.`,
    `« Hiver de Vaumoise, dit Odile. Une femme avec deux enfants, devant ta boutique. Un petit qui toussait. Tu es rentré, et tu es ressorti avec un sac. »`,
    `Les mains de Ruben s’arrêtent dans la pâte.`,
    `Il ne se retourne pas. Il reste longtemps immobile, penché sur le pétrin, comme un homme qui écoute une musique très lointaine.`,
    `« Il toussait comme un chiot, dit-il enfin. Il avait un bonnet rouge. J’ai pensé : mon Élie est solide. Mon Élie a quatre ans, il mange comme deux, il tiendra bien une semaine sans. » Il reprend la pâte entre ses mains, mais il ne pétrit plus. Il la tient. « Il a tenu onze jours. »`,
    `Odile ne dit rien.`,
    `« Et le tien ? »`,
    `« Trois jours, dit Odile. Il est mort le troisième jour, au kilomètre 31. Je l’ai enterré dans le fossé. Ton chêne a poussé dessus. »`,
    `Le silence dans la cuisine est si lourd que vous entendez le four respirer.`,
    `« Alors mon fils est mort pour trois jours de plus du tien, dit Ruben.`,
    `— Oui. »`,
    `Elle ne l’adoucit pas. Elle ne dit pas que ce n’était pas sa faute, ni la sienne à lui. Elle a passé dix-neuf ans à compter. Elle sait qu’on ne ment pas sur les comptes.`,
    `Ruben se retourne enfin. Ses yeux sont rouges. Sa mâchoire de loup tremble.`,
    `« Trois jours, répète-t-il. Est-ce qu’il a ri, pendant ces trois jours ? »`,
    `Odile ferme les yeux.`,
    `« Une fois. Le deuxième jour. Il a vu un lièvre traverser la route. Il a ri si fort qu’il s’est remis à tousser. »`,
    `Et Ruben Kask, Monarque des Crocs, porteur de la première clé, lâche la pâte et se couvre le visage de ses mains pleines de farine, et il rit et il pleure en même temps, avec un bruit terrible, comme un animal qui apprend à parler.`,
    { if: T2_MIRA, t: `Mira est entrée sans que personne l’entende. Elle se tient près de la porte, les bras croisés, le visage dur. « Moi, j’étais restée sur les marches, dit-elle à Ruben. Votre pain, je ne l’ai pas eu. » Ruben la regarde à travers ses doigts. « Mais je suis là, ajoute-t-elle. Et lui, il a vu un lièvre. Alors ça a servi à quelque chose. » Elle sort aussi vite qu’elle est entrée. Odile la regarde partir comme on regarde un oiseau qui s’est posé une seconde sur sa main.` }
  ], choices: [{ t: 'Entrer dans la cuisine', to: 'b5_2' }] },

  b5_2: { ch: 4, text: [
    `Quand vous entrez, Ruben s’est rassis sur un sac de farine qui s’est affaissé sous son poids. Il a l’air très vieux.`,
    `« Je ne dors plus, dit-il. Depuis dix-neuf ans. Il faut toujours compter. Les sacs, les bouches, les jours. Si j’arrête de compter une nuit, quelqu’un aura faim le lendemain. » Il frotte ses yeux. « Je suis fatigué, Joueur. »`,
    `Il lève vers vous un regard où il y a autant de ruse que de détresse. Les deux ne s’excluent pas, chez un homme qui a eu faim.`,
    `« Je te propose un marché. Tu veux le petit Ternaux. Et les autres, ceux qui veulent rentrer. Je te les rends. Tous. Mais il me faut quelqu’un qui reste. Quelqu’un qui sache compter, qui reste ici pour toujours et qui veille sur le Grenier à ma place, la nuit, pendant que je dors. Un seul. Ça ne fait pas cher pour soixante enfants. »`,
    `Odile pose son registre sur la table.`,
    `« Je sais compter », dit-elle.`,
    `Elle le dit simplement, sans héroïsme, comme on propose de faire la vaisselle. Ruben la regarde. Il hoche la tête lentement. Il a l’air soulagé. Odile a l’air soulagée aussi, et c’est ce qui vous fait peur : elle a l’air de quelqu’un qui a enfin trouvé où payer une dette.`
  ], choices: [
    { t: 'Accepter l’échange et repartir avec Paul et les enfants', to: 'end_b_D' },
    { t: '« Personne ne restera ici prisonnier. Ni elle ni personne. »', to: 'b5_3', set: { hostage: 'none' }, add: { comp: 1 } },
    { t: '« Je reste, moi. Pas elle. »', to: 'b5_3', set: { hostage: 'self' }, add: { comp: 1 } }
  ] },

  b5_3: { ch: 4, archive: ['B07'], text: [
    { if: [['hostage', '==', 'self']], t: `Ruben vous regarde longtemps. Puis il secoue la tête. « Non. Toi, tu as des gens qui t’attendent. Ça se voit, tu as les poches pleines de choses qui ne sont pas à toi. » Il se tourne vers Odile. « Elle aussi, d’ailleurs. » Il fait un geste vers la porte par où Mira est sortie, ou vers celle par où elle aurait pu entrer. « Personne ne reste. Le marché est annulé. » Il dit ça d’un ton bourru, et il retourne à son pétrin.` },
    { if: [['hostage', '==', 'none']], t: `Ruben se lève d’un bond. Les loups se dressent. Pendant une seconde, vous voyez le Monarque derrière le boulanger : la mâchoire qui s’allonge, les yeux qui jaunissent. Puis Odile pose sa main sur son bras énorme, très doucement, et il se rassied. « Personne », répète-t-il, comme s’il apprenait un mot étranger. Il retourne à son pétrin sans rien ajouter.` },
    `Cette nuit-là, Paul vient vous trouver près des fours. Il a enlevé son tablier. Il tient à la main une feuille pliée.`,
    `« J’ai ouvert les sacs », dit-il.`,
    `Il ne pleure pas. Il a le visage de quelqu’un qui s’est trompé dans un calcul très important et qui vient de s’en apercevoir.`,
    `« Tout est pourri. Toutes les miches. Il y a des vers dedans. J’ai gardé tout ça pour maman, une par jour, pendant trois semaines, et c’est pourri. » Il vous regarde. « Pourquoi ça pourrit ? Ruben garde tout, et ses silos aussi ils pourrissent. Je l’ai vu. Il les cache, mais je l’ai vu. »`,
    `Vous ne savez pas quoi lui répondre. Alors vous lui dites la seule chose qui vous vient : que le pain est fait pour le jour où on le cuit. Que celui qu’on garde pour demain, on le vole un peu à aujourd’hui.`,
    `Paul réfléchit. Puis il vous tend la feuille.`,
    `« J’ai trouvé ça dans le tablier de Ruben. Je fouille, des fois. » C’est un reçu. Le reçu d’une barque, achetée quai des Pêcheurs, payée le double de sa valeur. Au dos, de l’écriture lourde de Ruben : « Pour quand le petit Ternaux rentrera. Ne pas la mettre dans un silo. »`,
    `« Elle est derrière le silo nord, dit Paul. Il l’a amarrée dans le ruisseau. Il la repeint le dimanche. Il dit que c’est pour quand je rentrerai. » Il fronce les sourcils, exactement comme son père. « Mais il ne veut pas que je rentre. Je ne comprends pas. »`,
    `Vous non plus. Ou plutôt si : vous comprenez trop bien. Ruben veut que Paul puisse rentrer, et il ne supporte pas qu’il parte. Il a acheté la barque pour le jour où il aurait le courage d’ouvrir la main. Ce jour n’est jamais venu.`
  ], choices: [{ t: '« Ta mère t’attend, Paul. Elle a vendu la barque pour manger. Et il l’a rachetée pour toi. »', to: 'b6_1', set: { paulKnows: true } }] },

  /* ------------------------------ CHAPITRE VI ------------------------------ */
  b6_1: { ch: 5, text: [
    `Le lendemain, un loup arrive des Brèches sans sac. Il boite. Derrière lui, sur la route, un gamin des Pêcheurs court à perdre haleine avec un message d’Hélène.`,
    `« La faim s’accélère. Trois morts cette semaine aux Brèches. Les champs de Vaumoise sont secs alors qu’il a plu. Les poules ne pondent plus. Odile, reviens : la Guilde ne sait plus compter sans toi. — H. »`,
    `Le Grenier a doublé de volume en une nuit. Il y a de nouveaux silos entre les arbres, des carcasses de voitures soudées à la hâte, des trappes qui ne ferment plus. Ruben ne dort plus du tout. Il court d’un silo à l’autre en comptant à voix haute. Depuis la conversation dans la cuisine, depuis le mot « personne », il a peur. Et sa peur fait travailler la clé.`,
    `Vous allez voir Théo, qui vous a suivi jusqu’à l’orée de la forêt sans vouloir y entrer.`,
    `« Une clé, ça ne pense pas, dit-il. Ça prend ce que tu crains de perdre, et ça le garde pour toi. Ça le garde si bien que tu ne peux plus rien avoir d’autre. » Il crache dans le fossé. « Lazare avait peur que ses gosses aient faim. La clé a gardé tellement de nourriture que ses gosses sont partis. Ce boucher a peur que des enfants meurent de faim. Devine ce que la clé est en train de faire à la ville. »`,
    { if: [['met:gaspard', '==', true]], t: `Gaspard, qui est venu avec lui en clopinant, la main posée sur son nom écrit au stylo, ajoute doucement : « Le Cœur est un miroir. Il ne rend pas ce qu’on lui donne. Il rend ce qu’on craint. En plus grand. »` }
  ], choices: [{ t: 'Retourner au chêne', to: 'b6_2' }] },

  b6_2: { ch: 5, reward: 800, text: [
    `Quand vous entrez dans la clairière, la Mère de Vaumoise se réveille.`,
    `Ses racines sortent de terre comme des bras qui se dégagent d’une couverture. Ses branches se referment au-dessus de la route. L’écorce se fend autour du vieux poteau kilométrique numéro 31, et une voix sort du tronc, une voix de bois et de vent, qui ne prononce aucun mot mais qui fait trembler l’air comme une berceuse grondée.`,
    `Ce n’est pas Ruben qui l’a réveillée. C’est la clé, qui sent qu’on vient lui prendre ce qu’elle garde.`
  ], combat: { name: 'La Mère de Vaumoise', power: 128, weak: 'int', resist: 'end', foe: 'mere_vaumoise',
    win: `Vous ne coupez pas les racines. Vous cherchez, au milieu du tronc, ce qui fait battre l’arbre comme un cœur, et vous comprenez que ce n’est pas la clé : c’est la petite tombe au pied. Vous posez la main sur l’écorce, au-dessus du poteau 31. Les branches s’immobilisent. La berceuse s’éteint.` },
  after: [
    { if: [['met:odile', '==', true]], t: `Odile s’approche et pose la main à côté de la vôtre. Elle dit un prénom. Le chêne frissonne de haut en bas, une seule fois, comme un enfant qui s’endort.` },
    `Une fenêtre bleue s’ouvre.`,
    { sys: 'Gardien du Grenier neutralisé.\nClé I : instable.\nPorteur : en état de panique.' }
  ], choices: [{ t: 'Entrer dans le Grenier', to: 'b6_3' }] },

  b6_3: { ch: 5, text: [
    `À l’intérieur, les enfants sont rassemblés dans le réfectoire. Ruben a fermé toutes les portes. Il a cloué des planches sur l’ouverture du tronc, de l’intérieur, et posté des loups à chaque escalier.`,
    `« Personne ne sort ! crie-t-il. Dehors, ils meurent ! Hélène Varenne l’a écrit : trois morts ! Vous voyez bien ! Ici, on est à l’abri ! »`,
    `Les enfants ont peur. Pas de lui. De sa peur.`,
    { if: [['met:kael', '==', true]], t: `Kaël est entré avec vous. Il voit les enfants serrés les uns contre les autres, et quelque chose remonte en lui depuis très loin : un couloir blanc, un ascenseur, des petits qui pleurent avant une piqûre. Sans réfléchir, il s’accroupit devant le plus jeune et fait une grimace. Une vraie, avec les yeux qui louchent et la langue sur le côté. Le petit le regarde, sidéré. Puis il rit. Puis un autre. Kaël fait une autre grimace. Il ne sait pas pourquoi il sait faire ça. Il le fait quand même.` },
    { if: [['met:nour', '==', true]], t: `Nour s’assoit sur une marche de l’escalier et se met à chanter. Pas une berceuse : une chanson de marché, une chanson à compter, de celles qu’on chante en sautant à la corde. « Un pain pour aujourd’hui, deux pains c’est pour l’ennui… » Les enfants la connaissent. Ils reprennent. Les loups couchent les oreilles et s’allongent.` },
    `Paul se fraie un chemin jusqu’à Ruben. Il est tout petit à côté de lui. Il lève la tête.`,
    `« Ruben. Mes sacs ont pourri. Tous. »`,
    `Ruben le regarde sans comprendre.`,
    `« Les vôtres aussi, dit Paul. Je les ai vus. Tous les silos. Vous gardez tout et ça pourrit, et dehors maman a faim, et vous lui rapportez du pain le mardi, mais c’est son pain à elle que vous lui rapportez. Vous lui volez et vous lui rendez. »`,
    `Le visage de Ruben se décompose.`,
    `Et puis la clé, dans sa poitrine, s’allume comme une braise sur laquelle on souffle.`
  ], choices: [{ t: 'S’interposer entre Ruben et les enfants', to: 'b7_1' }] },

  /* ------------------------------ CHAPITRE VII ------------------------------ */
  b7_1: { ch: 6, reward: 1300, text: [
    `La transformation n’est pas rapide. Elle est lente, comme une chose qui se fait depuis des années et qui n’a plus besoin de se cacher.`,
    `Les loups se lèvent et marchent vers Ruben, et entrent en lui. Pas en le mordant : en se fondant dans son corps, comme de l’eau dans de la farine. Il grandit. Sa mâchoire s’allonge jusqu’à toucher sa poitrine. Ses mains de boulanger deviennent des pattes, puis des pattes avec des doigts. Dans sa poitrine, à travers le tablier déchiré, la clé brûle, une clé de fer noir à trois dents.`,
    `Il ne crie pas. Il gémit. Le gémissement d’un homme qui a faim depuis dix-neuf ans et qui n’a jamais rien mangé.`,
    `« Tu veux me les prendre, dit le Monarque des Crocs. Tout le monde veut me les prendre. »`
  ], combat: { name: 'Ruben Kask, Monarque des Crocs', power: 150, weak: 'agi', resist: 'str', foe: 'm_crocs',
    win: `Il frappe comme on se protège, toujours vers ce qu’il garde, jamais vers vous. Vous l’attirez loin des enfants, au milieu des silos, et vous le fatiguez. Quand il tombe enfin, c’est sur un tas de sacs de farine qui éclatent sous lui. Un nuage blanc monte jusqu’aux lanternes. Pendant un instant, on dirait qu’il neige à l’intérieur du chêne.` },
  after: [
    `Il est à genoux dans la farine. Les loups sortent de lui un à un, comme des enfants qui quittent les jupes de leur mère, et vont s’asseoir à distance. Sa mâchoire se rétracte à moitié. La clé palpite dans sa poitrine, à découvert.`,
    `« Vas-y, dit-il. Prends-la. Tu verras qu’on ne peut plus la lâcher. Tu verras ce que c’est, d’avoir toujours peur qu’il n’y en ait pas assez. »`
  ], choices: [
    { t: 'Sortir le pain de votre poche et le lui tendre', to: 'b7_2', set: { ruben: 'fed' }, add: { comp: 1 } },
    { t: 'Prendre la clé et garder le Grenier', to: 'end_b_B', add: { dom: 1 } },
    { t: 'L’achever', to: 'end_b_C', set: { ruben: 'killed' }, add: { dom: 1 } }
  ] },

  b7_2: { ch: 6, text: [
    `C’est la miche que vous avez prise à sa table, ou une miche de la Guilde, ou un quignon ramassé dans le caniveau de la rue Saint-Roch. Elle est un peu écrasée. Ce n’est pas un très beau pain.`,
    `Vous la lui tendez.`,
    `Ruben la regarde longtemps, comme une chose qu’il ne reconnaît plus. Il a fait du pain toute sa vie. Il en a donné à des milliers de gens. Personne, depuis dix-neuf ans, ne lui en a tendu.`,
    `« Il reste du pain ? » demande-t-il. C’est une vraie question.`,
    `Vous dites oui. Il en reste. Pour aujourd’hui.`,
    `Il prend la miche entre ses deux mains énormes. Il la rompt en deux. Il en met une moitié de côté, par réflexe, sur un sac. Il vous regarde. Il reprend la moitié, et il la mange aussi.`,
    `Il mange lentement. À petites bouchées. Comme quelqu’un qui découvre qu’on peut avoir assez.`,
    `Au fur et à mesure qu’il mange, sa mâchoire redevient celle d’un homme. Ses mains redeviennent des mains de boulanger. La clé, dans sa poitrine, cesse de briller, puis se détache de lui toute seule, sans bruit, et tombe dans la farine.`,
    `Ruben Kask, boucher de la rue Saint-Roch, s’essuie la bouche avec le dos de sa main.`,
    `« C’était bon », dit-il. Et il s’endort sur place, assis dans la farine, pour la première fois depuis dix-neuf ans.`,
    { sys: 'Clé I : libérée.\nPorteur : aucun.\nEffet de rétention : interrompu.' }
  ], choices: [{ t: 'Le laisser dormir', to: 'b8_1' }] },

  /* ------------------------------ CHAPITRE VIII ------------------------------ */
  b8_1: { ch: 7, archive: ['B08'], text: [
    `Ruben dort deux jours et deux nuits. Pendant ce temps, vous ouvrez les silos.`,
    `C’est un travail énorme. Il faut trier ce qui est encore bon et ce qui ne l’est plus. Il faut brûler le grain plein de vers, enterrer la viande verte, jeter les pommes. La fumée monte au-dessus de la forêt de Vaumoise pendant trois jours, et depuis Vespérane, les gens croient que le Monarque des Cendres est revenu.`,
    `Ce qui reste est encore immense. Odile organise tout : elle réquisitionne les charrettes de la Guilde, elle trace des itinéraires, elle compte. Mais cette fois, elle compte dans l’autre sens. Pas combien il faut garder : combien on peut donner aujourd’hui sans que rien ne pourrisse demain.`,
    `Les enfants du Grenier choisissent. La plupart rentrent chez eux. Ils ne tombent pas malades en chemin : la clé ne réclame plus rien. Certains restent quelques jours de plus, pour aider, pour finir une partie de billes, pour dire au revoir aux loups. Personne ne les en empêche.`,
    `Quand Ruben se réveille, il trouve la cuisine du chêne propre et vide, un seul sac de farine contre le mur, et un mot d’Odile sur le pétrin : « Pour aujourd’hui. Pour demain, on verra demain. — O. F. »`,
    `Il pétrit. Il fait exactement le nombre de miches qu’il faut pour le jour. Pas une de plus. Ses mains tremblent la première fois. La deuxième fois, moins.`,
    `Il garde la recette sur un bout de papier, punaisé au-dessus du four. Elle tient en une ligne.`
  ], choices: [{ t: 'Ramasser la clé dans la farine', to: 'b8_2' }] },

  b8_2: { ch: 7, text: [
    `La clé I est froide, maintenant. Une clé de fer noir, à trois dents, à l’anneau ovale. Elle pèse plus lourd qu’elle ne devrait. Quand vous la tenez, vous entendez très loin, comme au fond d’un puits, une voix qui ressemble à celle des gens que vous aimez et qui vous dit : garde. Garde, au cas où.`,
    `Vous fermez la main sur elle. La voix se tait.`
  ], choices: [
    { t: 'La rapporter à Théo, comme promis', to: 'b8_3', set: { key: 'theo' }, req: [['theoPromise', '==', true]] },
    { t: 'La confier à Zacharie, pour le fond du fleuve', to: 'b8_3', set: { key: 'river' }, req: [['met:zach', '==', true]], hidden: true },
    { t: 'La garder sur vous, sans l’utiliser', to: 'b8_3', set: { key: 'kept' } }
  ] },

  b8_3: { ch: 7, bond: { theo: 2 }, text: [
    { if: [['key', '==', 'theo']], t: `Rue des Cloches, Théo prend la clé du bout des doigts, comme on prend un insecte. Il la pose sur l’enclume. Il ne la frappe pas. Il la regarde. « Une », dit-il. Puis il la range dans une boîte en fer, vide, avec huit emplacements creusés dans du feutre. Il y en a neuf en tout. Il en a forgé neuf. « Une sur neuf. Ramène-moi les autres, Joueur. Et je te ferai le plus beau soc de charrue que cette ville ait jamais vu. »` },
    { if: [['key', '==', 'river']], t: `Zacharie prend la clé et la soupèse. « Le fleuve ne la gardera pas, dit-il. Le fleuve ne garde rien, c’est pour ça qu’il est propre. Mais il l’emportera assez loin pour qu’elle n’appelle plus personne. » Il la laisse tomber par-dessus le bord de sa barque. Elle ne fait presque pas de bruit. Plus tard, vous apprendrez que Théo, en l’apprenant, a grogné pendant une heure. Puis qu’il a dit : « Bon. Il en reste huit. »` },
    { if: [['key', '==', 'kept']], t: `Vous gardez la clé dans votre poche, à côté de la plaque de Basile que Marthe vous a rendue en disant : « Gardez-la, vous. Moi, je l’ai, lui. » Certaines nuits, la clé murmure. Vous apprenez à ne pas l’écouter. Vous apprenez aussi qu’on ne s’habitue jamais tout à fait.` },
    `Le mardi suivant, avant l’aube, vous êtes au quai des Pêcheurs.`,
    `Marthe est assise devant sa porte, sur son tabouret, un filet sur les genoux. Elle ne dort pas. Elle n’a pas dormi depuis trois semaines. Paul arrive par la digue en courant, son couteau à poisson à la ceinture, sans sac, sans rien. Elle se lève. Le filet tombe dans l’eau. Elle ne le ramasse pas.`,
    `Ils ne disent rien pendant longtemps. Puis Paul dit : « J’avais gardé du pain pour toi, mais il a pourri. » Et Marthe dit : « Je n’ai pas faim. » Et ils rient tous les deux, et c’est la première fois que vous entendez Marthe Ternaux rire.`,
    `C’est à ce moment qu’une barque remonte le fleuve. Une barque fraîchement repeinte en bleu, avec, en lettres blanches sur la proue, un nom que Basile y avait peint vingt ans plus tôt et que quelqu’un a soigneusement repassé : LE MARDI.`,
    `Ruben rame. Il a remis son tablier de boucher. Il n’a plus de crocs. Il a l’air gêné comme un homme qui arrive en retard à un enterrement. Il amarre la barque à l’anneau de fer, sans un mot, et tend la corde à Marthe.`,
    `« Elle n’était pas à vendre, dit-il. C’est moi qui n’aurais pas dû l’acheter. »`,
    `Marthe regarde la barque, puis l’homme. Elle sait qui il est. Tout le quartier le sait, depuis une semaine.`,
    `« Vous avez faim ? » demande-t-elle.`,
    `Ruben ne sait pas quoi répondre. Personne ne lui a posé la question depuis dix-neuf ans.`
  ], choices: [{ t: 'Les laisser', to: 'end_b_A' }] },

  /* ------------------------------ ISSUES ------------------------------ */
  end_b_A: { ch: 7, ending: 'A', text: [
    `Depuis ce jour, la boulangerie Kask a rouvert rue Saint-Roch, dans l’ancienne boucherie. L’enseigne repeinte dit : PAIN DU JOUR. Ruben ouvre à cinq heures, ferme quand il n’y a plus rien. Il ne fait jamais une miche de plus que ce qu’il faut. Les soirs où il en reste, il les porte lui-même aux portes des Brèches. Il frappe. Il attend qu’on ouvre. Il ne pose plus rien sur les seuils la nuit.`,
    `Le mardi, il va pêcher avec Paul et Marthe sur Le Mardi. Il ne sait pas pêcher. Paul lui apprend, comme son père le lui avait appris. Ruben ne prend jamais rien. Il dit que ça ne le dérange pas, que les poissons, au moins, ont le droit de partir.`,
    `Les loups gris sont restés. Ils dorment devant la boulangerie et les enfants des Brèches leur tirent les oreilles.`,
    `Odile passe chaque matin chercher une miche. Une seule. Elle la paye. Ruben refuse la monnaie, elle insiste, ils se disputent un peu, c’est devenu leur façon de se dire bonjour. Parfois, elle reste. Ils parlent d’Élie et de Thomas, sans tristesse particulière, comme on parle de deux garçons qui auraient joué ensemble s’ils en avaient eu le temps.`,
    { if: T2_MIRA, t: `Un jour, Mira vient avec elle. Elle commande deux miches. « Une pour moi, dit-elle. Une pour elle. » Odile ne dit rien. Elle prend la miche que sa fille lui tend comme on prend un enfant qu’on vous rend.` },
    `Dans la forêt de Vaumoise, les silos rouillent en paix. Les arbres poussent à travers. Le grand chêne bourdonne toujours la nuit, mais plus doucement. Au pied, quelqu’un dépose une miche fraîche chaque mardi. Elle est mangée le soir même par les renards. C’est très bien comme ça.`,
    `Le Système enregistre l’événement à sa manière.`,
    { sys: 'Monarque des Crocs : neutralisé.\nClé I : sans porteur.\nRéserve du Grenier : redistribuée.\nRemarque : le Joueur n’a rien gardé. Comportement non optimal.' },
    `Vous fermez la fenêtre. Vous avez faim. C’est une bonne faim, celle de quelqu’un qui va manger ce soir.`
  ] },

  end_b_B: { ch: 6, ending: 'B', text: [
    `Vous arrachez la clé de la poitrine de Ruben. Elle est brûlante. Elle colle à votre paume comme si elle avait toujours été là.`,
    `Ruben s’effondre, redevenu un vieil homme, et vous regarde avec une pitié immense. « Ah, dit-il seulement. Ah, Joueur. »`,
    `Les premiers jours, vous faites mieux que lui. Vous êtes plus fort, plus organisé. Vous ouvrez les portes du Grenier : les enfants peuvent partir, si vous le décidez. Vous distribuez le pain aux Brèches, plus souvent, plus largement. La ville vous bénit.`,
    `Mais la clé parle. La nuit, elle vous dit : et si l’hiver revient ? Et si la récolte manque ? Et si ceux que tu aimes ont faim, un jour, à cause de ce que tu as donné aujourd’hui ?`,
    `Alors vous gardez un peu. Juste un peu. Au cas où.`,
    `Un an plus tard, il y a deux fois plus de silos dans la forêt de Vaumoise. Les Brèches ont faim. Vous leur rapportez du pain le mardi. Vous ne vous souvenez plus très bien de qui l’a fait en premier, de Ruben ou de vous.`,
    `Paul est rentré chez sa mère. Il ne vient plus vous voir. Il a dit à Mira, qui vous l’a répété sans méchanceté : « Il est devenu comme l’autre. En plus poli. »`,
    `Vous ne dormez plus. Il faut toujours compter.`
  ] },

  end_b_C: { ch: 6, ending: 'C', text: [
    `Le coup est rapide. Ruben ne se défend pas. Il regarde, jusqu’au dernier moment, la porte du réfectoire derrière laquelle les enfants sont cachés, comme s’il comptait encore les bols.`,
    `La clé se détache toute seule de son corps. Le Grenier se met à grincer.`,
    `Sans porteur, la clé lâche tout ce qu’elle retenait, d’un seul coup. Les silos éclatent. Le grain pourri se répand dans la forêt, les pommes fermentées, la viande verte. Les rats arrivent par milliers. Les enfants s’enfuient dans tous les sens, et certains ne retrouvent pas le chemin des Brèches avant des jours.`,
    `La famine ne s’arrête pas tout de suite. Ce qui avait été pris aux Brèches pendant des années est perdu, gâté, dispersé. L’hiver qui suit est dur. Odile compte de nouveau. Elle ne vous parle plus beaucoup.`,
    `Paul est rentré. Il a grandi d’un coup. Il ne pêche plus. Il travaille à l’abattoir de la Guilde, où l’on paie bien les garçons qui n’ont pas peur du sang.`,
    `Un soir, il vous croise dans la rue Saint-Roch, devant l’ancienne boucherie fermée. Il s’arrête. « Il gardait une barque pour moi, dit-il. Il la repeignait le dimanche. » Il hausse les épaules. « Elle a coulé avec le reste. »`,
    `Vous aviez débarrassé la ville d’un Monarque. La ville avait faim d’autre chose que de pain, et vous ne le lui avez pas donné.`
  ] },

  end_b_D: { ch: 4, ending: 'D', text: [
    `Vous acceptez.`,
    `Odile ne vous regarde pas. Elle enlève son manteau, le plie, le pose sur un sac de farine, retrousse ses manches, et s’assied à la table de Ruben avec son registre. Elle ouvre une page blanche. Elle trace des colonnes à la règle.`,
    `Le lendemain matin, vous repartez sur la route du Sud avec Paul et quarante-trois enfants. Ils chantent. Ils ne tombent pas malades en chemin : le Grenier a son gardien, la clé est contente.`,
    `Marthe serre son fils contre elle sur le quai des Pêcheurs pendant si longtemps que Paul finit par demander s’il peut respirer.`,
    { if: T2_MIRA, t: `Mira apprend la nouvelle le soir même. Elle ne crie pas. Elle prend la route du Sud, seule, à pied, avec un sac. Elle revient trois jours plus tard, sans sa mère. « Elle dit qu’elle est bien, dit Mira. Elle dit que c’est la première fois depuis dix-neuf ans qu’elle sait exactement où elle doit être. » Elle jette le sac dans un coin. « Elle dit qu’elle me laisse un compte à la Guilde. À mon nom. Il n’y a rien dessus. Seulement mon nom. »` },
    `Le Grenier de Vaumoise existe toujours. Il est mieux tenu qu’avant. Il ne pourrit plus rien : Odile compte trop bien. Les Brèches ont un peu moins faim qu’avant, un peu plus que s’il n’existait pas.`,
    `Le mardi, deux personnes déposent du pain aux portes : un boucher et une intendante. On dit qu’ils ne parlent jamais. On dit qu’ils comptent ensemble, chacun de son côté de la table, chacun ses morts, jusqu’à l’aube.`,
    `Vous aviez sauvé soixante enfants. Il vous a fallu longtemps pour comprendre ce qu’on vous avait demandé en échange, et que vous aviez payé avec la vie de quelqu’un d’autre.`
  ] }
});

/* ---------- Archives du Tome II (préfixe B) ---------- */
Object.assign(ARCHIVES, {
  B01: { t: 'Le carnet du boucher — première page', body: `Hiver de Vaumoise.\nÉlie : 1 ration.\nMoi : 0.\nDonné à une femme avec deux petits, pour la route du Sud : toute la réserve. Elle avait l’air de savoir où elle allait.\n\n[Onze jours plus tard, autre encre :]\nÉlie.` },
  B02: { t: 'Liste des Huit de l’Échelle (fragment)', body: `De la main d’E. Varenne.\nI — Lazare Pell, docker. « Craint la faim. »\nII — I. V., infirmière. « Craint la douleur. »\nIII — M. O., médecin. « Craint la contagion. »\nIV — [déchiré]\nV — H. C., ingénieur. « Craint le gâchis. »\nVI — [taché d’huile]\nVII — [illisible]\nVIII — O. T., magistrat. « Craint l’injustice. »\nIX — réservée.\n\nEn bas, au crayon : « La clé amplifie ce qu’on craint. Est-ce une échelle ou un puits ? »` },
  B03: { t: 'Journal de Lazare Pell', body: `Varenne dit que la clé ne donne rien. Elle prend ce qu’on veut le plus et elle le rend plus grand. Il dit que c’est comme ça qu’on monte.\n\nMa femme est partie avec les petits. Elle dit qu’ils n’ont jamais eu faim. Je ne comprends pas ce qu’elle veut dire.\n\nJ’ai laissé la clé sous le grand chêne, près de la route. Pour qu’elle arrête de me parler. Si quelqu’un la trouve, qu’il ne la ramasse pas. Elle parle avec la voix de ce qu’on aime.` },
  B04: { t: 'Règlement du Grenier', body: `1. Ici, personne n’a faim.\n2. On se lave les mains avant de pétrir.\n3. On ne tire pas la queue des loups (les oreilles, ça va).\n4. On apprend à compter. Le pain, ça se compte.\n5. Ici, personne ne part. Dehors, il y a la faim.\n6. On ne jette rien. On garde tout. Au cas où.\n\n[Ajouté par une main d’enfant, en bas :]\n7. Ruben dit bonne nuit à tout le monde, même aux grands.` },
  B05: { t: 'Relevé du Système — clé I', body: `Objet : clé I (porteur : R. Kask).\nEffet : rétention.\nRayon : 11 km.\nRessources captées depuis l’activation : estimation impossible.\nTaux de perte par pourrissement : 71 %.\nRemarque : le porteur redistribue chaque semaine 0,4 % des ressources captées. Il appelle ce geste « la manne ».` },
  B06: { t: 'Le mot de Paul', body: `Maman. Je pars là où on mange tous les jours. Les loups ont laissé du pain chez les Morel et Lucas dit que c’est le signe. Ils emmènent ceux qui veulent. Je reviendrai avec à manger pour toi. Ne pleure pas. Je prends le couteau de papa pour les poissons.\nPaul.` },
  B07: { t: 'Reçu de la barque', body: `Vendu par M. Ternaux, quai des Pêcheurs : une barque de pêche, coque bleue, nom effacé.\nPrix convenu : 40. Payé : 80.\n\nAu dos, écriture lourde :\nPour quand le petit Ternaux rentrera. Ne pas la mettre dans un silo. La repeindre le dimanche. Repasser le nom.` },
  B08: { t: 'La recette de Ruben', body: `Punaisée au-dessus du four de la boulangerie Kask, rue Saint-Roch :\n\nFarine, eau, sel, levain.\nPour aujourd’hui.` },
  B09: { t: 'Ce que les loups portaient', body: `Inventaire d’un sac de toile resté dans le caniveau, rue Saint-Roch :\n— une miche de pain bis, tiède ;\n— un morceau de lard enveloppé dans du papier ;\n— une pomme ;\n— un bout de papier : « Pour Clémence, qui tousse. Garder la pomme pour demain. »` }
});
